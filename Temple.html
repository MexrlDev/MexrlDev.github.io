<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TempleOS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', 'Fira Code', monospace;
        }

        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            image-rendering: auto;
            background: #000;
        }

        #boot-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.35s ease;
            flex-direction: column;
            gap: 24px;
        }

        #boot-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #boot-btn {
            background: #0a0a0a;
            border: 2px solid #3a3a3a;
            color: #b8b8b8;
            font-family: 'Courier New', monospace;
            font-size: 1.4rem;
            padding: 18px 44px;
            cursor: pointer;
            letter-spacing: 5px;
            transition: all 0.2s ease;
            border-radius: 2px;
            text-transform: uppercase;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        #boot-btn:hover {
            border-color: #7a7a7a;
            color: #ffffff;
            background: #141414;
            box-shadow: 0 0 40px rgba(180, 180, 180, 0.06);
        }

        #boot-btn:active {
            transform: scale(0.97);
            border-color: #aaa;
            background: #1a1a1a;
        }

        #boot-hint {
            color: #3a3a3a;
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            pointer-events: none;
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 0.35;
            }
            50% {
                opacity: 0.75;
            }
        }

        @media (max-width: 600px) {
            #boot-btn {
                font-size: 1rem;
                padding: 14px 28px;
                letter-spacing: 3px;
            }
            #boot-hint {
                font-size: 0.6rem;
                letter-spacing: 2px;
            }
        }

        @media (min-width: 2560px) {
            #boot-btn {
                font-size: 2.2rem;
                padding: 28px 64px;
                letter-spacing: 8px;
                border-width: 3px;
            }
            #boot-hint {
                font-size: 1rem;
                letter-spacing: 5px;
            }
        }
    </style>
</head>
<body>
    <iframe
    src="https://templeos.reiko.app/"
    title="TempleOS"
    allow="autoplay; clipboard-write"
    loading="eager"
    id="templeos-frame">
</iframe>

<div id="boot-overlay">
    <button id="boot-btn">⬡ BOOT TEMPLEOS</button>
    <span id="boot-hint">click to start</span>
</div>

<script>
    (function() {
        const overlay = document.getElementById('boot-overlay');
        const bootBtn = document.getElementById('boot-btn');
        const iframe = document.getElementById('templeos-frame');

        function bootEmulator() {
            if (overlay.classList.contains('fade-out')) return;
            overlay.classList.add('fade-out');

            setTimeout(function() {
                if (overlay.parentNode) {
                    overlay.remove();
                }
            }, 350);

            try {
                iframe.focus();
                if (iframe.contentWindow) {
                    iframe.contentWindow.focus();
                }
            } catch (e) {}
        }

        bootBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            e.preventDefault();
            bootEmulator();
        });

        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) {
                bootEmulator();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (!overlay.classList.contains('fade-out') &&
                (e.key === 'Enter' || e.key === ' ' || e.code === 'Space')) {
                e.preventDefault();
                bootEmulator();
            }
        });

        iframe.addEventListener('load', function() {
            try {
                iframe.contentWindow && iframe.contentWindow.focus();
            } catch (e) {}
        });
    })();
</script>
</body>
</html>
