<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JSMAF Emulator – PlayStation Vue</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="canvas" width="1920" height="1080"></canvas>

<!-- UI Overlay (main menu) -->
<div id="ui">
  <h1>JSMAF Emulator</h1>
  <div id="dropzone">Drop .js script here<br>or click to choose file</div>
  <input type="file" id="fileInput" accept="*">
  <textarea id="textarea" placeholder="Paste your JSMAF script code here..."></textarea>
  <div>
    <button class="btn" id="runBtn">Run Script (UI)</button>
    <button class="btn btn-success" id="runLogBtn">Run Log Mode</button>
    <button class="btn" id="clearBtn">Clear</button>
    <button class="btn btn-danger" id="exitBtn">Exit</button>
  </div>
  <div id="keyhelp">
    Keys: Arrows=DPad | Z=Cross | X=Circle | C=Triangle | V=Square | Q/E=L1/R1 | 1/3=L2/R2 | Space=R3 | Shift=L3 | Enter=Touchpad
  </div>
</div>

<!-- Log Console (for log mode) -->
<div id="logConsole">
  <div class="log-header">
    <span class="log-title">JSMAF Log Console</span>
    <div class="log-actions">
      <button class="btn" id="copyLogsBtn">Copy Logs</button>
      <button class="btn btn-danger" id="clearLogsBtn">Clear Logs</button>
      <button class="btn" id="closeLogBtn">Close</button>
    </div>
  </div>
  <div class="log-content" id="logContent"></div>
</div>

<!-- Custom Alert Modal -->
<div id="alertModal">
  <div class="alert-box">
    <div class="alert-message" id="alertMessage">Alert</div>
    <button class="alert-ok" id="alertOkBtn">OK</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
