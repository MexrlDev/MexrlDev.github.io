<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JSMAF — PS4 Vue Emulator</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    /* ══ TOKENS ═══════════════════════════════════════════ */
    :root {
      --bg:     #060810;
      --surf:   #0c1220;
      --surf2:  #131e33;
      --surf3:  #1c2a44;
      --border: #1e2e4a;
      --acc:    #0560e0;
      --acc2:   #1a7bff;
      --glow:   rgba(5,96,224,.22);
      --text:   #d8e2f8;
      --dim:    #496080;
      --green:  #00d26a;
      --red:    #ff3f40;
      --yellow: #ffc300;
      --cyan:   #00d4d4;
      --ui:     'Barlow Condensed', sans-serif;
      --mono:   'Share Tech Mono', monospace;
    }

    /* ══ RESET ════════════════════════════════════════════ */
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: var(--ui);
    }

    /* ══ VIEWS ════════════════════════════════════════════ */
    .view { position: absolute; inset: 0; display: flex; flex-direction: column; }
    .view.off { display: none; }

    /* ══ TOP BAR ══════════════════════════════════════════ */
    .bar {
      height: 46px; flex-shrink: 0;
      display: flex; align-items: center; gap: 6px;
      padding: 0 14px;
      background: var(--surf);
      border-bottom: 1px solid var(--border);
      user-select: none;
    }
    .bar-logo {
      font-family: var(--ui); font-weight: 700;
      font-size: 19px; letter-spacing: 3px;
      color: #fff; text-transform: uppercase; white-space: nowrap;
    }
    .bar-logo em {
      font-style: normal; color: var(--acc2);
      font-size: 11px; letter-spacing: 2px; margin-left: 7px;
    }
    .fx { flex: 1; }
    .bar-status { font-family: var(--mono); font-size: 12px; letter-spacing: 1px; white-space: nowrap; }
    .bar-status.ok  { color: var(--green); }
    .bar-status.err { color: var(--red); }

    /* ══ BUTTONS ══════════════════════════════════════════ */
    .btn {
      font-family: var(--ui); font-size: 13px; font-weight: 600;
      letter-spacing: .5px; padding: 5px 13px;
      background: var(--surf2); color: var(--text);
      border: 1px solid var(--border); border-radius: 4px;
      cursor: pointer; white-space: nowrap;
      transition: background .12s, border-color .12s;
      -webkit-appearance: none; user-select: none;
    }
    .btn:hover  { background: var(--surf3); border-color: var(--acc); }
    .btn:active { transform: scale(.96); }
    .btn.prim {
      background: var(--acc); border-color: var(--acc); color: #fff;
      box-shadow: 0 0 20px var(--glow);
    }
    .btn.prim:hover { background: var(--acc2); box-shadow: 0 0 30px rgba(26,123,255,.38); }
    .btn.ghost { border-color: transparent; background: transparent; }
    .btn.ghost:hover { background: var(--surf2); border-color: var(--border); }

    /* ══ EDITOR VIEW ══════════════════════════════════════ */
    #ed-body {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      padding: 18px 20px 16px; gap: 10px;
    }
    #ed-label {
      font-family: var(--mono); font-size: 11px;
      font-weight: 400; letter-spacing: 1.5px; color: var(--dim);
    }
    #code-editor {
      flex: 1; min-height: 0;
      background: var(--surf); color: #9ecfff;
      border: 1px solid var(--border); border-radius: 4px;
      padding: 14px 16px; font-family: var(--mono);
      font-size: 13px; line-height: 1.65;
      resize: none; outline: none;
      caret-color: var(--acc2); tab-size: 2;
      transition: border-color .2s;
    }
    #code-editor:focus { border-color: var(--acc); }
    #code-editor::placeholder { color: var(--dim); opacity: .7; }
    #ed-foot {
      display: flex; align-items: center;
      justify-content: space-between; gap: 12px; flex-shrink: 0;
    }
    #ed-hint { font-family: var(--mono); font-size: 11px; color: var(--dim); }
    #run-btn { font-size: 15px; font-weight: 700; letter-spacing: 2px; padding: 11px 32px; }

    /* ══ EMULATOR SCREEN ══════════════════════════════════ */
    #screen-section {
      flex: 1; min-height: 0;
      background: #000; position: relative; overflow: hidden;
    }
    #screen-wrap {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    /* Scanline overlay */
    #screen-wrap::after {
      content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 5;
      background: repeating-linear-gradient(
        0deg, rgba(0,0,0,.045) 0, rgba(0,0,0,.045) 1px,
        transparent 1px, transparent 3px
      );
    }
    /* Blue edge vignette — the design's signature element */
    #screen-wrap::before {
      content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 4;
      background: radial-gradient(ellipse at center, transparent 70%, rgba(5,96,224,.18) 100%);
    }
    #screen {
      width: 1920px; height: 1080px;
      background: #080810; position: absolute;
      transform-origin: 0 0; overflow: hidden;
    }
    #screen .dobj  { position: absolute; transform-origin: 0 0; overflow: hidden; }
    #screen .dtext {
      font-family: Arial, Helvetica, sans-serif; line-height: 1.3;
      white-space: pre-wrap; word-wrap: break-word; pointer-events: none;
    }
    #screen .dimage {
      background-size: contain; background-repeat: no-repeat;
      background-position: center; pointer-events: none;
    }
    #res-label {
      position: absolute; bottom: 6px; right: 10px; z-index: 6;
      font-family: var(--mono); font-size: 9px;
      color: rgba(255,255,255,.18); pointer-events: none; letter-spacing: 1px;
    }

    /* ══ CONTROLLER ═══════════════════════════════════════ */
    #ctrl-section {
      background: var(--surf); border-top: 1px solid var(--border);
      padding: 10px 16px; flex-shrink: 0;
      display: flex; justify-content: center; align-items: center;
    }
    .ctrl-wrap {
      display: flex; align-items: center;
      gap: 18px; max-width: 580px; width: 100%;
    }
    .ctrl-side {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; gap: 5px;
    }
    .ctrl-mid {
      flex-shrink: 0; display: flex; flex-direction: column;
      align-items: center; gap: 6px;
    }
    .ctrl-row { display: flex; gap: 4px; align-items: center; }

    /* Cross/face button grids — CSS grid with explicit placement */
    .xgrid {
      display: grid;
      grid-template-columns: repeat(3, 34px);
      grid-template-rows:    repeat(3, 34px);
      gap: 2px;
    }
    .xgrid .cbtn:nth-child(1) { grid-column: 2; grid-row: 1; }
    .xgrid .cbtn:nth-child(2) { grid-column: 1; grid-row: 2; }
    .xgrid .cbtn:nth-child(3) { grid-column: 3; grid-row: 2; }
    .xgrid .cbtn:nth-child(4) { grid-column: 2; grid-row: 3; }

    .cbtn {
      display: flex; align-items: center; justify-content: center;
      width: 34px; height: 34px;
      background: var(--surf2); border: 1px solid var(--border);
      border-radius: 5px; color: var(--text);
      font-family: var(--ui); font-size: 11px; font-weight: 700;
      cursor: pointer; user-select: none; flex-shrink: 0;
      transition: background .08s, transform .06s, border-color .08s;
    }
    .cbtn:active, .cbtn.on {
      background: var(--acc); border-color: var(--acc2); transform: scale(.88);
    }
    .cbtn.trg  { width: 40px; background: var(--surf3); font-size: 10px; }
    .cbtn.spc  { width: 48px; background: var(--surf3); font-size: 10px; letter-spacing: .3px; }
    .cbtn.stk  { border-radius: 50%; width: 30px; height: 30px; font-size: 9px; background: var(--surf3); }
    .cbtn.dpad { background: var(--surf3); font-size: 14px; }

    /* Face button colours */
    .fc-x  { border-color: #2d6aaa; color: #5aadff; }
    .fc-o  { border-color: #aa2d2d; color: #ff6060; }
    .fc-sq { border-color: #6a3aaa; color: #b08bff; }
    .fc-tr { border-color: #2d8a55; color: #60d090; }
    .fc-x.on,  .fc-x:active  { background: #0e2848; }
    .fc-o.on,  .fc-o:active  { background: #480e0e; }
    .fc-sq.on, .fc-sq:active { background: #280e48; }
    .fc-tr.on, .fc-tr:active { background: #0e3820; }

    .ctrl-hint {
      font-family: var(--mono); font-size: 9px;
      color: var(--dim); text-align: center; line-height: 1.6;
    }

    /* ══ CONSOLE LOG ══════════════════════════════════════ */
    #log-section {
      background: var(--surf); border-top: 1px solid var(--border);
      flex-shrink: 0; overflow: hidden;
      transition: height .18s ease; height: 112px;
    }
    #log-section.shut { height: 0; }
    #log-out {
      height: 100%; overflow-y: auto;
      padding: 5px 10px;
      font-family: var(--mono); font-size: 11.5px; line-height: 1.6;
    }
    .ll { word-break: break-all; }
    .ll::before { content: '▸ '; opacity: .35; }
    .ll-info    { color: #7ab2f8; }
    .ll-debug   { color: var(--dim); }
    .ll-error   { color: var(--red); }
    .ll-success { color: var(--green); }
    .ll-warn    { color: var(--yellow); }

    /* ══ FILE MODAL ═══════════════════════════════════════ */
    #modal-bg {
      position: fixed; inset: 0; z-index: 900;
      background: rgba(0,0,0,.75); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    #modal-bg.off { display: none; }
    #file-modal {
      background: var(--surf); border: 1px solid var(--border); border-radius: 8px;
      width: 100%; max-width: 700px; max-height: 78vh;
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,.88);
    }
    .mhd {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 14px; border-bottom: 1px solid var(--border);
      font-weight: 700; font-size: 13px; letter-spacing: 1px; flex-shrink: 0;
    }
    .mbd { flex: 1; display: flex; min-height: 0; }
    #f-list {
      width: 46%; border-right: 1px solid var(--border);
      overflow-y: auto; padding: 6px;
    }
    .fi {
      padding: 6px 10px; border-radius: 3px; cursor: pointer;
      font-family: var(--mono); font-size: 11.5px; color: var(--text);
      transition: background .1s; word-break: break-all;
    }
    .fi:hover { background: var(--surf2); }
    .fi.sel   { background: var(--surf3); border-left: 2px solid var(--acc); }
    #f-prev {
      flex: 1; padding: 10px 12px; overflow-y: auto;
      font-family: var(--mono); font-size: 11px;
      color: var(--dim); line-height: 1.55;
      white-space: pre-wrap; word-break: break-all;
    }
    .empty {
      text-align: center; padding: 30px 16px;
      color: var(--dim); font-size: 12px; font-family: var(--mono);
    }

    /* ══ TOAST ════════════════════════════════════════════ */
    #toast {
      position: fixed; top: 54px; left: 50%;
      transform: translateX(-50%) translateY(0);
      background: var(--surf3); border: 1px solid var(--acc);
      border-radius: 5px; color: var(--text);
      padding: 9px 18px; font-family: var(--mono); font-size: 12px;
      z-index: 1000; pointer-events: none; white-space: nowrap;
      max-width: 92vw; overflow: hidden; text-overflow: ellipsis;
      transition: opacity .22s, transform .22s;
    }
    #toast.off { opacity: 0; transform: translateX(-50%) translateY(-10px); }

    /* ══ SCROLLBARS ═══════════════════════════════════════ */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ══ RESPONSIVE ═══════════════════════════════════════ */
    @media (max-width: 600px) {
      #ed-body { padding: 12px; gap: 8px; }
      #run-btn { padding: 10px 22px; font-size: 14px; }
      .bar { height: 40px; padding: 0 10px; }
      .bar-logo { font-size: 15px; }
      .btn { font-size: 12px; padding: 4px 10px; }
      .cbtn { width: 28px; height: 28px; font-size: 9px; }
      .cbtn.trg { width: 34px; }
      .cbtn.spc { width: 40px; font-size: 9px; }
      .cbtn.stk { width: 25px; height: 25px; }
      .cbtn.dpad { font-size: 11px; }
      .xgrid { grid-template-columns: repeat(3,28px); grid-template-rows: repeat(3,28px); }
      .ctrl-wrap { gap: 10px; }
      #log-section { height: 80px; }
      #log-out { font-size: 10.5px; }
    }
    @media (max-width: 380px) {
      .cbtn { width: 24px; height: 24px; font-size: 8px; }
      .cbtn.trg { width: 30px; }
      .cbtn.spc { width: 34px; }
      .xgrid { grid-template-columns: repeat(3,24px); grid-template-rows: repeat(3,24px); }
      .ctrl-wrap { gap: 6px; }
    }
    @media (max-height: 500px) and (orientation: landscape) {
      #log-section { height: 60px; }
      #ctrl-section { padding: 6px 10px; }
      .cbtn { width: 26px; height: 26px; font-size: 9px; }
      .xgrid { grid-template-columns: repeat(3,26px); grid-template-rows: repeat(3,26px); }
    }
  </style>
</head>
<body>

<!-- ════════════════════════════════════════════════════
  EDITOR VIEW
════════════════════════════════════════════════════ -->
<div id="editor-view" class="view">
  <div class="bar">
    <span class="bar-logo">JSMAF <em>PS4 EMU</em></span>
    <span class="fx"></span>
    <button class="btn ghost" id="btn-keymap">ℹ KEY MAP</button>
    <button class="btn" id="btn-files-ed">📁 FILES</button>
  </div>

  <div id="ed-body">
    <div id="ed-label">// paste your jsmaf script below — then press run</div>
    <textarea id="code-editor" spellcheck="false" placeholder="// PlayStation Vue JSMAF Environment
//

// t.x = 300; t.y = 460;

//   if (keyCode === 14) log('Cross pressed!');   // ✕
//   if (keyCode === 13) log('Circle pressed!');  // ○
// };"></textarea>
    <div id="ed-foot">
      <span id="ed-hint">Ctrl+Enter to run &nbsp;·&nbsp; Tab inserts 2 spaces</span>
      <button class="btn prim" id="run-btn">▶ &nbsp;RUN SCRIPT</button>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════════════
  EMULATOR VIEW
════════════════════════════════════════════════════ -->
<div id="emu-view" class="view off">
  <div class="bar">
    <button class="btn ghost" id="btn-back">← EDIT</button>
    <span class="fx"></span>
    <span class="bar-status ok" id="emu-status">● RUNNING</span>
    <span class="fx"></span>
    <button class="btn" id="btn-files-emu">📁 FILES</button>
    <button class="btn" id="btn-tog-log">LOG ▾</button>
    <button class="btn" id="btn-clr-log">CLEAR</button>
  </div>

  <!-- 1920×1080 display -->
  <div id="screen-section">
    <div id="screen-wrap">
      <div id="screen"></div>
      <div id="res-label">1920 × 1080</div>
    </div>
  </div>

  <!-- PS4 Controller — embedded, not floating -->
  <div id="ctrl-section">
    <div class="ctrl-wrap">

      <!-- Left side: L2 L1 · D-pad · L3 -->
      <div class="ctrl-side">
        <div class="ctrl-row">
          <button class="cbtn trg" data-key="8">L2</button>
          <button class="cbtn trg" data-key="10">L1</button>
        </div>
        <div class="xgrid">
          <!-- nth-child 1→top 2→left 3→right 4→bottom -->
          <button class="cbtn dpad" data-key="4">▲</button>
          <button class="cbtn dpad" data-key="7">◀</button>
          <button class="cbtn dpad" data-key="5">▶</button>
          <button class="cbtn dpad" data-key="6">▼</button>
        </div>
        <div class="ctrl-row">
          <button class="cbtn stk" data-key="1">L3</button>
        </div>
      </div>

      <!-- Center: Options · Touchpad · keyboard hint -->
      <div class="ctrl-mid">
        <div class="ctrl-row">
          <button class="cbtn spc" data-key="3">OPT</button>
          <button class="cbtn spc" data-key="16">⊙ TP</button>
        </div>
        <div class="ctrl-hint">
          ↑↓←→ = D-pad<br>
          Z=✕ &nbsp;X=○ &nbsp;A=□ &nbsp;S=△<br>
          Q=L1 &nbsp;E=R1 &nbsp;1=L2 &nbsp;3=R2
        </div>
      </div>

      <!-- Right side: R1 R2 · Face buttons · R3 -->
      <div class="ctrl-side">
        <div class="ctrl-row">
          <button class="cbtn trg" data-key="11">R1</button>
          <button class="cbtn trg" data-key="9">R2</button>
        </div>
        <div class="xgrid">
          <!-- △ top · □ left · ○ right · ✕ bottom -->
          <button class="cbtn fc-tr" data-key="12">△</button>
          <button class="cbtn fc-sq" data-key="15">□</button>
          <button class="cbtn fc-o"  data-key="13">○</button>
          <button class="cbtn fc-x"  data-key="14">✕</button>
        </div>
        <div class="ctrl-row">
          <button class="cbtn stk" data-key="2">R3</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Console log (collapsible) -->
  <div id="log-section">
    <div id="log-out"></div>
  </div>
</div>

<!-- ════════════════════════════════════════════════════
  FILE BROWSER MODAL
════════════════════════════════════════════════════ -->
<div id="modal-bg" class="off">
  <div id="file-modal">
    <div class="mhd">
      <span>📁 VIRTUAL FILESYSTEM</span>
      <button class="btn" id="close-modal">✕ CLOSE</button>
    </div>
    <div class="mbd">
      <div id="f-list"></div>
      <div id="f-prev"><div class="empty">Select a file to preview</div></div>
    </div>
  </div>
</div>

<!-- Toast notification -->
<div id="toast" class="off"></div>

<script>
/* ════════════════════════════════════════════════════════
   VIRTUAL FILESYSTEM
════════════════════════════════════════════════════════ */
var VFS = Object.create(null);

function vfsPath(raw) {
  var s = String(raw).replace('file://', '');
  // handle ../download0/... paths
  var m = s.match(/\.\.\/download0\/(.*)/);
  if (m) return '/download0/' + m[1];
  if (s.indexOf('download0/') === 0) return '/' + s;
  if (s.charAt(0) !== '/') return '/' + s;
  return s;
}

/* ════════════════════════════════════════════════════════
   LOGGING
════════════════════════════════════════════════════════ */
var logOut = document.getElementById('log-out');

function addLog(type, msg) {
  var d = document.createElement('div');
  d.className = 'll ll-' + type;
  d.textContent = String(msg);
  logOut.appendChild(d);
  logOut.scrollTop = logOut.scrollHeight;
}

window.log   = function(m) { addLog('info',  m); };
window.debug = function(m) { addLog('debug', m); };
window.error = function(m) { addLog('error', m); };
window._log  = window.log;   // some JSMAF scripts reference _log

/* ════════════════════════════════════════════════════════
   SCRIPT EXECUTION
   Uses indirect eval so `var` declarations made by user
   scripts land on window — enabling shared globals across
   jsmaf.include() calls, exactly as the PS4 runtime does.
════════════════════════════════════════════════════════ */
function execScript(code) {
  (0, eval)(code);
}

/* ════════════════════════════════════════════════════════
   JSMAF ENVIRONMENT  (fixed, complete)
════════════════════════════════════════════════════════ */
var JSMAF = (function () {

  /* ── DisplayObject base ───────────────────────────── */
  function DO(p) {
    p = p || {};
    this.x = p.x || 0;       this.y = p.y || 0;
    this.width  = p.width  || 0; this.height = p.height || 0;
    this.alpha   = (p.alpha   !== undefined) ? p.alpha   : 1;
    this.visible = (p.visible !== undefined) ? p.visible : true;
    this.scaleX  = p.scaleX  || 1; this.scaleY = p.scaleY || 1; this.scaleZ = p.scaleZ || 1;
    this.rotateX = p.rotateX || 0; this.rotateY = p.rotateY || 0; this.rotateZ = p.rotateZ || 0;
    this.clip      = !!p.clip;
    this.clipX     = p.clipX     || 0; this.clipY      = p.clipY      || 0;
    this.clipWidth = p.clipWidth || 0; this.clipHeight  = p.clipHeight  || 0;
    this.children  = p.children  || [];
    this._type = 'display';
  }

  /* ── Image ────────────────────────────────────────── */
  function JImage(p) {
    DO.call(this, p); p = p || {};
    this._type = 'image';
    this.url    = p.url    || '';
    this.tint   = p.tint   || 'rgb(255,255,255)';
    this.borderImage = p.borderImage || '';
    this.borderWidth = p.borderWidth || 0;
    this.borderColor = p.borderColor || 'rgb(0,0,0)';
    this.naturalWidth = 0; this.naturalHeight = 0;
    this.onload = null; this.onLoad = null;
    var self = this;
    setTimeout(function () {
      if (self.onload) self.onload();
      if (self.onLoad) self.onLoad();
    }, 20);
  }
  JImage.prototype = Object.create(DO.prototype);

  /* ── Text ─────────────────────────────────────────── */
  function JText(p) {
    DO.call(this, p); p = p || {};
    this._type  = 'text';
    this.text   = p.text   || '';
    this.style  = p.style  || '';
    this.align  = p.align  || 'left';
    this.baseline   = 0;
    this.background = p.background || 'rgba(0,0,0,0)';
    this.paddingTop    = p.paddingTop    || 0;
    this.paddingBottom = p.paddingBottom || 0;
    this.paddingLeft   = p.paddingLeft   || 0;
    this.paddingRight  = p.paddingRight  || 0;
    this.lineCount = 0; this.lineClamp = p.lineClamp || 0;
    this.naturalWidth = 0; this.naturalHeight = 0;
  }
  JText.prototype = Object.create(DO.prototype);

  /* ── Container ────────────────────────────────────── */
  function JContainer(p) { DO.call(this, p); this._type = 'container'; }
  JContainer.prototype = Object.create(DO.prototype);

  /* ── Style ────────────────────────────────────────── */
  function JStyle(p) {
    p = p || {};
    this.name   = p.name   || '';
    this.color  = p.color  || 'white';
    this.size   = p.size   || 16;
    this.bold   = !!p.bold;
    this.italic = !!p.italic;
    this.align  = p.align  || 'left';
    if (this.name) jsmaf._styles[this.name] = this;
  }

  /* ── XMLHttpRequest polyfill ──────────────────────── */
  function JXHR() {
    this.readyState = 0; this.status = 0; this.responseText = '';
    this.onreadystatechange = null;
    this._method = ''; this._url = ''; this._async = true;
  }
  JXHR.prototype.open = function (method, url, async) {
    this._method = method; this._url = url;
    this._async  = (async !== false);
    this.readyState = 1;
    if (this.onreadystatechange) this.onreadystatechange();
  };
  JXHR.prototype.send = function (data) {
    var path = vfsPath(this._url), self = this;
    function finish() {
      try {
        if (self._method === 'GET') {
          var c = VFS[path];
          self.status = (c !== undefined) ? 200 : 404;
          self.responseText = (c !== undefined) ? c : '';
        } else if (self._method === 'POST' || self._method === 'PUT') {
          VFS[path] = data; self.status = 200; self.responseText = 'OK';
        } else if (self._method === 'DELETE') {
          delete VFS[path]; self.status = 200; self.responseText = 'OK';
        } else {
          self.status = 405; self.responseText = 'Method Not Allowed';
        }
      } catch (e) { self.status = 500; self.responseText = e.message; }
      self.readyState = 4;
      if (self.onreadystatechange) self.onreadystatechange();
    }
    if (this._async) setTimeout(finish, 10); else finish();
  };
  JXHR.prototype.abort = function () { this.readyState = 0; };

  /* ── AudioClip stub ───────────────────────────────── */
  function JAudio() { this.volume = 1; this.loop = false; }
  JAudio.prototype.open  = JAudio.prototype.load = function (u) { debug('AudioClip.open: ' + u); };
  JAudio.prototype.play  = function () { debug('AudioClip.play'); };
  JAudio.prototype.stop  = function () { debug('AudioClip.stop'); };
  JAudio.prototype.close = function () { debug('AudioClip.close'); };

  /* ── WebSocket stub ───────────────────────────────── */
  function JWS(url) {
    this.url = url;
    this.onmessage = this.onopen = this.onclose = this.onerror = null;
    debug('WebSocket created: ' + url);
  }
  JWS.prototype.send  = function (d) { debug('WS.send: ' + d); };
  JWS.prototype.close = function ()  { debug('WS.close'); };

  /* ── WebSocketServer stub ─────────────────────────── */
  function JWSS(port) {
    this.port = port || 0;
    this.onmessage = null; this.onconnect = null;
    debug('WebSocketServer port: ' + (port || 'unset'));
  }
  JWSS.prototype.broadcast = function (msg) { debug('WSS.broadcast: ' + msg); };

  /* ── Root scene ───────────────────────────────────── */
  var root = new DO();
  root.width = 1920; root.height = 1080;

  /* ── Timer bookkeeping ────────────────────────────── */
  var _tid = 0, _iid = 0, _tm = {}, _iv = {};

  /* ── jsmaf object ─────────────────────────────────── */
  var jsmaf = {
    Image: JImage, Text: JText, Container: JContainer,
    Style: JStyle, XMLHttpRequest: JXHR,
    AudioClip: JAudio, WebSocket: JWS, WebSocketServer: JWSS,
    User: {}, root: root, _styles: {},

    screenWidth: 1920, screenHeight: 1080, screenAspect: 16/9,
    frameRate: 60, platform: 'ps4', version: '2.13.2',
    locale: 'en', networkStatus: 'connected', remotePlay: true,
    circleIsAdvanceButton: false, hardwareId: "noooooo'noooooo",
    cookie: '', fwDebugString: 'release/2.13-e98b7be',
    isTTSenabled: false, depthTest: false, gamma: 1,
    connectionType: 'wireless', loader_has_run: false,

    onKeyDown: null, onKeyUp: null, onKeyRepeat: null,
    onEnterFrame: null, onEnterForeground: null, onEnterBackground: null,
    onError: null, onShutdown: null, onNetworkStatusChange: null,
    onTextSpeech: null, onExternalParamChange: null,

    print: function (m) { log('[print] ' + m); },
    alert: function (m) { log('[alert] ' + m); toast(String(m)); },
    exit:  function ()  { log('[exit] application exited'); },
    gc:    function ()  { debug('[gc]'); },
    showOSK:         function ()  { debug('showOSK'); },
    openWebBrowser:  function (u) { debug('openWebBrowser: ' + u); },
    speak:           function (t) { debug('speak: ' + t); },
    hideSplashScreen:function ()  { debug('hideSplashScreen'); },
    showCCSettings:  function ()  { debug('showCCSettings'); },
    forceShutdown:   function ()  { log('forceShutdown called'); },
    forceConnect:    function ()  { debug('forceConnect'); },
    argv:            function ()  { return []; },
    processTime:     function ()  { return Date.now(); },

    include: function (path) {
      var np = vfsPath(path);
      var c  = (VFS[np] !== undefined) ? VFS[np] : VFS['/' + path];
      if (c === undefined) { window.error('include: not found — ' + path); return; }
      try { execScript(c); }
      catch (e) { window.error('include error (' + path + '): ' + e.message); }
    },
    eval: function (code) {
      try { execScript(code); }
      catch (e) { window.error('eval error: ' + e.message); }
    },

    setTimeout: function (cb, d) {
      var id = ++_tid;
      _tm[id] = setTimeout(function () {
        try { cb(); } catch (e) { window.error('setTimeout cb: ' + e.message); }
        delete _tm[id];
      }, d || 0);
      return id;
    },
    clearTimeout: function (id) {
      if (_tm[id]) { clearTimeout(_tm[id]); delete _tm[id]; }
    },
    setInterval: function (cb, d) {
      var id = ++_iid;
      _iv[id] = setInterval(function () {
        try { cb(); } catch (e) { window.error('setInterval cb: ' + e.message); }
      }, d || 16);
      return id;
    },
    clearInterval: function (id) {
      if (_iv[id]) { clearInterval(_iv[id]); delete _iv[id]; }
    },
  };

  /* ── location property — THE FIX ─────────────────────
     Object.defineProperty must target a property that
     does NOT already exist as a data property.
     We keep internal state in _loc, never in jsmaf itself. */
  var _loc = { mLocation: '', manifest: null };
  Object.defineProperty(jsmaf, 'location', {
    get: function () { return _loc.mLocation; },
    set: function (value) {
      _loc.mLocation = value;
      var path    = vfsPath(value);
      var content = VFS[path];
      if (!content) { window.error('Manifest not found: ' + path); return; }
      try {
        var manifest = JSON.parse(content);
        _loc.manifest = manifest;
        if (manifest.scripts) {
          manifest.scripts.forEach(function (s) {
            var src = vfsPath(s.src);
            var sc  = VFS[src];
            if (sc) { try { execScript(sc); } catch (e) { window.error('manifest script error: ' + e.message); } }
            else    window.error('Manifest script not found: ' + src);
          });
        }
      } catch (e) { window.error('Manifest parse error: ' + e.message); }
    },
    configurable: true, enumerable: true
  });

  return jsmaf;
}());

/* ── Expose globals so scripts using bare constructors work ── */
window.jsmaf     = JSMAF;
window.VFS       = VFS;
window.Image     = JSMAF.Image;      // bare  new Image({...})
window.Text      = JSMAF.Text;       // bare  new Text()
window.Style     = JSMAF.Style;      // bare  new Style({...})
window.Container = JSMAF.Container;  // bare  new Container({...})
window.include   = function (p) { JSMAF.include(p); };

/* ── Default styles ──────────────────────────────────── */
[
  { name:'white',  color:'#ffffff',  size:20 },
  { name:'red',    color:'#ff3f40',  size:20 },
  { name:'green',  color:'#00d26a',  size:20 },
  { name:'yellow', color:'#ffc300',  size:20 },
  { name:'cyan',   color:'#00d4d4',  size:20 },
  { name:'blue',   color:'#4a9eff',  size:20 },
  { name:'small',  color:'#ffffff',  size:14 },
  { name:'large',  color:'#ffffff',  size:32 },
  { name:'title',  color:'#ffffff',  size:48 },
].forEach(function (s) { new JSMAF.Style(s); });

/* ════════════════════════════════════════════════════════
   RENDERER — clear-and-rebuild each rAF tick.
   Browser image cache prevents flickering.
════════════════════════════════════════════════════════ */
var screenEl   = document.getElementById('screen');
var rafId      = null;
var emuActive  = false;

function renderList(objects, parent) {
  var i, obj, el, s, parts;
  for (i = 0; i < objects.length; i++) {
    obj = objects[i];
    if (!obj || obj.visible === false) continue;

    el = document.createElement('div');
    el.className = 'dobj';

    el.style.left   = (obj.x || 0) + 'px';
    el.style.top    = (obj.y || 0) + 'px';
    if (obj.width)  el.style.width  = obj.width  + 'px';
    if (obj.height) el.style.height = obj.height + 'px';
    el.style.opacity = (obj.alpha !== undefined ? obj.alpha : 1);

    parts = [];
    if (obj.scaleX !== 1 || obj.scaleY !== 1)
      parts.push('scale(' + (obj.scaleX||1) + ',' + (obj.scaleY||1) + ')');
    if (obj.rotateZ)
      parts.push('rotate(' + obj.rotateZ + 'deg)');
    if (parts.length) {
      el.style.transform       = parts.join(' ');
      el.style.transformOrigin = '0 0';
    }
    if (obj.clip) el.style.overflow = 'hidden';

    /* Text */
    if (obj._type === 'text') {
      el.classList.add('dtext');
      s = JSMAF._styles[obj.style] || {};
      el.style.color       = s.color  || 'white';
      el.style.fontSize    = (s.size  || 16) + 'px';
      el.style.fontWeight  = s.bold   ? '700' : '400';
      el.style.fontStyle   = s.italic ? 'italic' : 'normal';
      el.style.textAlign   = obj.align || s.align || 'left';
      el.style.background  = obj.background || 'transparent';
      if (obj.paddingTop)    el.style.paddingTop    = obj.paddingTop    + 'px';
      if (obj.paddingBottom) el.style.paddingBottom = obj.paddingBottom + 'px';
      if (obj.paddingLeft)   el.style.paddingLeft   = obj.paddingLeft   + 'px';
      if (obj.paddingRight)  el.style.paddingRight  = obj.paddingRight  + 'px';
      el.textContent = obj.text || '';

    /* Image */
    } else if (obj._type === 'image') {
      el.classList.add('dimage');
      if (obj.url) {
        el.style.backgroundImage    = 'url("' + obj.url.replace(/"/g, '%22') + '")';
        el.style.backgroundSize     = 'contain';
        el.style.backgroundRepeat   = 'no-repeat';
        el.style.backgroundPosition = 'center';
      }
      if (obj.borderWidth) {
        el.style.border      = obj.borderWidth + 'px solid ' + (obj.borderColor || '#000');
        el.style.borderImage = obj.borderImage || '';
      }
    }

    parent.appendChild(el);

    /* Recurse into children */
    if (obj.children && obj.children.length) renderList(obj.children, el);
  }
}

function doRender() {
  if (!emuActive) return;
  screenEl.innerHTML = '';
  renderList(JSMAF.root.children, screenEl);
  if (JSMAF.onEnterFrame) {
    try { JSMAF.onEnterFrame(); }
    catch (e) { window.error('onEnterFrame: ' + e.message); }
  }
  rafId = requestAnimationFrame(doRender);
}

function startRender() {
  emuActive = true;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(doRender);
}
function stopRender() {
  emuActive = false;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
}

/* ════════════════════════════════════════════════════════
   SCREEN SCALING — fits 1920×1080 into any container
════════════════════════════════════════════════════════ */
var screenWrap = document.getElementById('screen-wrap');

function updateScale() {
  var ww = screenWrap.clientWidth, wh = screenWrap.clientHeight;
  if (!ww || !wh) return;
  var sc = Math.min(ww / 1920, wh / 1080);
  var ox = Math.round((ww - 1920 * sc) / 2);
  var oy = Math.round((wh - 1080 * sc) / 2);
  screenEl.style.transform       = 'translate(' + ox + 'px,' + oy + 'px) scale(' + sc + ')';
  screenEl.style.transformOrigin = '0 0';
}

var ro = new ResizeObserver(updateScale);
ro.observe(screenWrap);
window.addEventListener('resize', updateScale);

/* ════════════════════════════════════════════════════════
   VIEW MANAGEMENT
════════════════════════════════════════════════════════ */
var editorView = document.getElementById('editor-view');
var emuView    = document.getElementById('emu-view');
var emuStatus  = document.getElementById('emu-status');
var codeEditor = document.getElementById('code-editor');

function showEditor() {
  stopRender();
  emuView.classList.add('off');
  editorView.classList.remove('off');
}

function showEmulator() {
  editorView.classList.add('off');
  emuView.classList.remove('off');
  updateScale();
  startRender();
}

function runScript() {
  var code = codeEditor.value.trim();
  if (!code) { toast('Paste a JSMAF script first, then press Run.'); return; }

  /* Reset JSMAF state completely */
  JSMAF.root.children     = [];
  JSMAF.onKeyDown         = null; JSMAF.onKeyUp         = null;
  JSMAF.onKeyRepeat       = null; JSMAF.onEnterFrame    = null;
  JSMAF.onEnterForeground = null; JSMAF.onEnterBackground = null;
  JSMAF.onError           = null; JSMAF.loader_has_run  = false;

  logOut.innerHTML = '';
  showEmulator();

  emuStatus.textContent = '● RUNNING';
  emuStatus.className   = 'bar-status ok';

  try {
    execScript(code);
    log('Script started successfully');
  } catch (e) {
    window.error('Script error: ' + e.message);
    if (e.stack) {
      e.stack.split('\n').slice(0, 4).forEach(function (l) { window.error(l); });
    }
    emuStatus.textContent = '✖ ERROR';
    emuStatus.className   = 'bar-status err';
  }
}

document.getElementById('run-btn').addEventListener('click', runScript);
document.getElementById('btn-back').addEventListener('click', showEditor);

codeEditor.addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runScript(); }
  if (e.key === 'Tab') {
    e.preventDefault();
    var s = this.selectionStart, en = this.selectionEnd;
    this.value = this.value.slice(0, s) + '  ' + this.value.slice(en);
    this.selectionStart = this.selectionEnd = s + 2;
  }
});

/* ════════════════════════════════════════════════════════
   CONTROLLER
════════════════════════════════════════════════════════ */
function fireKey(code, down) {
  try {
    if (down && JSMAF.onKeyDown) JSMAF.onKeyDown(code);
    if (!down && JSMAF.onKeyUp)  JSMAF.onKeyUp(code);
  } catch (e) { window.error('Key handler: ' + e.message); }
}

document.querySelectorAll('.cbtn[data-key]').forEach(function (btn) {
  var k = parseInt(btn.dataset.key, 10);

  function dn(e) { e.preventDefault(); btn.classList.add('on'); fireKey(k, true); }
  function up(e) { if (e) e.preventDefault(); btn.classList.remove('on'); fireKey(k, false); }
  function lv()  { if (btn.classList.contains('on')) up(); }

  btn.addEventListener('mousedown',   dn);
  btn.addEventListener('mouseup',     up);
  btn.addEventListener('mouseleave',  lv);
  btn.addEventListener('touchstart',  dn, { passive: false });
  btn.addEventListener('touchend',    up, { passive: false });
  btn.addEventListener('touchcancel', up, { passive: false });
});

/* Keyboard → PS4 key codes */
var KM = {
  ArrowUp:4, ArrowRight:5, ArrowDown:6, ArrowLeft:7,
  z:14, Z:14, x:13, X:13, a:15, A:15, s:12, S:12,
  q:10, Q:10, e:11, E:11, '1':8, '3':9, Enter:3
};
document.addEventListener('keydown', function (ev) {
  if (emuView.classList.contains('off')) return;
  var k = KM[ev.key];
  if (k !== undefined) { ev.preventDefault(); fireKey(k, true); }
});
document.addEventListener('keyup', function (ev) {
  if (emuView.classList.contains('off')) return;
  var k = KM[ev.key];
  if (k !== undefined) fireKey(k, false);
});

/* ════════════════════════════════════════════════════════
   CONSOLE LOG
════════════════════════════════════════════════════════ */
var logSection = document.getElementById('log-section');
var btnTogLog  = document.getElementById('btn-tog-log');
var logOpen    = true;

btnTogLog.addEventListener('click', function () {
  logOpen = !logOpen;
  logSection.classList.toggle('shut', !logOpen);
  btnTogLog.textContent = logOpen ? 'LOG ▾' : 'LOG ▴';
  setTimeout(updateScale, 200);
});

document.getElementById('btn-clr-log').addEventListener('click', function () {
  logOut.innerHTML = '';
});

/* ════════════════════════════════════════════════════════
   FILE BROWSER
════════════════════════════════════════════════════════ */
var modalBg = document.getElementById('modal-bg');
var fList   = document.getElementById('f-list');
var fPrev   = document.getElementById('f-prev');

function openFiles() {
  fList.innerHTML = '';
  fPrev.innerHTML = '<div class="empty">Select a file to preview</div>';
  var paths = Object.keys(VFS).sort();
  if (!paths.length) {
    fList.innerHTML = '<div class="empty">VFS is empty.<br>Scripts writing via XHR POST will appear here.</div>';
  } else {
    paths.forEach(function (p) {
      var it = document.createElement('div');
      it.className   = 'fi';
      it.textContent = '📄 ' + p;
      it.addEventListener('click', function () {
        document.querySelectorAll('.fi').forEach(function (x) { x.classList.remove('sel'); });
        it.classList.add('sel');
        var c = VFS[p];
        if (typeof c !== 'string') c = JSON.stringify(c, null, 2);
        fPrev.textContent = c.length > 14000 ? c.slice(0, 14000) + '\n… [truncated]' : c;
      });
      fList.appendChild(it);
    });
  }
  modalBg.classList.remove('off');
}

document.getElementById('btn-files-ed').addEventListener('click',  openFiles);
document.getElementById('btn-files-emu').addEventListener('click', openFiles);
document.getElementById('close-modal').addEventListener('click', function () { modalBg.classList.add('off'); });
modalBg.addEventListener('click', function (e) { if (e.target === modalBg) modalBg.classList.add('off'); });

/* ════════════════════════════════════════════════════════
   KEY MAP HINT
════════════════════════════════════════════════════════ */
document.getElementById('btn-keymap').addEventListener('click', function () {
  toast('↑↓←→=D-pad  Z=✕  X=○  A=□  S=△  Q=L1  E=R1  1=L2  3=R2  Enter=OPT');
});

/* ════════════════════════════════════════════════════════
   TOAST
════════════════════════════════════════════════════════ */
var toastEl = document.getElementById('toast');
var toastTm = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.remove('off');
  if (toastTm) clearTimeout(toastTm);
  toastTm = setTimeout(function () { toastEl.classList.add('off'); }, 3500);
}

/* ════════════════════════════════════════════════════════
   READY
════════════════════════════════════════════════════════ */
log('JSMAF PS4 Emulator ready — paste a script and press ▶ RUN');
</script>
