<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Liquid Glass</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(45deg, #0a0a0a, #1a1a2e, #16213e, #0a0a0a);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
    }
    /* Decorative background layer */
    .bg-content {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 40px;
      opacity: 0.6;
      z-index: 0;
    }
    .bg-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(0,255,255,0.4), rgba(0,180,255,0.1));
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    /* The glass panel */
    .glass-panel {
      position: relative;
      z-index: 10;
      width: clamp(300px, 50vw, 500px);
      padding: 2.5rem;
      border-radius: 32px;
      /* The SVG filter is applied as a backdrop-filter (Chrome-only) */
      backdrop-filter: url(#liquidGlassFilter);
      /* Fallback for when SVG backdrop-filter is not supported */
      background: rgba(10, 10, 10, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      color: white;
      text-align: center;
      transition: transform 0.3s ease;
    }
    .glass-panel:hover {
      transform: scale(1.02);
    }
    h1 {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <!-- Decorative background elements to show the refraction effect -->
  <div class="bg-content" id="bgContent">
    <!-- Circles will be generated here via JS -->
  </div>

  <!-- The glass panel -->
  <div class="glass-panel" id="glassPanel">
    <h1>🌊 Liquid Glass</h1>
    <p>This is not a simple blur. This is physics-based refraction.</p>
    <p>Move me or resize to see the lensing effect.</p>
  </div>

  <!-- Hidden SVG for the Liquid Glass filter -->
  <svg style="display:none" id="liquidGlassSvg">
    <filter id="liquidGlassFilter" colorInterpolationFilters="sRGB" filterUnits="userSpaceOnUse">
      <feImage id="dispMapImage" x="0" y="0" result="displacement_map" />
      <feDisplacementMap in="SourceGraphic" in2="displacement_map" scale="15" xChannelSelector="R" yChannelSelector="G" result="refracted" />
      <feImage id="specMapImage" x="0" y="0" result="specular_map" />
      <feBlend in="refracted" in2="specular_map" mode="screen" />
    </filter>
  </svg>

  <script>
    (function() {
      // --- 1. Generate background decorations ---
      const bgContent = document.getElementById('bgContent');
      for (let i = 0; i < 30; i++) {
        const circle = document.createElement('div');
        circle.className = 'bg-circle';
        circle.style.animationDelay = `${Math.random() * 6}s`;
        circle.style.width = `${40 + Math.random() * 80}px`;
        circle.style.height = circle.style.width;
        bgContent.appendChild(circle);
      }

      const glassPanel = document.getElementById('glassPanel');
      const dispMapImage = document.getElementById('dispMapImage');
      const specMapImage = document.getElementById('specMapImage');
      const filter = document.getElementById('liquidGlassFilter');

      // --- 2. Physics Parameters (from kube.io article) ---
      const BEZEL_WIDTH_PX = 28;        // Width of the curved edge area
      const GLASS_THICKNESS = 12;        // Max glass height – affects refraction strength
      const REFRACTION_INDEX = 1.5;     // Glass IOR (air = 1.0)

      // --- 3. Convex Squircle Height Function ---
      // y = (1 - (1 - x)^4)^(1/4)
      function squircleHeight(x) {
        if (x <= 0) return 0;
        if (x >= 1) return 1;
        return Math.pow(1 - Math.pow(1 - x, 4), 0.25);
      }

      // --- 4. Pre-compute Displacement Table (one-time calculation) ---
      const SAMPLES = 128;
      const displacementTable = new Float32Array(SAMPLES);
      let maxDisplacement = 0;

      for (let i = 0; i < SAMPLES; i++) {
        const dist = i / (SAMPLES - 1);  // normalized distance from border [0,1]
        const h = squircleHeight(dist) * GLASS_THICKNESS;

        // Approximate the derivative of the surface at this point
        const eps = 0.001;
        const h1 = squircleHeight(Math.max(0, dist - eps)) * GLASS_THICKNESS;
        const h2 = squircleHeight(Math.min(1, dist + eps)) * GLASS_THICKNESS;
        const derivative = (h2 - h1) / (2 * eps * BEZEL_WIDTH_PX); // derivative per pixel
        const normal = { x: -derivative, y: 1 }; // surface normal
        const normalLen = Math.sqrt(normal.x ** 2 + normal.y ** 2);
        const nx = normal.x / normalLen;
        const ny = normal.y / normalLen;

        // Incident ray is orthogonal (0,1)
        const cosTheta1 = Math.abs(ny);
        const sinTheta1 = Math.sqrt(Math.max(0, 1 - cosTheta1 * cosTheta1));
        const sinTheta2 = sinTheta1 / REFRACTION_INDEX;
        const cosTheta2 = Math.sqrt(Math.max(0, 1 - sinTheta2 * sinTheta2));

        // Refracted ray direction
        const refractX = -nx * cosTheta2 + ny * sinTheta2;
        const refractY = -ny * cosTheta2 - nx * sinTheta2;

        // Displacement along the background plane
        const displacement = (h / refractY) * refractX;
        displacementTable[i] = displacement;
        maxDisplacement = Math.max(maxDisplacement, Math.abs(displacement));
      }

      // --- 5. Generate Displacement and Specular Maps ---
      function generateMaps() {
        const rect = glassPanel.getBoundingClientRect();
        const w = Math.ceil(rect.width);
        const h = Math.ceil(rect.height);
        if (w === 0 || h === 0) return;

        const cornerRadius = 32; // must match CSS border-radius

        // Displacement Map Canvas
        const dispCanvas = document.createElement('canvas');
        dispCanvas.width = w;
        dispCanvas.height = h;
        const dispCtx = dispCanvas.getContext('2d');
        const dispImageData = dispCtx.createImageData(w, h);

        // Specular Map Canvas
        const specCanvas = document.createElement('canvas');
        specCanvas.width = w;
        specCanvas.height = h;
        const specCtx = specCanvas.getContext('2d');
        const specImageData = specCtx.createImageData(w, h);

        for (let py = 0; py < h; py++) {
          for (let px = 0; px < w; px++) {
            // Calculate distance to the nearest border (with rounded corners)
            const distTop = py;
            const distBottom = h - 1 - py;
            const distLeft = px;
            const distRight = w - 1 - px;

            // For corners, distance from the corner center
            const topLeftDist = Math.sqrt((px - cornerRadius) ** 2 + (py - cornerRadius) ** 2) - cornerRadius;
            const topRightDist = Math.sqrt((px - (w - 1 - cornerRadius)) ** 2 + (py - cornerRadius) ** 2) - cornerRadius;
            const bottomLeftDist = Math.sqrt((px - cornerRadius) ** 2 + (py - (h - 1 - cornerRadius)) ** 2) - cornerRadius;
            const bottomRightDist = Math.sqrt((px - (w - 1 - cornerRadius)) ** 2 + (py - (h - 1 - cornerRadius)) ** 2) - cornerRadius;

            const minDist = Math.min(distTop, distBottom, distLeft, distRight, topLeftDist, topRightDist, bottomLeftDist, bottomRightDist);

            const pixelIndex = (py * w + px) * 4;

            if (minDist <= BEZEL_WIDTH_PX && minDist > 0) {
              // --- Determine inward direction ---
              const candidates = [
                { dist: distTop, nx: 0, ny: -1 },
                { dist: distBottom, nx: 0, ny: 1 },
                { dist: distLeft, nx: -1, ny: 0 },
                { dist: distRight, nx: 1, ny: 0 },
                { dist: topLeftDist, nx: -1, ny: -1, isCorner: true, cx: cornerRadius, cy: cornerRadius },
                { dist: topRightDist, nx: 1, ny: -1, isCorner: true, cx: w - 1 - cornerRadius, cy: cornerRadius },
                { dist: bottomLeftDist, nx: -1, ny: 1, isCorner: true, cx: cornerRadius, cy: h - 1 - cornerRadius },
                { dist: bottomRightDist, nx: 1, ny: 1, isCorner: true, cx: w - 1 - cornerRadius, cy: h - 1 - cornerRadius }
              ];
              let closest = candidates[0];
              for (const c of candidates) {
                if (c.dist < closest.dist) closest = c;
              }

              let dirX, dirY;
              if (closest.isCorner) {
                const rx = px - closest.cx;
                const ry = py - closest.cy;
                const len = Math.sqrt(rx ** 2 + ry ** 2);
                dirX = len > 0 ? rx / len : 0;
                dirY = len > 0 ? ry / len : 0;
              } else {
                dirX = closest.nx;
                dirY = closest.ny;
              }
              // Inward direction is opposite of outward normal
              const inwardX = -dirX;
              const inwardY = -dirY;

              // Lookup normalized displacement magnitude from table
              const normDist = minDist / BEZEL_WIDTH_PX;
              const idx = Math.min(SAMPLES - 1, Math.floor(normDist * (SAMPLES - 1)));
              const mag = displacementTable[idx] / maxDisplacement; // normalize to [0,1]

              // Encode to R and G channels (128 = no displacement)
              dispImageData.data[pixelIndex] = 128 + inwardX * mag * 127;
              dispImageData.data[pixelIndex + 1] = 128 + inwardY * mag * 127;
              dispImageData.data[pixelIndex + 2] = 128;
              dispImageData.data[pixelIndex + 3] = 255;

              // --- Specular highlight (simplified rim light) ---
              const specIntensity = Math.max(0, 1 - normDist * 3) * 0.8;
              const specVal = Math.round(specIntensity * 255);
              specImageData.data[pixelIndex] = specVal;
              specImageData.data[pixelIndex + 1] = specVal;
              specImageData.data[pixelIndex + 2] = specVal;
              specImageData.data[pixelIndex + 3] = 255;
            } else {
              // No displacement / specular for interior or outside
              dispImageData.data[pixelIndex] = 128;
              dispImageData.data[pixelIndex + 1] = 128;
              dispImageData.data[pixelIndex + 2] = 128;
              dispImageData.data[pixelIndex + 3] = 255;

              specImageData.data[pixelIndex] = 0;
              specImageData.data[pixelIndex + 1] = 0;
              specImageData.data[pixelIndex + 2] = 0;
              specImageData.data[pixelIndex + 3] = 255;
            }
          }
        }

        dispCtx.putImageData(dispImageData, 0, 0);
        specCtx.putImageData(specImageData, 0, 0);

        // Update SVG filter images
        dispMapImage.setAttribute('href', dispCanvas.toDataURL('image/png'));
        dispMapImage.setAttribute('width', w);
        dispMapImage.setAttribute('height', h);
        specMapImage.setAttribute('href', specCanvas.toDataURL('image/png'));
        specMapImage.setAttribute('width', w);
        specMapImage.setAttribute('height', h);

        // Update filter dimensions and scale
        filter.setAttribute('x', rect.left);
        filter.setAttribute('y', rect.top);
        filter.setAttribute('width', w);
        filter.setAttribute('height', h);

        const dispMapFilter = filter.querySelector('feDisplacementMap');
        dispMapFilter.setAttribute('scale', maxDisplacement);
      }

      // --- 6. Initialize and handle resize ---
      window.addEventListener('load', generateMaps);
      window.addEventListener('resize', () => {
        clearTimeout(window._resizeTimer);
        window._resizeTimer = setTimeout(generateMaps, 100);
      });

      if (window.ResizeObserver) {
        const observer = new ResizeObserver(() => generateMaps());
        observer.observe(glassPanel);
      }
    })();
  </script>
</body>
</html>
