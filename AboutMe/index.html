<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta property="og:url" content="https://mexrl.dev" />
    <meta property="og:site_name" content="MexrlDev" />
    <meta property="description" content="About Me - MexrlDev" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta property="og:image" content="https://raw.githubusercontent.com/MexrlDev/MexrlDev.github.io/refs/heads/main/AboutMe/Max.jpeg" />
    <title>MexrlDev · About</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Orbitron', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        #background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            transition: all 0.2s ease;
        }

        /* mobile: background slightly shrinks inward */
        @media (max-width: 768px) {
            #background {
                width: 94%;
                height: 94%;
                top: 3%;
                left: 3%;
            }
        }

        #background::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,255,255,0.04) 100%);
            pointer-events: none;
            animation: breath 6s ease-in-out infinite alternate;
        }

        @keyframes breath {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        #container {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            text-align: center;
            pointer-events: none;
        }

        #container > * {
            pointer-events: auto;
        }

        #logo-container {
            margin-bottom: 1.2rem;
        }

        #profile-pic {
            width: clamp(120px, 28vw, 170px);
            height: clamp(120px, 28vw, 170px);
            border-radius: 0;
            object-fit: cover;
            background: transparent;
            box-shadow: 0 0 45px rgba(0,255,255,0.5), 0 0 20px rgba(0,255,255,0.3) inset;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        #profile-pic:hover {
            transform: scale(1.04);
            box-shadow: 0 0 70px cyan, 0 0 35px rgba(0,255,255,0.6) inset;
        }

        #logo {
            font-size: clamp(1.5rem, 6.5vw, 2.4rem);
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 18px cyan, 0 0 45px cyan, 0 0 80px rgba(0,255,255,0.7);
            animation: pulseText 2.5s infinite;
            margin-bottom: 2rem;
        }

        @keyframes pulseText {
            0%, 100% { text-shadow: 0 0 15px cyan, 0 0 35px cyan; }
            50% { text-shadow: 0 0 28px cyan, 0 0 65px cyan, 0 0 100px cyan; }
        }

        .info-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: clamp(1rem, 4vw, 1.3rem);
            margin: 0.6rem 0;
            padding: 0.3rem 0;
            transition: all 0.3s;
        }

        .info-line i {
            color: cyan;
            font-size: 1.3em;
            text-shadow: 0 0 12px cyan;
            width: 1.8rem;
            text-align: center;
        }

        .info-line span {
            color: #ffffff;
            font-weight: 500;
            text-shadow: 0 0 12px rgba(255,255,255,0.35), 0 0 4px rgba(255,255,255,0.2);
        }

        #links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.2rem;
            margin-top: 2.5rem;
        }

        .neon-btn {
            text-decoration: none;
            padding: 0.7rem 1.8rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: clamp(0.85rem, 3.5vw, 1rem);
            letter-spacing: 0.08em;
            background: rgba(10,10,10,0.6);
            border: 1.5px solid cyan;
            color: cyan;
            text-shadow: 0 0 6px cyan;
            box-shadow: 0 0 20px rgba(0,255,255,0.3);
            backdrop-filter: blur(8px);
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .neon-btn i {
            font-size: 1.1em;
            text-shadow: 0 0 6px cyan;
        }

        .neon-btn:hover {
            background: cyan;
            color: #0a0a0a;
            text-shadow: none;
            box-shadow: 0 0 40px cyan, 0 0 80px cyan;
            border-color: #fff;
            transform: translateY(-3px);
        }

        #copyright {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            font-size: 0.8rem;
            color: #555;
            text-shadow: 0 0 10px rgba(0,255,255,0.3);
            white-space: nowrap;
            pointer-events: none;
        }

        #copyright a {
            color: #777;
            text-decoration: none;
            pointer-events: auto;
        }

        #copyright a:hover {
            color: cyan;
        }
    </style>
</head>
<body>
    <div id="background"></div>

    <div id="container">
        <div id="logo-container">
            <img id="profile-pic" src="https://raw.githubusercontent.com/MexrlDev/MexrlDev.github.io/refs/heads/main/AboutMe/Max.jpeg" alt="MexrlDev avatar" />
        </div>

        <div id="logo">About Me</div>

        <div class="info-line">
            <i class="fa-solid fa-user"></i>
            <span>MexrlDev</span>
        </div>
        <div class="info-line">
            <i class="fa-solid fa-cake-candles"></i>
            <span>18 March</span>
        </div>
        <div class="info-line">
            <i class="fa-solid fa-code"></i>
            <span>Python, Lua, JS, C#</span>
        </div>
        <div class="info-line">
            <i class="fa-solid fa-gamepad"></i>
            <span>Anime, Manga, Music, Testing, Jailbreaking, Console Hacking</span>
        </div>

        <div id="links">
            <a href="https://git.earthonion.com/X" target="_blank" class="neon-btn">
                <i class="fa-solid fa-code-branch"></i> Git.earthonion
            </a>
            <a href="https://github.com/MexrlDev" target="_blank" class="neon-btn">
                <i class="fa-brands fa-github"></i> GitHub
            </a>
            <a href="https://x.com/mexrl" target="_blank" class="neon-btn">
                <i class="fa-brands fa-x-twitter"></i> X
            </a>
        </div>
    </div>

    <div id="copyright">
        © <span id="year"></span> MexrlDev · neon flow
    </div>

    <script src="https://unpkg.com/three@0.134.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.net.min.js"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        var isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || window.innerWidth <= 768;

        var vantaEffect = VANTA.NET({
            el: "#background",
            mouseControls: !isMobile,
            touchControls: false,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x00ffff,
            backgroundColor: 0x0a0a0a,
            points: 16.0,
            maxDistance: 23.0,
            spacing: 15.0,
            showDots: true
        });

        var canvas = document.querySelector("#background canvas");
        if (canvas) {
            canvas.style.filter = "drop-shadow(0 0 10px rgba(0,255,255,0.7))";
            canvas.style.touchAction = "none";  // prevent browser gestures
        }

        if (isMobile && vantaEffect && vantaEffect.$.group) {
            var group = vantaEffect.$.group;
            var rotX = 0, rotY = 0;
            var lastPinchDist = 0;
            var baseScale = 1.0;
            var prevTouch = null;

            canvas.addEventListener('touchstart', function(e) {
                e.preventDefault();
                if (e.touches.length === 1) {
                    prevTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                } else if (e.touches.length === 2) {
                    prevTouch = null;
                    lastPinchDist = Math.hypot(
                        e.touches[1].clientX - e.touches[0].clientX,
                        e.touches[1].clientY - e.touches[0].clientY
                    );
                    baseScale = vantaEffect.getOptions().scale;
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', function(e) {
                e.preventDefault();
                if (e.touches.length === 1 && prevTouch) {
                    var dx = e.touches[0].clientX - prevTouch.x;
                    var dy = e.touches[0].clientY - prevTouch.y;
                    rotY += dx * 0.005;
                    rotX -= dy * 0.005;
                    rotX = Math.max(-Math.PI/4, Math.min(Math.PI/4, rotX));
                    group.rotation.x = rotX;
                    group.rotation.y = rotY;
                    prevTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                } else if (e.touches.length === 2) {
                    var curDist = Math.hypot(
                        e.touches[1].clientX - e.touches[0].clientX,
                        e.touches[1].clientY - e.touches[0].clientY
                    );
                    if (lastPinchDist > 0) {
                        var newScale = baseScale * (curDist / lastPinchDist);
                        newScale = Math.min(2.5, Math.max(0.5, newScale));
                        vantaEffect.setOptions({ scale: newScale });
                    }
                }
            }, { passive: false });

            canvas.addEventListener('touchend', function(e) {
                e.preventDefault();
                if (e.touches.length === 0) {
                    prevTouch = null;
                    lastPinchDist = 0;
                }
            });
        }
    </script>
</body>
</html>
