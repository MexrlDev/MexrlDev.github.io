<style>
:root {
  --cyan: #00ffff;
  --cyan-dim: rgba(0,255,255,0.18);
  --cyan-glow: 0 0 20px #00ffff, 0 0 60px rgba(0,255,255,0.4);
  --bg: #06060a;
}
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;}

body {
  background: var(--bg);
  font-family: 'Orbitron', sans-serif;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  color: #e0e0e0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: fixed;
  top:0;left:0;
  cursor: crosshair;
}

/* ── BG canvas ── */
#bgCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* ── GLASS CARD ── */
#card {
  position: relative;
  z-index: 10;
  width: min(480px, 92vw);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}

/* The physical glass pane — WebGL renders INTO this canvas */
#glassCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: 32px;
  z-index: 0;
  pointer-events: none;
  display: block;
}

#glassSurface {
  position: relative;
  width: 100%;
  border-radius: 32px;
  padding: 2.4rem 2.6rem 2.2rem;
  /* thin specular rim */
  border: 1px solid rgba(255,255,255,0.22);
  box-shadow:
    0 0 0 1px rgba(0,255,255,0.12),
    0 30px 80px rgba(0,0,0,0.7),
    0 2px 0 rgba(255,255,255,0.08) inset,
    0 -1px 0 rgba(0,0,0,0.6) inset;
  overflow: hidden;
  transition: transform 0.4s cubic-bezier(.23,1,.32,1), box-shadow 0.4s ease;
}

/* specular edge highlights */
#glassSurface::before {
  content:'';
  position:absolute;
  inset:0;
  border-radius:32px;
  background:
    linear-gradient(135deg,
      rgba(255,255,255,0.18) 0%,
      rgba(255,255,255,0.04) 30%,
      transparent 60%,
      rgba(0,255,255,0.06) 100%);
  pointer-events:none;
  z-index:2;
}

/* caustic shimmer overlay */
#glassSurface::after {
  content:'';
  position:absolute;
  inset:0;
  border-radius:32px;
  background:
    radial-gradient(ellipse 60% 40% at 30% 20%, rgba(0,255,255,0.07) 0%, transparent 70%),
    radial-gradient(ellipse 50% 60% at 80% 80%, rgba(120,80,255,0.05) 0%, transparent 70%);
  pointer-events:none;
  z-index:3;
  animation: causticShift 6s ease-in-out infinite alternate;
}

@keyframes causticShift {
  0%   { opacity:1; transform:scale(1) translate(0,0); }
  100% { opacity:0.6; transform:scale(1.12) translate(3%,4%); }
}

.glass-content {
  position: relative;
  z-index: 4;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── AVATAR ── */
#avatarWrap {
  position: relative;
  margin-bottom: 1.4rem;
  width: clamp(110px,26vw,155px);
  height: clamp(110px,26vw,155px);
}

#avatarRing {
  position:absolute;
  inset:-4px;
  border-radius:50%;
  background: conic-gradient(
    from 0deg,
    transparent 0%,
    #00ffff 25%,
    transparent 50%,
    #7c3aed 75%,
    transparent 100%
  );
  animation: spinRing 4s linear infinite;
  z-index:0;
}

@keyframes spinRing {
  to { transform: rotate(360deg); }
}

#avatarRingInner {
  position:absolute;
  inset:2px;
  border-radius:50%;
  background: var(--bg);
  z-index:1;
}

#profilePic {
  position:absolute;
  inset:5px;
  border-radius:50%;
  object-fit:cover;
  z-index:2;
  box-shadow: 0 0 30px rgba(0,255,255,0.35), 0 0 60px rgba(0,255,255,0.12);
  transition: transform 0.3s ease, filter 0.3s ease;
}

#profilePic:hover {
  transform: scale(1.04);
  filter: brightness(1.08) saturate(1.2);
}

/* ── TITLE ── */
#title {
  font-size: clamp(1.3rem,5.5vw,2rem);
  font-weight: 900;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: #fff;
  text-shadow: 0 0 14px #00ffff, 0 0 40px #00ffff, 0 0 80px rgba(0,255,255,0.5);
  margin-bottom: 1.6rem;
  animation: titlePulse 3s ease-in-out infinite;
}

@keyframes titlePulse {
  0%,100% { text-shadow: 0 0 12px #00ffff, 0 0 35px #00ffff, 0 0 60px rgba(0,255,255,0.4); }
  50%      { text-shadow: 0 0 22px #00ffff, 0 0 60px #00ffff, 0 0 100px rgba(0,200,255,0.7); }
}

/* ── INFO ROWS ── */
.info-grid {
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
  width: 100%;
}

.info-row {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  padding: 0.55rem 0.9rem;
  border-radius: 12px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
  position: relative;
  overflow: hidden;
}

.info-row::before {
  content:'';
  position:absolute;
  left:0;top:0;bottom:0;
  width:2px;
  background: linear-gradient(to bottom, transparent, #00ffff, transparent);
  opacity:0;
  transition: opacity 0.3s;
}

.info-row:hover {
  background: rgba(0,255,255,0.05);
  border-color: rgba(0,255,255,0.2);
  transform: translateX(3px);
}
.info-row:hover::before { opacity:1; }

.info-row i {
  color: #00ffff;
  font-size: 1rem;
  width: 1.2rem;
  text-align: center;
  flex-shrink: 0;
  filter: drop-shadow(0 0 6px #00ffff);
}

.info-row span {
  font-family: 'Space Mono', monospace;
  font-size: clamp(0.72rem, 2.8vw, 0.88rem);
  color: rgba(255,255,255,0.88);
  letter-spacing: 0.04em;
}

.info-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.6rem;
  color: rgba(0,255,255,0.5);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-left: auto;
  flex-shrink: 0;
}

/* ── DIVIDER ── */
.divider {
  width: 100%;
  height: 1px;
  margin: 1.2rem 0;
  background: linear-gradient(to right, transparent, rgba(0,255,255,0.3), transparent);
  position: relative;
}
.divider::after {
  content:'';
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:6px;height:6px;
  border-radius:50%;
  background:#00ffff;
  box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
}

/* ── LINKS ── */
#links {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.9rem;
  width: 100%;
}

.neon-btn {
  text-decoration: none;
  padding: 0.6rem 1.4rem;
  border-radius: 50px;
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: clamp(0.7rem, 2.8vw, 0.82rem);
  letter-spacing: 0.1em;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  gap: 0.45rem;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  z-index: 0;
  /* glass button base */
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(0,255,255,0.35);
  color: #00ffff;
  text-shadow: 0 0 8px rgba(0,255,255,0.7);
  box-shadow: 0 0 18px rgba(0,255,255,0.1), inset 0 1px 0 rgba(255,255,255,0.08);
}

/* btn glass shimmer */
.neon-btn::before {
  content:'';
  position:absolute;
  inset:0;
  border-radius:50px;
  background: linear-gradient(120deg, rgba(255,255,255,0.12) 0%, transparent 60%);
  pointer-events:none;
  z-index:1;
  opacity:0;
  transition: opacity 0.3s;
}
.neon-btn::after {
  content:'';
  position:absolute;
  inset:0;
  border-radius:50px;
  background: rgba(0,255,255,0);
  transition: background 0.3s ease;
  z-index:0;
}

.neon-btn span, .neon-btn i {
  position:relative;
  z-index:2;
}

.neon-btn:hover {
  transform: translateY(-3px) scale(1.05);
  background: rgba(0,255,255,0.9);
  color: #060612;
  text-shadow: none;
  border-color: #fff;
  box-shadow: 0 0 35px #00ffff, 0 0 70px rgba(0,255,255,0.5), 0 10px 30px rgba(0,0,0,0.4);
}
.neon-btn:hover::before { opacity:1; }
.neon-btn:hover i { filter: none; color: #060612; }

/* ── FOOTER ── */
#copyright {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem;
  color: #333;
  letter-spacing: 0.1em;
  white-space: nowrap;
  pointer-events: none;
}
#copyright a {
  color: #444;
  text-decoration: none;
  pointer-events: auto;
  transition: color 0.3s;
}
#copyright a:hover { color: #00ffff; text-shadow: 0 0 10px #00ffff; }

/* ── RIPPLE ── */
.ripple {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%,-50%) scale(0);
  background: radial-gradient(circle, rgba(0,255,255,0.25) 0%, transparent 70%);
  animation: rippleOut 0.8s ease-out forwards;
  z-index: 999;
}
@keyframes rippleOut {
  to { transform: translate(-50%,-50%) scale(1); opacity: 0; }
}

@media(max-width:500px){
  #glassSurface { padding: 1.8rem 1.6rem 1.8rem; border-radius:24px; }
  #glassCanvas { border-radius:24px; }
}

<script>
document.getElementById('year').textContent = new Date().getFullYear();

/* ═══════════════════════════════════════════════════════
   1.  PARTICLE BACKGROUND (cyan net — pure canvas 2D)
   ═══════════════════════════════════════════════════════ */
(function(){
  const canvas = document.getElementById('bgCanvas');
  const ctx    = canvas.getContext('2d');
  const POINTS = 85, LINK_DIST = 140, MOUSE_REPEL = 100;
  let W, H, mouse = {x:-999,y:-999};
  let pts = [];

  function resize(){
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function Pt(){
    return {
      x : Math.random()*W,
      y : Math.random()*H,
      vx: (Math.random()-.5)*0.55,
      vy: (Math.random()-.5)*0.55,
      r : 1.8 + Math.random()*1.2
    };
  }

  function init(){
    resize();
    pts = [];
    for(let i=0;i<POINTS;i++) pts.push(Pt());
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    /* links */
    for(let i=0;i<pts.length;i++){
      for(let j=i+1;j<pts.length;j++){
        const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y;
        const d=Math.hypot(dx,dy);
        if(d<LINK_DIST){
          const a=(1-d/LINK_DIST)*0.55;
          ctx.strokeStyle=`rgba(0,255,255,${a})`;
          ctx.lineWidth=0.8;
          ctx.shadowColor='#00ffff';
          ctx.shadowBlur=6*a;
          ctx.beginPath();
          ctx.moveTo(pts[i].x,pts[i].y);
          ctx.lineTo(pts[j].x,pts[j].y);
          ctx.stroke();
        }
      }
    }

    /* dots */
    ctx.shadowBlur = 14;
    ctx.shadowColor = '#00ffff';
    for(const p of pts){
      ctx.fillStyle = `rgba(0,255,255,0.85)`;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  function update(){
    for(const p of pts){
      const dx=p.x-mouse.x, dy=p.y-mouse.y;
      const d=Math.hypot(dx,dy);
      if(d<MOUSE_REPEL && d>0){
        const f=(1-d/MOUSE_REPEL)*0.6;
        p.vx+=dx/d*f; p.vy+=dy/d*f;
      }
      /* speed cap */
      const sp=Math.hypot(p.vx,p.vy);
      if(sp>1.8){ p.vx=p.vx/sp*1.8; p.vy=p.vy/sp*1.8; }

      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>W) p.vx*=-1;
      if(p.y<0||p.y>H) p.vy*=-1;
    }
  }

  function loop(){
    update(); draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
  window.addEventListener('resize',init);
  init(); loop();
})();


/* ═══════════════════════════════════════════════════════
   2.  REAL LIQUID GLASS  –  WebGL refractive shader
   ═══════════════════════════════════════════════════════ */
(function(){
  const surface  = document.getElementById('glassSurface');
  const glCanvas = document.getElementById('glassCanvas');
  const bgCanvas = document.getElementById('bgCanvas');

  const gl = glCanvas.getContext('webgl', {
    alpha: true,
    premultipliedAlpha: false,
    preserveDrawingBuffer: true
  });
  if(!gl){ /* fallback */ surface.style.backdropFilter='blur(20px)'; return; }

  /* ── vertex ── */
  const VS = `
    attribute vec2 aPos;
    varying vec2 vUV;
    void main(){
      gl_Position = vec4(aPos,0.,1.);
      vUV = aPos*.5+.5;
    }
  `;

  /* ── fragment: physically-based glass ── */
  const FS = `
    precision highp float;
    varying vec2 vUV;

    uniform sampler2D uScene;   /* snapshot of bg particles   */
    uniform sampler2D uHeight;  /* liquid wave heightmap       */
    uniform vec2  uRes;         /* canvas size in px           */
    uniform float uTime;
    uniform float uMouse;       /* 0..1 hover strength         */
    uniform vec2  uMouseUV;     /* mouse pos in panel UV space */

    /* ── IOR-based refraction ── */
    const float IOR   = 1.46;    /* borosilicate glass          */
    const float THICK = 0.018;   /* apparent slab thickness     */

    /* ── trig noise for base micro-roughness ── */
    float noise2(vec2 p){
      return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);
    }
    float smoothNoise(vec2 p){
      vec2 i=floor(p), f=fract(p);
      f = f*f*(3.-2.*f);
      return mix(
        mix(noise2(i),           noise2(i+vec2(1,0)), f.x),
        mix(noise2(i+vec2(0,1)), noise2(i+vec2(1,1)), f.x),
        f.y
      );
    }

    /* ── Fresnel (Schlick approximation) ── */
    float fresnel(vec2 normal, float f0){
      float cosA = 1.0 - abs(dot(normalize(normal), vec2(0.,1.)));
      return f0 + (1.-f0)*pow(cosA, 5.);
    }

    void main(){
      vec2 uv = vUV;
      vec2 texel = 1./uRes;

      /* --- read height field --- */
      float h   = texture2D(uHeight, uv).r;
      float hL  = texture2D(uHeight, uv + vec2(-texel.x,0.)).r;
      float hR  = texture2D(uHeight, uv + vec2( texel.x,0.)).r;
      float hB  = texture2D(uHeight, uv + vec2(0.,-texel.y)).r;
      float hT  = texture2D(uHeight, uv + vec2(0., texel.y)).r;

      /* surface normal from gradient */
      vec2 grad = vec2(hR-hL, hT-hB) * 0.5;

      /* --- add base micro-scratch noise --- */
      float t = uTime * 0.06;
      vec2 noiseUV = uv * 5.0;
      float microRough = (smoothNoise(noiseUV+t) - 0.5) * 0.004;
      grad += vec2(microRough);

      /* --- animated liquid surface waves --- */
      float wave1 = sin(uv.x*9.+uTime*1.1+uv.y*4.)*0.008;
      float wave2 = cos(uv.y*7.+uTime*0.8+uv.x*5.)*0.006;
      float wave3 = sin((uv.x+uv.y)*11.+uTime*1.4)*0.005;
      grad += vec2(wave1+wave3, wave2+wave3);

      /* --- mouse proximity ripple --- */
      vec2  toMouse = uv - uMouseUV;
      float mDist   = length(toMouse);
      float ripple  = uMouse * exp(-mDist*mDist*18.) * sin(mDist*55.-uTime*9.) * 0.022;
      grad += normalize(toMouse+0.0001)*ripple;

      /* --- IOR refraction (chromatic aberration) --- */
      float refractStr = THICK * IOR;

      /* slight wavelength dispersion: R bends less, B bends more */
      vec2 coordR = uv + grad * refractStr * 0.92;
      vec2 coordG = uv + grad * refractStr * 1.00;
      vec2 coordB = uv + grad * refractStr * 1.10;

      coordR = clamp(coordR,0.001,0.999);
      coordG = clamp(coordG,0.001,0.999);
      coordB = clamp(coordB,0.001,0.999);

      vec3 refracted = vec3(
        texture2D(uScene, coordR).r,
        texture2D(uScene, coordG).g,
        texture2D(uScene, coordB).b
      );

      /* --- Fresnel reflection tint --- */
      float fres = fresnel(grad, 0.04);
      vec3  reflColor = mix(
        vec3(0.0, 0.95, 1.0),   /* cyan specular */
        vec3(0.7, 0.85, 1.0),   /* white-ish     */
        fres
      );
      /* edge-Fresnel glow */
      vec2  edgeDist = abs(uv - 0.5)*2.;
      float edgeFres  = smoothstep(0.5, 1.0, max(edgeDist.x,edgeDist.y));
      vec3  edgeGlow  = vec3(0.,1.,1.) * edgeFres * 0.3;

      /* --- caustic shimmer --- */
      float caustic  = smoothNoise(uv*12.-uTime*0.3)*smoothNoise(uv*8.+uTime*0.2);
      caustic = pow(caustic,3.) * 1.6;
      vec3  causticCol = vec3(0., 0.9, 1.) * caustic * 0.18;

      /* --- specular highlight (moving) --- */
      float spec = smoothNoise(uv*3.+vec2(uTime*.07, uTime*.05));
      spec = pow(spec, 4.) * 0.22;

      /* --- compose --- */
      /* very thin dark tint to sell the "glass mass" */
      vec3 glassTint = vec3(0.03, 0.08, 0.12);

      vec3 col  = mix(refracted, glassTint, 0.08);
      col      += reflColor * fres * 0.15;
      col      += edgeGlow;
      col      += causticCol;
      col      += spec;

      /* depth vignette inside the glass */
      float vig  = 1. - length((uv-.5)*1.4)*0.55;
      col       *= max(0.6, vig);

      /* top specular streak */
      float specStreak = smoothstep(0.0,0.25, uv.y) * (1.-smoothstep(0.25,0.4, uv.y));
      specStreak *= smoothstep(0.1,0.6, uv.x) * smoothstep(0.9,0.6, uv.x);
      col += specStreak * 0.07;

      gl_FragColor = vec4(col, 0.72);
    }
  `;

  function mkShader(type, src){
    const s=gl.createShader(type);
    gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))
      console.error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog=gl.createProgram();
  gl.attachShader(prog,mkShader(gl.VERTEX_SHADER,VS));
  gl.attachShader(prog,mkShader(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  /* full-screen quad */
  const buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const aPos=gl.getAttribLocation(prog,'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);

  const uScene    = gl.getUniformLocation(prog,'uScene');
  const uHeight   = gl.getUniformLocation(prog,'uHeight');
  const uRes      = gl.getUniformLocation(prog,'uRes');
  const uTime     = gl.getUniformLocation(prog,'uTime');
  const uMouse    = gl.getUniformLocation(prog,'uMouse');
  const uMouseUV  = gl.getUniformLocation(prog,'uMouseUV');

  /* ── height field (liquid waves) ── */
  const GW=160, GH=160, GN=GW*GH;
  let hField=new Float32Array(GN), vField=new Float32Array(GN);

  const hTex=gl.createTexture();
  function bindHTex(){
    gl.bindTexture(gl.TEXTURE_2D,hTex);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.LUMINANCE,GW,GH,0,gl.LUMINANCE,gl.FLOAT,hField);
  }
  bindHTex();

  /* ── scene snapshot texture ── */
  const sceneTex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,sceneTex);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

  /* ── wave physics ── */
  function waveStep(){
    const DAMP=0.972, PROP=0.22;
    for(let y=1;y<GH-1;y++){
      for(let x=1;x<GW-1;x++){
        const i=y*GW+x;
        const avg=(hField[i-1]+hField[i+1]+hField[i-GW]+hField[i+GW])*0.25;
        vField[i]=(vField[i]+(avg-hField[i])*PROP)*DAMP;
      }
    }
    for(let i=0;i<GN;i++) hField[i]+=vField[i];
  }

  function disturb(cx,cy,str){
    const gx=Math.floor(cx*(GW-1)), gy=Math.floor(cy*(GH-1));
    const R=6;
    for(let dy=-R;dy<=R;dy++){
      for(let dx=-R;dx<=R;dx++){
        const nx=gx+dx, ny=gy+dy;
        if(nx<0||nx>=GW||ny<0||ny>=GH) continue;
        const d=Math.hypot(dx,dy);
        if(d>R) continue;
        const inf=Math.exp(-d*d/(R*R*0.45))*str;
        const i=ny*GW+nx;
        hField[i]+=inf; vField[i]+=inf*0.4;
      }
    }
  }

  /* auto-drip: randomly disturb surface so it's always alive */
  setInterval(()=>{
    disturb(Math.random(), Math.random(), 0.06+Math.random()*0.08);
  }, 900);

  /* ── resize ── */
  let W=0, H=0;
  function resize(){
    const rect=surface.getBoundingClientRect();
    W=Math.floor(rect.width); H=Math.floor(rect.height);
    if(!W||!H) return;
    glCanvas.width=W; glCanvas.height=H;
    gl.viewport(0,0,W,H);
    gl.uniform2f(uRes,W,H);
  }

  /* ── mouse tracking ── */
  let mUV=[0.5,0.5], mStr=0, mTarget=0;
  surface.addEventListener('mousemove',e=>{
    const r=surface.getBoundingClientRect();
    mUV[0]=(e.clientX-r.left)/r.width;
    mUV[1]=1-(e.clientY-r.top)/r.height;
    mTarget=1;
    disturb(mUV[0], 1-mUV[1], 0.04);
  });
  surface.addEventListener('mouseenter',()=>mTarget=1);
  surface.addEventListener('mouseleave',()=>mTarget=0);
  surface.addEventListener('click',e=>{
    const r=surface.getBoundingClientRect();
    const cx=(e.clientX-r.left)/r.width;
    const cy=1-(e.clientY-r.top)/r.height;
    disturb(cx,cy,0.22);
  });

  /* touch */
  surface.addEventListener('touchmove',e=>{
    if(e.touches.length!==1) return;
    const r=surface.getBoundingClientRect();
    const t=e.touches[0];
    if(t.clientX<r.left||t.clientX>r.right||t.clientY<r.top||t.clientY>r.bottom) return;
    const cx=(t.clientX-r.left)/r.width;
    const cy=1-(t.clientY-r.top)/r.height;
    mUV[0]=cx; mUV[1]=cy;
    disturb(cx,cy,0.05);
  },{passive:true});

  /* 3-D tilt */
  surface.addEventListener('mousemove',e=>{
    const r=surface.getBoundingClientRect();
    const rx=((e.clientY-r.top)/r.height-0.5)*-6;
    const ry=((e.clientX-r.left)/r.width-0.5)*6;
    surface.style.transform=`perspective(900px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
  });
  surface.addEventListener('mouseleave',()=>{
    surface.style.transform='perspective(900px) rotateX(0deg) rotateY(0deg)';
  });

  /* ── off-screen capture canvas ── */
  const offC=document.createElement('canvas');
  const offX=offC.getContext('2d',{willReadFrequently:true});

  function captureBg(){
    if(!bgCanvas.width||!bgCanvas.height) return false;
    offC.width=bgCanvas.width; offC.height=bgCanvas.height;
    offX.clearRect(0,0,offC.width,offC.height);
    offX.drawImage(bgCanvas,0,0);
    return true;
  }

  window.addEventListener('resize',resize);

  let t0=performance.now();
  function loop(ts){
    const t=(ts-t0)/1000;
    mStr+=(mTarget-mStr)*0.06;

    resize();

    for(let i=0;i<4;i++) waveStep();

    /* upload height */
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D,hTex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.LUMINANCE,GW,GH,0,gl.LUMINANCE,gl.FLOAT,hField);
    gl.uniform1i(uHeight,1);

    /* upload scene snapshot */
    if(captureBg()){
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D,sceneTex);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,offC);
      gl.uniform1i(uScene,0);
    }

    gl.uniform1f(uTime,t);
    gl.uniform1f(uMouse,mStr);
    gl.uniform2fv(uMouseUV,mUV);

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

    requestAnimationFrame(loop);
  }

  resize();
  requestAnimationFrame(loop);
})();


/* ═══════════════════════════════════════════════════════
   3.  CLICK RIPPLE
   ═══════════════════════════════════════════════════════ */
document.addEventListener('click',e=>{
  const r=document.createElement('div');
  r.className='ripple';
  const sz=200;
  r.style.cssText=`width:${sz}px;height:${sz}px;left:${e.clientX}px;top:${e.clientY}px;`;
  document.body.appendChild(r);
  setTimeout(()=>r.remove(),820);
});


/* ═══════════════════════════════════════════════════════
   4.  AUDIO
   ═══════════════════════════════════════════════════════ */
(function(){
  if(localStorage.getItem('bgMusicPlayed')) return;
  const a=document.getElementById('bgAudio');
  if(!a) return;
  a.loop=false; a.volume=0.8;
  a.play().then(()=>localStorage.setItem('bgMusicPlayed','true'))
    .catch(()=>{
      a.muted=true;
      a.play().then(()=>{
        localStorage.setItem('bgMusicPlayed','true');
        const unmute=()=>{a.muted=false;a.play().catch(()=>{});};
        window.addEventListener('pointerdown',unmute,{once:true});
        window.addEventListener('keydown',unmute,{once:true});
      }).catch(()=>{});
    });
})();
</script>
</body>
