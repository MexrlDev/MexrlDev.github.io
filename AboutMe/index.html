<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta property="og:url" content="https://mexrl.dev" />
    <meta property="og:site_name" content="MexrlDev" />
    <meta property="description" content="About Me - MexrlDev" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta property="og:image" content="https://raw.githubusercontent.com/MexrlDev/MexrlDev.github.io/refs/heads/main/AboutMe/wifu.jpeg" />
    <title>About · MexrlDev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        :root {
            --mouse-x: 0.5;
            --mouse-y: 0.5;
            --glass-blur: 18px;
            --glass-opacity: 0.55;
            --edge-glow: 0.4;
            --chromatic-shift: 0px;
            --fresnel-intensity: 0.35;
            --lens-distort: 0;
            --ripple-x: 0.5;
            --ripple-y: 0.5;
            --ripple-strength: 0;
            --bg-hue: 192;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        body {
            background: #0a0a0a;
            font-family: 'Orbitron', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            position: fixed;
            top: 0;
            left: 0;
            cursor: crosshair;
        }

        #background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            will-change: transform;
        }

        #background canvas {
            touch-action: none;
            will-change: transform;
        }

        #background::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 255, 255, 0.04) 100%);
            pointer-events: none;
            animation: breath 6s ease-in-out infinite alternate;
            z-index: 1;
        }

        @keyframes breath {
            0% {
                opacity: 0.6;
            }
            100% {
                opacity: 1;
            }
        }

        #liquid-glass-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            will-change: transform;
            opacity: 0.7;
        }

        #container {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            text-align: center;
            transform: translateY(-12%) scale(0.9);
            transform-origin: center center;
        }

        #logo-container {
            margin-bottom: 1.2rem;
            position: relative;
            z-index: 11;
        }

        #profile-pic {
            width: clamp(120px, 28vw, 170px);
            height: clamp(120px, 28vw, 170px);
            border-radius: 50%;
            object-fit: cover;
            background: #0a0a0a;
            position: relative;
            z-index: 2;
            box-shadow:
                0 0 45px rgba(0, 255, 255, 0.5),
                0 0 20px rgba(0, 255, 255, 0.3) inset,
                0 0 0 1px rgba(255, 255, 255, 0.12);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            will-change: transform, box-shadow;
        }

        #profile-pic-glow {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
            background: transparent;
            box-shadow:
                0 0 60px rgba(0, 255, 255, 0.55),
                0 0 120px rgba(0, 200, 255, 0.3),
                0 0 200px rgba(0, 180, 255, 0.15);
            transition: all 0.4s ease;
            will-change: box-shadow, transform;
        }

        #logo-container:hover #profile-pic-glow {
            box-shadow:
                0 0 90px rgba(0, 255, 255, 0.75),
                0 0 160px rgba(0, 220, 255, 0.5),
                0 0 250px rgba(0, 200, 255, 0.3),
                0 0 350px rgba(0, 180, 255, 0.15);
            transform: scale(1.06);
        }

        #profile-pic:hover {
            transform: scale(1.04);
            box-shadow:
                0 0 70px cyan,
                0 0 35px rgba(0, 255, 255, 0.6) inset,
                0 0 0 2px rgba(255, 255, 255, 0.25);
        }

        #logo {
            font-size: clamp(1.5rem, 6.5vw, 2.4rem);
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #fff;
            text-shadow:
                0 0 18px cyan,
                0 0 45px cyan,
                0 0 80px rgba(0, 255, 255, 0.7),
                0 0 120px rgba(0, 200, 255, 0.35);
            animation: pulseText 2.5s infinite;
            margin-bottom: 2rem;
            position: relative;
            z-index: 11;
            will-change: text-shadow;
        }

        @keyframes pulseText {
            0%,
            100% {
                text-shadow:
                    0 0 15px cyan,
                    0 0 35px cyan,
                    0 0 70px rgba(0, 255, 255, 0.6);
            }
            50% {
                text-shadow:
                    0 0 28px cyan,
                    0 0 65px cyan,
                    0 0 100px cyan,
                    0 0 160px rgba(0, 200, 255, 0.5);
            }
        }

        .glass-panel {
            position: relative;
            background: rgba(10, 10, 10, 0.35);
            backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
            border-radius: 28px;
            padding: 1.8rem 2.2rem;
            margin: 0.4rem 0;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 0 0 1px rgba(0, 255, 255, 0.08),
                0 0 40px rgba(0, 255, 255, var(--fresnel-intensity));
            transition: all 0.5s cubic-bezier(0.25, 0.1, 0.25, 1);
            will-change: box-shadow, border-color, transform;
            z-index: 10;
            overflow: visible;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 30px;
            z-index: -1;
            pointer-events: none;
            background: linear-gradient(135deg,
                    rgba(0, 255, 255, 0.35) 0%,
                    rgba(255, 255, 255, 0.08) 25%,
                    rgba(0, 200, 255, 0.2) 50%,
                    rgba(255, 255, 255, 0.05) 75%,
                    rgba(0, 255, 255, 0.3) 100%);
            filter: blur(8px);
            opacity: 0.7;
            transition: opacity 0.5s ease, filter 0.5s ease;
            will-change: opacity, filter;
        }

        .glass-panel::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 28px;
            pointer-events: none;
            background: radial-gradient(ellipse at calc(var(--mouse-x) * 100%) calc(var(--mouse-y) * 100%),
                    rgba(255, 255, 255, 0.14) 0%,
                    rgba(255, 255, 255, 0.03) 40%,
                    transparent 70%);
            z-index: 0;
            transition: background 0.3s ease;
            will-change: background;
        }

        .info-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.2rem;
            font-size: clamp(1rem, 4vw, 1.3rem);
            margin: 0.6rem 0;
            padding: 0.3rem 0;
            transition: all 0.3s;
            touch-action: manipulation;
            position: relative;
            z-index: 12;
        }

        @media (min-width: 769px) {
            .info-line {
                gap: 0.55rem;
            }
        }

        .info-line i {
            color: cyan;
            font-size: 1.2em;
            text-shadow:
                0 0 12px cyan,
                0 0 24px rgba(0, 255, 255, 0.5),
                0 0 40px rgba(0, 200, 255, 0.3);
            width: 1.5rem;
            text-align: center;
            flex-shrink: 0;
            touch-action: manipulation;
            transition: text-shadow 0.3s ease;
        }

        .info-line span {
            color: #ffffff;
            font-weight: 500;
            text-shadow:
                0 0 12px rgba(255, 255, 255, 0.35),
                0 0 4px rgba(255, 255, 255, 0.2),
                0 0 30px rgba(0, 255, 255, 0.25);
            touch-action: manipulation;
            transition: text-shadow 0.3s ease;
        }

        #links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.2rem;
            margin-top: 2.5rem;
            position: relative;
            z-index: 13;
        }

        .neon-btn {
            text-decoration: none;
            padding: 0.7rem 1.8rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: clamp(0.85rem, 3.5vw, 1rem);
            letter-spacing: 0.08em;
            background: rgba(10, 10, 10, 0.45);
            border: 1.5px solid rgba(0, 255, 255, 0.6);
            color: cyan;
            text-shadow:
                0 0 6px cyan,
                0 0 18px rgba(0, 255, 255, 0.5);
            box-shadow:
                0 0 20px rgba(0, 255, 255, 0.3),
                0 0 50px rgba(0, 255, 255, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(14px) saturate(1.3);
            -webkit-backdrop-filter: blur(14px) saturate(1.3);
            transition: 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            will-change: transform, box-shadow, background, border-color;
            overflow: visible;
        }

        .neon-btn::after {
            content: "";
            position: absolute;
            inset: -3px;
            border-radius: 54px;
            pointer-events: none;
            background: transparent;
            box-shadow:
                0 0 18px rgba(0, 255, 255, 0.4),
                0 0 40px rgba(0, 200, 255, 0.2);
            opacity: 0.6;
            transition: all 0.35s ease;
            z-index: -1;
            will-change: box-shadow, opacity;
        }

        .neon-btn:hover::after {
            box-shadow:
                0 0 35px rgba(0, 255, 255, 0.7),
                0 0 70px rgba(0, 220, 255, 0.45),
                0 0 110px rgba(0, 200, 255, 0.25);
            opacity: 1;
        }

        .neon-btn i {
            font-size: 1.1em;
            text-shadow:
                0 0 6px cyan,
                0 0 16px rgba(0, 255, 255, 0.5);
            transition: text-shadow 0.3s ease;
        }

        .neon-btn:hover {
            background: rgba(0, 255, 255, 0.85);
            color: #0a0a0a;
            text-shadow: none;
            box-shadow:
                0 0 40px cyan,
                0 0 80px cyan,
                0 0 130px rgba(0, 255, 255, 0.5),
                inset 0 0 20px rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.9);
            transform: translateY(-3px) scale(1.03);
        }

        .neon-btn:hover i {
            text-shadow: none;
            color: #0a0a0a;
        }

        #copyright {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            font-size: 0.8rem;
            color: #555;
            text-shadow:
                0 0 10px rgba(0, 255, 255, 0.3),
                0 0 25px rgba(0, 200, 255, 0.15);
            white-space: nowrap;
            pointer-events: none;
        }

        #copyright a {
            color: #777;
            text-decoration: none;
            pointer-events: auto;
            transition: color 0.3s ease;
        }

        #copyright a:hover {
            color: cyan;
            text-shadow: 0 0 12px cyan;
        }

        @media (max-width: 768px) {
            .glass-panel {
                padding: 1.2rem 1.4rem;
                border-radius: 22px;
            }
            .glass-panel::before {
                border-radius: 24px;
            }
            .glass-panel::after {
                border-radius: 22px;
            }
            .neon-btn {
                padding: 0.55rem 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div id="background"></div>
    <canvas id="liquid-glass-overlay"></canvas>

    <div id="container">
        <div id="logo-container">
            <div id="profile-pic-glow"></div>
            <img id="profile-pic" src="https://raw.githubusercontent.com/MexrlDev/MexrlDev.github.io/refs/heads/main/AboutMe/wifu.jpeg" alt="MexrlDev avatar" />
        </div>

        <div class="glass-panel" style="display: flex; flex-direction: column; align-items: center; min-width: 260px;">
            <div id="logo">About Me</div>

            <div class="info-line">
                <i class="fa-solid fa-user"></i>
                <span>MexrlDev</span>
            </div>
            <div class="info-line">
                <i class="fa-solid fa-cake-candles"></i>
                <span>March</span>
            </div>
            <div class="info-line">
                <i class="fa-solid fa-code"></i>
                <span>Python, Lua, JS</span>
            </div>
            <div class="info-line">
                <i class="fa-solid fa-gamepad"></i>
                <span>Anime, Manga, Music, Console Hacking</span>
            </div>

            <div id="links">
                <a href="https://git.etawen.dev/X" target="_blank" class="neon-btn">
                    <i class="fa-solid fa-code-branch"></i> git.etawen
                </a>
                <a href="https://github.com/MexrlDev" target="_blank" class="neon-btn">
                    <i class="fa-brands fa-github"></i> GitHub
                </a>
                <a href="https://x.com/mexrl" target="_blank" class="neon-btn">
                    <i class="fa-brands fa-x-twitter"></i> X
                </a>
            </div>
        </div>
    </div>

    <div id="copyright">
        © <span id="year"></span> MexrlDev
    </div>

    <audio id="bgAudio" preload="auto">
        <source src="https://raw.githubusercontent.com/MexrlDev/MexrlDev.github.io/refs/heads/main/AboutMe/Floods%20_outro.mp3"
        type="audio/mpeg">
    </audio>

    <script src="https://unpkg.com/three@0.134.0/build/three.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.net.min.js">
    </script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        var isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || window.innerWidth <= 768;
        var scaleValue = 1.0;

        var effect = VANTA.NET({
            el: "#background",
            mouseControls: true,
            touchControls: false,
            gyroControls: isMobile,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.0,
            scaleMobile: 1.0,
            color: 0x00ffff,
            backgroundColor: 0x0a0a0a,
            points: 11.0,
            maxDistance: 20.0,
            spacing: 19.0,
            showDots: true
        });

        var canvas = document.querySelector("#background canvas");
        if (canvas) {
            canvas.style.filter = "drop-shadow(0 0 12px rgba(0,255,255,0.7))";
            canvas.style.willChange = "transform";
        }

        var initialPinchDist = null;
        var baseScale = 1.0;
        var isPinching = false;
        var lastTouchX = 0;
        var lastTouchY = 0;

        function simulateMouseMove(x, y) {
            window.dispatchEvent(new MouseEvent('mousemove', {
                clientX: x,
                clientY: y
            }));
        }

        if (isMobile) {
            document.addEventListener('touchstart', function(e) {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    initialPinchDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    baseScale = scaleValue;
                    isPinching = true;
                } else if (e.touches.length === 1) {
                    var touch = e.touches[0];
                    lastTouchX = touch.clientX;
                    lastTouchY = touch.clientY;
                    simulateMouseMove(lastTouchX, lastTouchY);
                }
            }, { passive: false });

            document.addEventListener('touchmove', function(e) {
                if (isPinching && e.touches.length === 2) {
                    e.preventDefault();
                    var newDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    if (initialPinchDist > 0) {
                        var scaleChange = newDist / initialPinchDist;
                        var newScale = Math.max(0.6, Math.min(2.2, baseScale * scaleChange));
                        if (Math.abs(newScale - scaleValue) > 0.01) {
                            scaleValue = newScale;
                            effect.setOptions({ scale: scaleValue });
                        }
                    }
                } else if (!isPinching && e.touches.length === 1) {
                    var touch = e.touches[0];
                    lastTouchX = touch.clientX;
                    lastTouchY = touch.clientY;
                    simulateMouseMove(lastTouchX, lastTouchY);
                }
            }, { passive: false });

            document.addEventListener('touchend', function(e) {
                if (e.touches.length < 2) {
                    initialPinchDist = null;
                    isPinching = false;
                }
                if (e.touches.length === 1) {
                    var touch = e.touches[0];
                    lastTouchX = touch.clientX;
                    lastTouchY = touch.clientY;
                    simulateMouseMove(lastTouchX, lastTouchY);
                }
            });

            var lastTapTime = 0;
            document.addEventListener('touchend', function(e) {
                var now = Date.now();
                if (now - lastTapTime < 300 && e.target) {
                    e.preventDefault();
                }
                lastTapTime = now;
            }, { passive: false });
        }

        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
        document.addEventListener('gesturechange', function(e) { e.preventDefault(); });
        document.addEventListener('gestureend', function(e) { e.preventDefault(); });

        (function() {
            const root = document.documentElement;
            const liquidCanvas = document.getElementById('liquid-glass-overlay');
            const ctx = liquidCanvas.getContext('2d');
            let ripplePoints = [];
            const maxRipples = 12;
            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;
            let targetMouseX = mouseX;
            let targetMouseY = mouseY;
            let prevMouseX = mouseX;
            let prevMouseY = mouseY;
            let mouseVelocityX = 0;
            let mouseVelocityY = 0;
            let isInteracting = false;
            let interactionTimeout;
            let gyroAlpha = 0;
            let gyroBeta = 0;
            let gyroGamma = 0;
            let hasGyro = false;

            function resizeLiquidCanvas() {
                liquidCanvas.width = window.innerWidth;
                liquidCanvas.height = window.innerHeight;
            }
            resizeLiquidCanvas();
            window.addEventListener('resize', resizeLiquidCanvas);

            if (isMobile && window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', function(e) {
                    if (e.alpha !== null) {
                        gyroAlpha = e.alpha;
                        gyroBeta = e.beta;
                        gyroGamma = e.gamma;
                        hasGyro = true;
                    }
                }, true);
            }

            document.addEventListener('mousemove', function(e) {
                prevMouseX = targetMouseX;
                prevMouseY = targetMouseY;
                targetMouseX = e.clientX;
                targetMouseY = e.clientY;
                isInteracting = true;
                clearTimeout(interactionTimeout);
                interactionTimeout = setTimeout(function() {
                    isInteracting = false;
                }, 2000);
            });

            document.addEventListener('touchmove', function(e) {
                if (e.touches.length === 1 && !isPinching) {
                    prevMouseX = targetMouseX;
                    prevMouseY = targetMouseY;
                    targetMouseX = e.touches[0].clientX;
                    targetMouseY = e.touches[0].clientY;
                    isInteracting = true;
                    clearTimeout(interactionTimeout);
                    interactionTimeout = setTimeout(function() {
                        isInteracting = false;
                    }, 2000);
                }
            }, { passive: true });

            document.addEventListener('click', function(e) {
                ripplePoints.push({
                    x: e.clientX,
                    y: e.clientY,
                    radius: 0,
                    maxRadius: 180 + Math.random() * 140,
                    life: 1.0,
                    decay: 0.012 + Math.random() * 0.018,
                    hue: 190 + Math.random() * 15,
                    strength: 0.6 + Math.random() * 0.4,
                });
                if (ripplePoints.length > maxRipples) {
                    ripplePoints.shift();
                }
            });

            function lerp(a, b, t) {
                return a + (b - a) * t;
            }

            function lerpPoint(ax, ay, bx, by, t) {
                return [lerp(ax, bx, t), lerp(ay, by, t)];
            }

            function animateLiquidGlass(timestamp) {
                const smoothFactor = isInteracting ? 0.22 : 0.06;
                const [smX, smY] = lerpPoint(mouseX, mouseY, targetMouseX, targetMouseY, smoothFactor);
                mouseX = smX;
                mouseY = smY;

                mouseVelocityX = (targetMouseX - prevMouseX) * 0.7;
                mouseVelocityY = (targetMouseY - prevMouseY) * 0.7;

                if (hasGyro && !isInteracting) {
                    const gx = (gyroGamma / 90) * window.innerWidth * 0.5 + window.innerWidth / 2;
                    const gy = (gyroBeta / 90) * window.innerHeight * 0.5 + window.innerHeight / 2;
                    mouseX = lerp(mouseX, gx, 0.04);
                    mouseY = lerp(mouseY, gy, 0.04);
                }

                const normX = mouseX / window.innerWidth;
                const normY = mouseY / window.innerHeight;
                const clampedX = Math.max(0, Math.min(1, normX));
                const clampedY = Math.max(0, Math.min(1, normY));

                root.style.setProperty('--mouse-x', clampedX.toFixed(3));
                root.style.setProperty('--mouse-y', clampedY.toFixed(3));

                const velMag = Math.sqrt(mouseVelocityX * mouseVelocityX + mouseVelocityY * mouseVelocityY);
                const dynamicBlur = 14 + velMag * 0.04;
                const clampedBlur = Math.max(12, Math.min(28, dynamicBlur));
                root.style.setProperty('--glass-blur', clampedBlur.toFixed(1) + 'px');

                const fresnelBase = 0.25;
                const fresnelDynamic = fresnelBase + velMag * 0.002;
                const clampedFresnel = Math.max(0.2, Math.min(0.7, fresnelDynamic));
                root.style.setProperty('--fresnel-intensity', clampedFresnel.toFixed(3));

                const chromaticShift = (clampedX - 0.5) * 2.5 + mouseVelocityX * 0.015;
                root.style.setProperty('--chromatic-shift', chromaticShift.toFixed(2) + 'px');

                const lensDistort = velMag * 0.003;
                root.style.setProperty('--lens-distort', Math.min(lensDistort, 4).toFixed(2));

                root.style.setProperty('--ripple-x', clampedX.toFixed(3));
                root.style.setProperty('--ripple-y', clampedY.toFixed(3));

                ctx.clearRect(0, 0, liquidCanvas.width, liquidCanvas.height);

                ripplePoints = ripplePoints.filter(function(rp) {
                    rp.radius += (rp.maxRadius - rp.radius) * 0.08 + 0.6;
                    rp.life -= rp.decay;
                    if (rp.life <= 0) return false;

                    const alpha = rp.life * 0.5;
                    const gradient = ctx.createRadialGradient(rp.x, rp.y, rp.radius * 0.1, rp.x, rp.y, rp.radius);
                    gradient.addColorStop(0,
                        'rgba(0,255,255,' + (alpha * rp.strength * 0.7).toFixed(3) + ')');
                    gradient.addColorStop(0.35,
                        'rgba(0,220,255,' + (alpha * rp.strength * 0.45).toFixed(3) + ')');
                    gradient.addColorStop(0.7,
                        'rgba(0,180,255,' + (alpha * rp.strength * 0.2).toFixed(3) + ')');
                    gradient.addColorStop(1, 'rgba(0,150,255,0)');

                    ctx.beginPath();
                    ctx.arc(rp.x, rp.y, rp.radius, 0, Math.PI * 2);
                    ctx.fillStyle = gradient;
                    ctx.fill();

                    const innerGlow = ctx.createRadialGradient(rp.x, rp.y, 0, rp.x, rp.y, rp.radius * 0.5);
                    innerGlow.addColorStop(0, 'rgba(255,255,255,' + (alpha * 0.35).toFixed(3) + ')');
                    innerGlow.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.beginPath();
                    ctx.arc(rp.x, rp.y, rp.radius * 0.5, 0, Math.PI * 2);
                    ctx.fillStyle = innerGlow;
                    ctx.fill();

                    return true;
                });

                if (ripplePoints.length === 0 && Math.random() < 0.015) {
                    ripplePoints.push({
                        x: mouseX + (Math.random() - 0.5) * 300,
                        y: mouseY + (Math.random() - 0.5) * 300,
                        radius: 0,
                        maxRadius: 100 + Math.random() * 200,
                        life: 1.0,
                        decay: 0.008 + Math.random() * 0.02,
                        hue: 190 + Math.random() * 15,
                        strength: 0.3 + Math.random() * 0.4,
                    });
                    if (ripplePoints.length > maxRipples) ripplePoints.shift();
                }

                const cursorGlow = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 180);
                cursorGlow.addColorStop(0, 'rgba(0,255,255,' + (0.18 + velMag * 0.001).toFixed(3) + ')');
                cursorGlow.addColorStop(0.4, 'rgba(0,200,255,' + (0.08).toFixed(3) + ')');
                cursorGlow.addColorStop(1, 'rgba(0,150,255,0)');
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, 180, 0, Math.PI * 2);
                ctx.fillStyle = cursorGlow;
                ctx.fill();

                const edgeGlowTop = ctx.createLinearGradient(0, 0, 0, 120);
                edgeGlowTop.addColorStop(0, 'rgba(0,255,255,0.06)');
                edgeGlowTop.addColorStop(1, 'rgba(0,255,255,0)');
                ctx.fillStyle = edgeGlowTop;
                ctx.fillRect(0, 0, liquidCanvas.width, 120);

                const edgeGlowBottom = ctx.createLinearGradient(0, liquidCanvas.height - 120, 0, liquidCanvas.height);
                edgeGlowBottom.addColorStop(0, 'rgba(0,255,255,0)');
                edgeGlowBottom.addColorStop(1, 'rgba(0,255,255,0.06)');
                ctx.fillStyle = edgeGlowBottom;
                ctx.fillRect(0, liquidCanvas.height - 120, liquidCanvas.width, 120);

                const edgeGlowLeft = ctx.createLinearGradient(0, 0, 120, 0);
                edgeGlowLeft.addColorStop(0, 'rgba(0,255,255,0.05)');
                edgeGlowLeft.addColorStop(1, 'rgba(0,255,255,0)');
                ctx.fillStyle = edgeGlowLeft;
                ctx.fillRect(0, 0, 120, liquidCanvas.height);

                const edgeGlowRight = ctx.createLinearGradient(liquidCanvas.width - 120, 0, liquidCanvas.width, 0);
                edgeGlowRight.addColorStop(0, 'rgba(0,255,255,0)');
                edgeGlowRight.addColorStop(1, 'rgba(0,255,255,0.05)');
                ctx.fillStyle = edgeGlowRight;
                ctx.fillRect(liquidCanvas.width - 120, 0, 120, liquidCanvas.height);

                const chromaticEdgeTop = ctx.createLinearGradient(0, 0, 0, 40);
                chromaticEdgeTop.addColorStop(0, 'rgba(255,100,100,0.04)');
                chromaticEdgeTop.addColorStop(0.5, 'rgba(100,255,100,0.03)');
                chromaticEdgeTop.addColorStop(1, 'rgba(100,100,255,0.04)');
                ctx.fillStyle = chromaticEdgeTop;
                ctx.fillRect(0, 0, liquidCanvas.width, 40);

                const chromaticEdgeBottom = ctx.createLinearGradient(0, liquidCanvas.height - 40, 0, liquidCanvas.height);
                chromaticEdgeBottom.addColorStop(0, 'rgba(100,100,255,0.04)');
                chromaticEdgeBottom.addColorStop(0.5, 'rgba(255,100,100,0.03)');
                chromaticEdgeBottom.addColorStop(1, 'rgba(100,255,100,0.04)');
                ctx.fillStyle = chromaticEdgeBottom;
                ctx.fillRect(0, liquidCanvas.height - 40, liquidCanvas.width, 40);

                requestAnimationFrame(animateLiquidGlass);
            }

            requestAnimationFrame(animateLiquidGlass);

            const glassPanel = document.querySelector('.glass-panel');
            if (glassPanel) {
                glassPanel.addEventListener('mousemove', function(e) {
                    const rect = glassPanel.getBoundingClientRect();
                    const localX = (e.clientX - rect.left) / rect.width;
                    const localY = (e.clientY - rect.top) / rect.height;
                    const rotateY = (localX - 0.5) * 6;
                    const rotateX = (localY - 0.5) * -6;
                    glassPanel.style.transform =
                        'perspective(800px) rotateX(' + rotateX.toFixed(2) + 'deg) rotateY(' + rotateY.toFixed(
                            2) + 'deg)';
                    glassPanel.style.boxShadow =
                        '0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08), 0 0 0 1px rgba(0,255,255,0.12), 0 0 55px rgba(0,255,255,' +
                        (0.35 + Math.abs(localX - 0.5) * 0.5).toFixed(3) + ')';
                });
                glassPanel.addEventListener('mouseleave', function() {
                    glassPanel.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg)';
                    glassPanel.style.boxShadow =
                        '0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08), 0 0 0 1px rgba(0,255,255,0.08), 0 0 40px rgba(0,255,255,0.35)';
                });
            }

            const profilePic = document.getElementById('profile-pic');
            const profileGlow = document.getElementById('profile-pic-glow');
            if (profilePic && profileGlow) {
                document.addEventListener('mousemove', function(e) {
                    const rect = profilePic.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2;
                    const cy = rect.top + rect.height / 2;
                    const dx = (e.clientX - cx) / window.innerWidth;
                    const dy = (e.clientY - cy) / window.innerHeight;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const glowIntensity = Math.max(0, 1 - dist * 2.5);
                    profileGlow.style.boxShadow =
                        '0 0 ' + (60 + glowIntensity * 70).toFixed(0) + 'px rgba(0,255,255,' + (0.55 + glowIntensity *
                            0.4).toFixed(3) + '), 0 0 ' + (120 + glowIntensity * 100).toFixed(0) +
                        'px rgba(0,200,255,' + (0.3 + glowIntensity * 0.35).toFixed(3) + '), 0 0 ' + (200 + glowIntensity *
                            120).toFixed(0) + 'px rgba(0,180,255,' + (0.15 + glowIntensity * 0.25).toFixed(3) + ')';
                    profileGlow.style.transform = 'translate(' + (dx * 10).toFixed(1) + 'px, ' + (dy * 10).toFixed(1) +
                        'px)';
                });
            }
        })();
    </script>
    <script>
        (function() {
            if (localStorage.getItem('bgMusicPlayed')) return;

            const audio = document.getElementById('bgAudio');
            if (!audio) return;

            audio.loop = false;
            audio.volume = 0.85;

            let isMutedFallback = false;

            audio.play().then(() => {
                localStorage.setItem('bgMusicPlayed', 'true');
            }).catch(() => {
                audio.muted = true;
                return audio.play();
            }).then(() => {
                if (audio.muted) {
                    isMutedFallback = true;
                    localStorage.setItem('bgMusicPlayed', 'true');
                    const unmuteHandler = () => {
                        if (isMutedFallback && audio.muted) {
                            audio.muted = false;
                            audio.play().catch(() => {});
                            isMutedFallback = false;
                        }
                        window.removeEventListener('pointerdown', unmuteHandler);
                        window.removeEventListener('keydown', unmuteHandler);
                    };
                    window.addEventListener('pointerdown', unmuteHandler, { once: true });
                    window.addEventListener('keydown', unmuteHandler, { once: true });
                }
            }).catch(() => {});
        })();
    </script>
</body>
</html>
