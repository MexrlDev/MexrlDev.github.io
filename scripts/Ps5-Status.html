<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>PS5 JB Status</title>
  <link rel="icon" type="image/png" href="./img/icon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      --page-pad: 1.5rem;
      --glass-bg: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.1);
      --accent: #ffffff;
      --muted: rgba(255, 255, 255, 0.68);
      --font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      --max-width: 1300px;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-family);
      color: var(--accent);
      background: #0a0a0c;
      line-height: 1.5;
    }
    .bg-fixed {
      position: fixed;
      inset: 0;
      background-image: url('../img/Baek.png');
      background-size: cover;
      background-position: center;
      filter: brightness(0.35) contrast(1.15);
      z-index: -2;
    }
    .bg-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 30%, rgba(0,0,0,0.2), rgba(0,0,0,0.75));
      z-index: -1;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 1.5rem 1rem;
    }
    .panel {
      width: min(var(--max-width), 100%);
      background: rgba(255,255,255,0.035);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 1.75rem;
      padding: var(--page-pad);
      box-shadow: 0 25px 50px rgba(0,0,0,0.6), inset 0 0 30px rgba(255,255,255,0.02);
      border: 1px solid var(--glass-border);
      transition: border-color 0.2s;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .left-head {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .title {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #ffffff 0%, #b0b0ff 80%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .subtitle {
      font-size: 0.8rem;
      opacity: 0.75;
      max-width: 500px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      align-items: center;
    }
    .btn {
      padding: 0.55rem 1.1rem;
      border-radius: 2rem;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(20,20,30,0.6);
      backdrop-filter: blur(6px);
      color: var(--accent);
      cursor: pointer;
      font-weight: 500;
      font-size: 0.85rem;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
    }
    .btn:active {
      transform: scale(0.97);
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.25);
    }
    .search {
      padding: 0.55rem 1rem;
      border-radius: 2rem;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(6px);
      color: white;
      font-size: 0.9rem;
      min-width: 190px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .search:focus {
      border-color: rgba(255,255,255,0.55);
      background: rgba(0,0,0,0.65);
    }
    .chart {
      width: 100%;
      margin-top: 0.5rem;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1.4fr 1.4fr 1fr 1.2fr;
      gap: 1rem;
      padding: 1.1rem 1rem;
      border-radius: 1.2rem;
      background: rgba(255,255,255,0.035);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.07);
      align-items: start;
      margin-bottom: 0.75rem;
      transition: border-color 0.2s, background 0.2s;
    }
    .row.header {
      position: sticky;
      top: 0;
      z-index: 15;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(16px);
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      border-radius: 1rem 1rem 0 0;
      margin-bottom: 0.5rem;
      color: #ffffffcc;
    }
    .cell {
      padding: 0.2rem 0;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    .list {
      margin: 0.2rem 0 0 1.2rem;
      padding-left: 0.2rem;
      list-style: disc;
    }
    .list li {
      margin: 0.35rem 0;
      line-height: 1.35;
      font-size: 0.85rem;
    }
    .small {
      font-size: 0.8rem;
      line-height: 1.45;
    }
    .muted { color: var(--muted); }
    .firmware {
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: -0.2px;
    }
    .label {
      display: none;
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: rgba(255,255,255,0.75);
    }
    @media (max-width: 860px) {
      .row {
        display: block;
        padding: 1rem 1rem 0.8rem;
        margin-bottom: 1rem;
        border-radius: 1.25rem;
        background: rgba(255,255,255,0.045);
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255,255,255,0.1);
      }
      .row.header { display: none; }
      .field {
        display: flex;
        align-items: baseline;
        padding: 0.7rem 0;
        border-bottom: 1px dashed rgba(255,255,255,0.08);
      }
      .field:last-child { border-bottom: none; }
      .label {
        display: inline-block;
        width: 105px;
        flex-shrink: 0;
        margin-right: 0.5rem;
      }
      .value { flex: 1; word-break: break-word; }
      .list { margin-top: 0.15rem; margin-left: 0; padding-left: 0.8rem; display: block; }
      .list li { font-size: 0.82rem; }
      .cell { padding: 0; }
      .controls { width: 100%; justify-content: flex-start; }
      .search { flex: 1; min-width: 140px; }
      .firmware { font-size: 1rem; }
    }
    @media (max-width: 500px) {
      .panel { padding: 1rem; }
      .label { width: 90px; font-size: 0.75rem; }
      .title { font-size: 1.5rem; }
      .btn { padding: 0.45rem 0.9rem; font-size: 0.8rem; }
    }
    .hint { text-align: center; font-size: 0.7rem; margin-top: 1.2rem; opacity: 0.65; }
    .credit { text-align: right; font-size: 0.7rem; margin-top: 0.6rem; opacity: 0.5; }
    button, .btn, .search { font-family: inherit; }
    a.btn { text-decoration: none; }
  </style>
</head>
<body>
<div class="bg-fixed" aria-hidden="true"></div>
<div class="bg-overlay" aria-hidden="true"></div>

<div class="wrap">
  <div class="panel" role="main" aria-label="PS5 Jailbreak Status — Real exploits only">
    <header>
      <div class="left-head">
        <div class="title">PS5 JB Status</div>
        <div class="subtitle">Userland & kernel exploits — verified PS5 firmwares only</div>
      </div>
      <div class="controls">
        <input id="search" class="search" type="search" placeholder="Filter by firmware, exploit…" aria-label="Search chart">
        <button class="btn" id="reset">Reset</button>
        <a href="../index.html" class="btn">Main</a>
        <div id="musicBtn" class="btn" aria-pressed="false" role="button">Play Music</div>
      </div>
    </header>

    <div id="chartContainer" class="chart" aria-live="polite"></div>

    <div class="hint small">Always Updated · Only verified PS5 information</div>
    <div class="credit muted">Owned by Mexrl</div>
  </div>
</div>

<audio id="bgAudio" loop preload="auto"><source src="../music/bg.mp3" type="audio/mpeg"></audio>

<script>

      info: 'Full chain demonstrated: Luac0re userland + Poobs kernel → unsigned code execution, ELF loader, GPU patches. Poops PS5 Java (public) provides kernel R/W via BD‑J. Kstuff Lite supports up to 12.00.[reference:9][reference:10]'
    },

      userland: [

      ],
      kernel: [
        'Poopsploit / Poopsploit JS',
        'Lapse (some models)'
      ],

      info: 'Y2JB patched in 12.60. BD‑J remains the primary entry point. Kernel access is limited but Poopsploit works on this range.[reference:11]'
    },
    {
      firmware: '12.60 – 12.70',
      userland: [
        'BD‑J',
        'Lua loader',
        'Luac0re 2.0 (supports up to 12.70)'
      ],
      kernel: [
        'Gezine 12.70 kernel exploit (P2JB, public)',

      info: '12.70 kernel exploit released publicly by Gezine (May 2026). Still early‑stage; not yet a practical jailbreak but technical write‑up published. Patched in 13.00.[reference:12][reference:13]'
    },
    {
      firmware: '13.00 – 13.20',
      userland: [
        'BD‑J (BD‑UN‑JB 1.1, supports up to 13.20)',

      ],
      kernel: [
        'Gezine claims 0‑day kernel exploit (unpublished)',
        'No public kernel chain'
      ],
      action: 'STAY — BD‑J entry confirmed; kernel claim exists',
      info: 'BD‑UN‑JB 1.1 released with support up to 13.20. Gezine claims a working 0‑day kernel exploit for current firmware but has not released it publicly.[reference:14][reference:15]'
    },
    {
      firmware: '13.50+',
      userland: [
        'BD‑JB4‑1350 (disc‑based, Gezine claim)',
        'LuaC0re (theoretical)'
      ],
      kernel: [
        'No public exploit',
        'Gezine 0‑day claim (private, unconfirmed)',
        'BootROM key leak (Dec 2025) — future potential'
      ],
      action: 'STAY and wait for future research',
      info: 'No public jailbreak. Gezine claims a hardware‑level exploit using BootROM keys + BD‑J, but has not shared details. BootROM key leak (Dec 2025) may enable future hardware‑level attacks on all PS5s.[reference:16][reference:17]'
    }
  ];

  const chartContainer = document.getElementById('chartContainer');
  const searchInput = document.getElementById('search');
  const resetBtn = document.getElementById('reset');

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function renderHeader() {
    const hdr = document.createElement('div');
    hdr.className = 'row header';
    hdr.setAttribute('aria-hidden', 'false');
    hdr.innerHTML = `<div class="cell firmware">Firmware</div><div class="cell">Userland Exploits</div><div class="cell">Kernel Exploits</div><div class="cell">Course Of Action</div><div class="cell">Details</div>`;
    chartContainer.appendChild(hdr);
  }

  function renderRows(items) {
    chartContainer.querySelectorAll('.row.data').forEach(r => r.remove());
    items.forEach(entry => {
      const row = document.createElement('div');
      row.className = 'row data';
      row.tabIndex = 0;
      const uHtml = entry.userland?.length
        ? `<span class="value"><ul class="list">${entry.userland.map(e => `<li>${escapeHtml(e)}</li>`).join('')}</ul></span>`
        : `<span class="value small muted">No public userland</span>`;
      const kHtml = entry.kernel?.length
        ? `<span class="value"><ul class="list">${entry.kernel.map(e => `<li>${escapeHtml(e)}</li>`).join('')}</ul></span>`
        : `<span class="value small muted">No known kernel exploit</span>`;
      row.innerHTML = `
        <div class="field firmware"><span class="label">Firmware</span><span class="value firmware">${escapeHtml(entry.firmware)}</span></div>
        <div class="field userland"><span class="label">Userland</span>${uHtml}</div>
        <div class="field kernel"><span class="label">Kernel</span>${kHtml}</div>
        <div class="field action"><span class="label">Action</span><span class="value small">${escapeHtml(entry.action)}</span></div>
        <div class="field info"><span class="label">Info</span><span class="value small">${escapeHtml(entry.info)}</span></div>`;
      chartContainer.appendChild(row);
    });
  }

  function filterRows(q) {
    if (!q.trim()) return rowsData.slice();
    const lq = q.toLowerCase();
    return rowsData.filter(e =>
      e.firmware.toLowerCase().includes(lq) ||
      e.userland?.join(' ').toLowerCase().includes(lq) ||
      e.kernel?.join(' ').toLowerCase().includes(lq) ||
      e.action.toLowerCase().includes(lq) ||
      e.info.toLowerCase().includes(lq)
    );
  }

  searchInput.addEventListener('input', () => renderRows(filterRows(searchInput.value)));
  resetBtn.addEventListener('click', () => { searchInput.value = ''; renderRows(rowsData); });

  // ---------- Music ----------
  const audio = document.getElementById('bgAudio');
  const musicBtn = document.getElementById('musicBtn');
  let playing = false, mutedFallback = false;
  async function initAudio() {
    audio.loop = true; audio.volume = 0.85; audio.muted = false;
    try { await audio.play(); playing = true; } catch {
      try { audio.muted = true; await audio.play(); playing = true; mutedFallback = true; attachUnmute(); } catch { playing = false; }
    }
    updateBtn();
  }
  function updateBtn() {
    musicBtn.textContent = playing ? (mutedFallback ? 'Music (muted)' : 'Pause Music') : 'Play Music';
    musicBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
  }
  function attachUnmute() {
    const h = () => { if (mutedFallback && audio.muted) { audio.muted = false; audio.play().catch(()=>{}); mutedFallback = false; updateBtn(); } window.removeEventListener('pointerdown', h); window.removeEventListener('keydown', h); };
    window.addEventListener('pointerdown', h, { once: true });
    window.addEventListener('keydown', h, { once: true });
  }
  musicBtn.addEventListener('click', async () => {
    if (playing) { audio.pause(); playing = false; mutedFallback = false; }
    else {
      audio.muted = false;
      try { await audio.play(); playing = true; } catch { try { audio.muted = true; await audio.play(); playing = true; mutedFallback = true; attachUnmute(); } catch { playing = false; } }
    }
    updateBtn();
  });
  initAudio();

  renderHeader();
  renderRows(rowsData);
</script>
</body>
</html>
