<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuaC0re Emulator - PS5/PS4 Remote Lua Loader</title>
    <style>
        :root {
            --bg: #0a0a0a; --surface: #141414; --border: #2a2a2a; --text: #e0e0e0;
            --accent: #8b5cf6; --green: #22c55e; --red: #ef4444; --yellow: #eab308;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#000; color:var(--text); font-family:var(--font-mono); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
        .topbar { background:#0c0c0c; border-bottom:1px solid #1a1a1a; padding:8px 20px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
        .logo { width:36px; height:36px; background:linear-gradient(135deg,#7c3aed,#a78bfa); border-radius:6px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:14px; color:#fff; }
        .title { font-size:15px; font-weight:600; }
        .subtitle { font-size:11px; color:#888; margin-left:8px; }
        .status-dot { width:9px; height:9px; border-radius:50%; background:var(--green); display:inline-block; margin-right:6px; animation:pulse 2s infinite; }
        @keyframes pulse { 0%,100% { box-shadow:0 0 4px var(--green); } 50% { box-shadow:0 0 14px var(--green); } }
        .status-text { font-size:11px; color:#aaa; display:flex; align-items:center; gap:6px; }
        .fw-badge { background:#1a1a1a; border:1px solid #333; padding:4px 10px; border-radius:12px; font-size:11px; color:#ccc; }
        .main-content { flex:1; display:flex; flex-direction:column; overflow:hidden; }
        .frame { flex:1; display:flex; flex-direction:column; margin:10px; border:2px solid #1a1a1a; border-radius:8px; overflow:hidden; background:#0d0d0d; }
        .frame-header { background:#161616; padding:8px 16px; border-bottom:1px solid #222; display:flex; align-items:center; gap:10px; }
        .dot { width:10px; height:10px; border-radius:50%; }
        .dot.red { background:#ff5f57; } .dot.yellow { background:#febc2e; } .dot.green { background:#28c840; }
        .log-container { flex:1; overflow-y:auto; padding:12px 16px; font-size:12px; line-height:1.6; background:#080808; scroll-behavior:smooth; }
        .log-container::-webkit-scrollbar { width:6px; } .log-container::-webkit-scrollbar-thumb { background:#222; border-radius:3px; }
        .log-line { white-space:pre-wrap; word-break:break-all; animation:fadeIn 0.1s ease; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(2px); } to { opacity:1; transform:translateY(0); } }
        .log-line.dim { color:#666; } .log-line.accent { color:var(--accent); } .log-line.green { color:var(--green); } .log-line.yellow { color:var(--yellow); } .log-line.red { color:var(--red); }
        .input-area { border-top:1px solid #1a1a1a; background:#0f0f0f; padding:12px 16px; flex-shrink:0; display:flex; gap:10px; align-items:flex-end; }
        textarea { flex:1; background:#1a1a1a; border:1px solid #2a2a2a; color:#e0e0e0; font-family:var(--font-mono); font-size:12px; padding:10px 14px; border-radius:6px; resize:vertical; min-height:60px; max-height:200px; outline:none; }
        textarea:focus { border-color:var(--accent); }
        .btn { padding:10px 20px; border:none; border-radius:6px; font-family:var(--font-mono); font-size:12px; font-weight:600; cursor:pointer; letter-spacing:0.5px; white-space:nowrap; transition:all 0.2s; }
        .btn-run { background:var(--accent); color:#fff; } .btn-run:hover { background:#7c3aed; } .btn-run:disabled { background:#333; color:#666; cursor:not-allowed; }
        .btn-example { background:#1a1a1a; color:#aaa; border:1px solid #2a2a2a; font-size:11px; padding:6px 12px; } .btn-example:hover { background:#222; color:#fff; }
        .btn-clear { background:transparent; color:#888; border:1px solid #2a2a2a; font-size:11px; padding:6px 12px; } .btn-clear:hover { background:#1a1a1a; color:#fff; }
        .examples-row { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; padding:0 16px 8px; }
        .notifications-container { position:fixed; top:60px; right:16px; z-index:100; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
        .ps5-notification { background:#1a1a2e; border:1px solid #2a2a4a; border-radius:8px; padding:14px 18px; max-width:380px; box-shadow:0 8px 32px rgba(0,0,0,0.6); animation:slideIn 0.35s ease, fadeOut 0.5s ease forwards; animation-delay:0s, 3.5s; pointer-events:auto; display:flex; align-items:flex-start; gap:10px; }
        .ps5-notification .notif-icon { width:28px; height:28px; border-radius:50%; background:#2a1a4a; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px; }
        .ps5-notification .notif-text { font-size:12px; color:#ddd; line-height:1.4; white-space:pre-wrap; word-break:break-word; }
        @keyframes slideIn { from { transform:translateX(120%); opacity:0; } to { transform:translateX(0); opacity:1; } }
        @keyframes fadeOut { from { opacity:1; } to { opacity:0; transform:translateY(-10px); } }
        .listener-bar { background:#0d1117; border:1px solid #2a1a3a; border-radius:6px; padding:8px 14px; margin:6px 10px; font-size:11px; color:#c4b5fd; display:flex; align-items:center; gap:8px; flex-shrink:0; }
        .listener-bar .pulse { width:7px; height:7px; border-radius:50%; background:#a78bfa; animation:pulse 1.5s infinite; }
        .error-modal { position:fixed; inset:0; background:rgba(0,0,0,0.9); display:flex; align-items:center; justify-content:center; z-index:200; }
        .error-modal-inner { background:#1a1a1a; border:1px solid #333; border-radius:12px; padding:24px; text-align:center; max-width:400px; }
        .error-modal-inner p { color:#f88; font-size:12px; margin-bottom:16px; }
    </style>
</head>
<body>
    <div class="topbar">
        <div style="display:flex;align-items:center;gap:14px;">
            <div class="logo">L</div>
            <span class="title">LuaC0re</span>
            <span class="subtitle">v2.2c · Emulator</span>
            <span class="fw-badge" id="fwBadge">FW 10.01</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusLabel" style="font-size:11px;">Lua VM pending...</span>
        </div>
    </div>
    <div class="listener-bar">
        <span class="pulse"></span>
        <span>📡 Ready — paste Lua payload &amp; click Run</span>
    </div>
    <div class="main-content">
        <div class="frame">
            <div class="frame-header">
                <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
                <span style="font-size:11px;color:#666;">LuaC0re Console — PS5/PS4 Remote Lua Exploit</span>
            </div>
            <div class="log-container" id="logContainer"></div>
            <div class="input-area">
                <textarea id="payloadInput" placeholder="Paste your Lua payload here..."></textarea>
                <button class="btn btn-run" id="btnRun" disabled>▶ Run Script</button>
            </div>
            <div class="examples-row">
                <button class="btn btn-example" data-p="helloworld">👋 Hello World</button>
                <button class="btn btn-example" data-p="poops">💥 Poops PS5 (Sim)</button>
                <button class="btn btn-example" data-p="elf">🧬 ELF Loader (Sim)</button>
                <button class="btn btn-clear" id="btnClear">🗑 Clear</button>
            </div>
        </div>
    </div>
    <div class="notifications-container" id="notifContainer"></div>

    <div class="error-modal" id="errorModal" style="display:none;">
        <div class="error-modal-inner">
            <h3>❌ Lua VM Failed</h3>
            <p>Fengari could not be loaded. Please check your internet connection or try a different browser.</p>
            <button class="btn btn-run" onclick="location.reload()">Retry</button>
        </div>
    </div>

    <script>
        // ============== FENGARI LOADER (multi-source with GitHub raw fallback) ==============
        const FENGARI_SOURCES = [
            'https://cdn.jsdelivr.net/npm/fengari-web@0.1.4/dist/fengari-web.js',
            'https://unpkg.com/fengari-web@0.1.4/dist/fengari-web.js',
            'https://raw.githubusercontent.com/fengari-lua/fengari-web/refs/heads/master/dist/fengari-web.js'
        ];

        function loadFengari(urls, callback) {
            if (window.fengari && fengari.luaL_newstate) {
                callback();
                return;
            }
            let index = 0;
            function tryNext() {
                if (index >= urls.length) {
                    document.getElementById('errorModal').style.display = 'flex';
                    return;
                }
                const script = document.createElement('script');
                script.src = urls[index];
                script.onload = () => {
                    if (window.fengari && fengari.luaL_newstate) {
                        callback();
                    } else {
                        index++;
                        tryNext();
                    }
                };
                script.onerror = () => {
                    index++;
                    tryNext();
                };
                document.head.appendChild(script);
            }
            tryNext();
        }

        // ============== MAIN EMULATOR LOGIC ==============
        loadFengari(FENGARI_SOURCES, function() {
            const logContainer = document.getElementById('logContainer');
            const notifContainer = document.getElementById('notifContainer');
            const payloadInput = document.getElementById('payloadInput');
            const btnRun = document.getElementById('btnRun');
            const statusDot = document.getElementById('statusDot');
            const statusLabel = document.getElementById('statusLabel');
            const fwBadge = document.getElementById('fwBadge');
            let FW_VERSION = "10.01";

            function appendLog(msg, cls='') {
                const div = document.createElement('div');
                div.className = 'log-line ' + (cls||'');
                div.textContent = msg;
                logContainer.appendChild(div);
                logContainer.scrollTop = logContainer.scrollHeight;
            }
            function logUI(msg) { appendLog(msg); }
            function showNotification(text) {
                const el = document.createElement('div');
                el.className = 'ps5-notification';
                el.innerHTML = `<div class="notif-icon">🔔</div><div class="notif-text">${text.replace(/\n/g,'<br>')}</div>`;
                notifContainer.appendChild(el);
                setTimeout(() => { if(el.parentNode) el.remove(); }, 4000);
            }
            function updateStatus(ready) {
                statusDot.style.background = ready ? '#22c55e' : '#eab308';
                statusLabel.textContent = ready ? 'Lua VM Ready' : 'Lua VM pending...';
                btnRun.disabled = !ready;
            }

            // Simulated PS5 memory and syscalls
            const simMem = new Map();
            let nextAlloc = 0x800000000n, nextFd = 100n;
            const openFds = new Map();
            let simJailbroken = false, simUid = 1n, simPid = 42n, simSandbox = 1n;
            const simFiles = new Map();

            function simRead8(a) { const al = a & ~7n, off = Number(a & 7n); const q = simMem.get(al)||0n; return (q >> BigInt(off*8)) & 0xFFn; }
            function simWrite8(a,v) { const al = a & ~7n, off = Number(a & 7n); const q = simMem.get(al)||0n; const m = 0xFFn << BigInt(off*8); simMem.set(al, (q & ~m) | ((BigInt(v) & 0xFFn) << BigInt(off*8))); }
            function simRead32(a) { const q = simMem.get(a & ~7n)||0n; return (q >> BigInt((Number(a&7n))*8)) & 0xFFFFFFFFn; }
            function simRead64(a) { return simMem.get(a)||0n; }
            function simWrite32(a,v) { const al = a & ~7n, off = Number(a & 7n); const q = simMem.get(al)||0n; const m = 0xFFFFFFFFn << BigInt(off*8); simMem.set(al, (q & ~m) | ((BigInt(v)&0xFFFFFFFFn) << BigInt(off*8))); }
            function simWrite64(a,v) { simMem.set(a, BigInt(v)); }
            function simMalloc(size) { const addr = nextAlloc; nextAlloc += BigInt(Math.ceil(Number(size)/8)*8+16); simWrite64(addr, BigInt(size)); return addr+8n; }
            function simAllocStr(s) { const b = new TextEncoder().encode(s); const a = simMalloc(b.length+1); for(let i=0;i<b.length;i++) simWrite8(a+BigInt(i), b[i]); simWrite8(a+BigInt(b.length),0); return a; }
            function simReadStr(a) { let r=''; let i=0n; while(true) { const c=Number(simRead8(a+i)); if(c===0) break; r+=String.fromCharCode(c); i++; } return r; }
            function simReadBuf(a,l) { const b=new Uint8Array(Number(l)); for(let i=0n;i<l;i++) b[Number(i)]=Number(simRead8(a+i)); return b; }

            function simSyscall(num, a1,a2,a3,a4,a5,a6) {
                const n = BigInt(num);
                if (n===0x14n) return simPid;
                if (n===0x18n) return simUid;
                if (n===0x249n) return simSandbox;
                if (n===0x17n) { simUid=BigInt(a1); return 0n; }
                if (n===0x14bn||n===0xf0n||n===0x1e8n||n===0x1d2n) return 0n;
                if (n===0x61n) { const fd=nextFd++; openFds.set(fd,{}); return fd; }
                if (n===0x87n) { const f1=nextFd++,f2=nextFd++; openFds.set(f1,{});openFds.set(f2,{}); if(a1){simWrite32(BigInt(a1),Number(f1));simWrite32(BigInt(a1)+4n,Number(f2));} return 0n; }
                if (n===0x2an) { const f1=nextFd++,f2=nextFd++; openFds.set(f1,{});openFds.set(f2,{}); if(a1){simWrite32(BigInt(a1),Number(f1));simWrite32(BigInt(a1)+4n,Number(f2));} return 0n; }
                if (n===0x6n) { openFds.delete(BigInt(a1)); return 0n; }
                if (n===0x5n) { const fd=nextFd++; openFds.set(fd,{path:simReadStr(BigInt(a1))}); return fd; }
                if (n===0xbdn) { if(a2) { for(let i=0n;i<0x100n;i+=8n) simWrite64(BigInt(a2)+i,0n); simWrite64(BigInt(a2)+0x48n,1024n); } return 0n; }
                if (n===0x3n||n===0x4n) return BigInt(a3);
                if (n===0x1ddn) return simMalloc(Number(a2));
                if (n===0x24fn) { if(a2&&a3){simWrite64(BigInt(a3), 0xC0000000n+BigInt(simReadStr(BigInt(a2)).length*0x100));} return 0n; }
                if (n===0x215n||n===0x216n) { const fd=nextFd++; return fd; }
                if ([0x69n,0x76n,0x62n,0x6an,0x1en,0x4an,0x1afn,0x1c7n,0x1c6n,0x36n,0x25n].includes(n)) return 0n;
                if (n===0x7dn) { if(!a1) return 2n; return 0n; }
                if (n===0x16an) { const fd=nextFd++; return fd; }
                if (n===0x1b0n) { if(a1) simWrite64(BigInt(a1),100n); return 0n; }
                if (n===0x85n||n===0x1dn) return BigInt(a3);
                return 0n;
            }

            let L, luaReady = false;

            function initLua() {
                if (!window.fengari || !fengari.luaL_newstate) throw new Error('fengari missing');
                if (L) fengari.lua_close(L);
                L = fengari.luaL_newstate();
                fengari.luaL_openlibs(L);
                const def = (name, value) => {
                    fengari.lua_pushjsvalue(L, value);
                    fengari.lua_setglobal(L, name);
                };

                // Standard LuaC0re globals
                def('PLATFORM', 'PS5');
                def('FW_VERSION', FW_VERSION);
                def('EBOOT_BASE', 0x00400000n);
                def('LIBC_BASE', 0x00800000n);
                def('LIBKERNEL_BASE', 0x00C00000n);
                def('PAGE_SIZE', 0x4000);
                def('AF_UNIX', 1); def('AF_INET', 2); def('AF_INET6', 28);
                def('SOCK_STREAM', 1); def('SOCK_DGRAM', 2);
                def('IPPROTO_UDP', 17); def('IPPROTO_IPV6', 41);
                def('SO_REUSEADDR', 4); def('O_RDONLY', 0); def('O_WRONLY', 1); def('O_RDWR', 2);
                def('PROT_READ', 1); def('PROT_WRITE', 2); def('PROT_EXECUTE', 4);
                def('MAP_PRIVATE', 2); def('MAP_ANONYMOUS', 0x1000); def('MAP_SHARED', 1);

                def('read8', (a) => simRead8(BigInt(a)));
                def('read16', (a) => simRead8(BigInt(a))); // stub
                def('read32', (a) => simRead32(BigInt(a)));
                def('read64', (a) => simRead64(BigInt(a)));
                def('write8', (a,v) => simWrite8(BigInt(a),v));
                def('write16', (a,v) => {});
                def('write32', (a,v) => simWrite32(BigInt(a),v));
                def('write64', (a,v) => simWrite64(BigInt(a),v));
                def('malloc', (s) => Number(simMalloc(BigInt(s))));
                def('calloc', (s,n) => Number(simMalloc(BigInt(s)*BigInt(n))));
                def('read_buffer', (a,s) => { const b = simReadBuf(BigInt(a),s); return new TextDecoder().decode(b); });
                def('write_buffer', (d,str) => { simWriteBuf(BigInt(d), new TextEncoder().encode(str)); });
                def('memcpy', (d,s,l) => { for(let i=0n;i<BigInt(l);i++) simWrite8(BigInt(d)+i, simRead8(BigInt(s)+i)); });
                def('memset', (d,v,l) => { for(let i=0n;i<BigInt(l);i++) simWrite8(BigInt(d)+i,Number(v)); });

                // Syscall table
                const sc = {};
                const sysNums = {
                    read:3, write:4, open:5, close:6, setuid:23, getuid:24, accept:30, pipe:42, mprotect:74,
                    socket:97, connect:98, bind:104, setsockopt:105, listen:106, getsockopt:118,
                    netgetiflist:125, socketpair:135, nanosleep:240, thr_self:432,
                    dlsym:591, randomized_path:602, is_in_sandbox:585, mmap:477, getpid:20,
                    jitshm_create:533, jitshm_alias:534,
                    unlink:10, chmod:15, recvfrom:29, getsockname:32, rename:128, sendto:133,
                    mkdir:136, rmdir:137, stat:188, getdents:272, lseek:478,
                    fcntl:92, fstat:189, umtx_op:454, cpuset_setaffinity:488, rtprio_thread:466,
                    sched_yield:331, munmap:73, thr_new:455, thr_exit:431, fsync:95, ioctl:54, kill:37,
                    kqueue:362, evf_create:538, evf_delete:539, aio_multi_delete:662, aio_multi_wait:663,
                    aio_multi_poll:664, aio_multi_cancel:666, aio_submit_cmd:669
                };
                for (const [name, num] of Object.entries(sysNums)) {
                    sc[name] = (...args) => Number(simSyscall(BigInt(num), ...args.map(a => BigInt(a||0))));
                }
                def('syscall', sc);
                def('jit_syscall', sc);

                // UI
                def('print', (...args) => { logUI(args.map(String).join('\t')); });
                def('ulog', (...args) => { logUI(args.map(String).join('\t')); });
                def('send_notification', (m) => showNotification(String(m)));
                def('show_dialog', (m) => showNotification(String(m)));
                def('to_hex', (v) => '0x' + BigInt(v).toString(16).padStart(16, '0'));
                def('hex', (v) => '0x' + BigInt(v).toString(16).padStart(16, '0'));
                def('dlsym', (h,s) => 0xC0000000n + BigInt(String(s).length * 0x100));
                def('func_wrap', (a) => (...args) => Number(a));
                def('get_fwversion', () => FW_VERSION);
                def('get_current_ip', () => '192.168.1.100');
                def('get_nidpath', () => 'user/home/abcd1234');
                def('get_title_id', () => 'PPSA01650');
                def('is_jailbroken', () => simJailbroken);
                def('check_jailbroken', () => { if (!simJailbroken) throw new Error('not jailbroken'); });
                def('file_exists', (p) => simFiles.has(p) || String(p).includes('elfldr'));
                def('file_read', (p) => simFiles.get(p) || 'mock_elf_data');
                def('file_write', (p,d) => { simFiles.set(String(p), d); return true; });
                def('create_socket', () => Number(nextFd++));
                def('microsleep', () => {});
                def('sleep', () => {});

                // Simulated exploits
                def('poops_ps5', () => {
                    logUI('Poops PS5 simulation...');
                    simJailbroken = true; simUid = 0n; simSandbox = 0n;
                    logUI('Jailbreak complete!');
                    showNotification('Poops PS5: Jailbreak successful');
                });
                def('elf_loader', () => {
                    logUI('elf_loader: loaded elfldr.elf');
                    logUI('elf_loader: running...');
                    logUI('elf_loader: payloadout=0x00000000');
                });

                luaReady = true;
            }

            function runLua(code) {
                if (!luaReady) { logUI('Lua VM not ready.'); return; }
                try {
                    fengari.load(code)();
                } catch(e) {
                    logUI('Lua Error: ' + e.message);
                }
            }

            async function bootSequence() {
                updateStatus(false);
                logContainer.innerHTML = '';
                logUI('╔══════════════════════════════╗');
                logUI('║  LuaC0re v2.2c Emulator     ║');
                logUI('╚══════════════════════════════╝');
                logUI('[BOOT] Initializing PS5 OS...');
                await new Promise(r => setTimeout(r, 400));
                logUI('[BOOT] Firmware: ' + FW_VERSION);
                logUI('[BOOT] EBOOT @ 0x0000000000400000');
                logUI('[BOOT] libc @ 0x0000000000800000');
                logUI('[BOOT] libkernel @ 0x0000000000C00000');
                logUI('[INIT] JIT exploit initialized');
                logUI('[INIT] Syscalls resolved');
                logUI('[INIT] dlsym initialized');
                logUI('[READY] Remote Lua Loader listening on 192.168.1.100:9026');
                updateStatus(true);
                payloadInput.value = 'send_notification("Hello from LuaC0re!")\nprint("Hello from remote Lua!")';
                payloadInput.focus();
            }

            initLua();
            bootSequence();

            // UI events
            btnRun.addEventListener('click', () => {
                const code = payloadInput.value.trim();
                if (!code) return;
                btnRun.disabled = true;
                btnRun.textContent = '⏳ Running...';
                runLua(code);
                btnRun.disabled = false;
                btnRun.textContent = '▶ Run Script';
            });

            document.getElementById('btnClear').addEventListener('click', () => {
                logContainer.innerHTML = '';
                logUI('Log cleared.');
            });

            document.querySelectorAll('.btn-example').forEach(btn => {
                btn.addEventListener('click', () => {
                    const key = btn.dataset.p;
                    const examples = {
                        helloworld: 'send_notification("Hello from LuaC0re!")\nprint("Hello!")',
                        poops: 'poops_ps5()',
                        elf: 'elf_loader()'
                    };
                    if (examples[key]) {
                        payloadInput.value = examples[key];
                        payloadInput.focus();
                    }
                });
            });

            payloadInput.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    btnRun.click();
                }
            });
        });
    </script>
