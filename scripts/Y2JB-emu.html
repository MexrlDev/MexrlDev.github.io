<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PS5 – Y2JB</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --border: #2a2a2a;
      --text: #e0e0e0;
      --dim: #888;
      --accent: #3b82f6;
      --accent-glow: #3b82f680;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #eab308;
      --cyan: #06b6d4;
      --ps-blue: #003087;
      --ps-light: #1a5fcf;
      --notify-bg: #1a1a2e;
      --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', 'Courier New', monospace;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation; /* kills double‑tap zoom everywhere */
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: var(--font-mono);
      color: var(--text);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    /* ===== MODE SELECTION ===== */
    .mode-modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 400;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mode-dialog {
      background: #141428;
      border: 1px solid #2a2a4a;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      max-width: 320px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .mode-dialog h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #fff;
    }
    .mode-btn {
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 14px;
      border: 2px solid #333;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      background: transparent;
      color: #fff;
      cursor: pointer;
      transition: 0.2s;
    }
    .mode-btn.jb { border-color: #22c55e; color: #22c55e; }
    .mode-btn.jb:hover { background: #22c55e20; }
    .mode-btn.stock { border-color: #ef4444; color: #ef4444; }
    .mode-btn.stock:hover { background: #ef444420; }

    /* ===== BOOT SCREEN ===== */
    #boot-screen {
      position: fixed; inset: 0;
      background: radial-gradient(circle at 30% 40%, #0a1a3a 0%, #000 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 300;
      transition: opacity 0.8s ease;
    }
    .boot-logo {
      font-size: 4.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #003087, #0070cc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: pulseBoot 1.8s infinite;
    }
    @keyframes pulseBoot {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    .boot-progress {
      width: 220px;
      height: 6px;
      background: #1a1a2e;
      border-radius: 3px;
      margin-top: 30px;
      overflow: hidden;
    }
    .boot-progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #003087, #0070cc);
      border-radius: 3px;
      transition: width 0.5s ease;
    }
    .boot-text {
      margin-top: 16px;
      color: #aaa;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    /* ===== HOME SCREEN ===== */
    #home-screen {
      display: none;
      position: fixed; inset: 0;
      background: #000;
      flex-direction: column;
      z-index: 200;
    }
    .home-bg {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 20% 30%, #08142b 0%, #000 80%);
      overflow: hidden;
    }
    .particles {
      position: absolute; inset: 0;
      pointer-events: none;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      animation: float 8s infinite ease-in-out;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      25% { transform: translateY(-30px) translateX(20px); opacity: 0.5; }
      50% { transform: translateY(-60px) translateX(-10px); opacity: 0.3; }
      75% { transform: translateY(-20px) translateX(-25px); opacity: 0.7; }
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(10,10,20,0.7);
      backdrop-filter: blur(10px);
      z-index: 10;
      color: #fff;
    }
    .user-area { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #003087, #0070cc);
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; color: #fff; font-size: 16px;
    }
    .username { font-size: 14px; font-weight: 600; }
    .time { font-size: 14px; color: #ccc; }
    .icons-area { display: flex; gap: 18px; color: #aaa; }
    .icons-area span { font-size: 18px; }

    .app-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      gap: 28px;
      flex: 1;
      overflow-y: auto;
      position: relative; z-index: 5;
    }
    .app-icon {
      width: 100px; height: 100px;
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .app-icon:hover {
      transform: scale(1.05);
      background: rgba(255,255,255,0.1);
    }
    .app-icon img {
      width: 48px; height: 48px;
      margin-bottom: 6px;
    }
    .app-icon .app-name {
      font-size: 11px; color: #ccc;
      text-align: center; max-width: 90px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ===== EMULATOR OVERLAY ===== */
    #emulator-screen {
      display: none;
      position: fixed; inset: 0;
      background: #000; z-index: 250;
      flex-direction: column;
    }
    .ps5-topbar {
      background: #0c0c0c; border-bottom: 1px solid #1a1a1a;
      padding: 8px 20px; display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .ps5-topbar .logo-area { display: flex; align-items: center; gap: 12px; }
    .ps5-logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #003087, #0044cc);
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 14px; color: #fff;
    }
    .title { font-size: 15px; font-weight: 600; color: #fff; }
    .subtitle { font-size: 11px; color: #888; margin-left: 8px; }
    .fw-badge { background: #1a1a1a; border: 1px solid #333; padding: 4px 10px; border-radius: 12px; font-size: 11px; color: #ccc; }
    .jb-badge {
      background: #1a1a1a; border: 1px solid #333; padding: 4px 10px; border-radius: 12px;
      font-size: 11px; margin-left: 12px; cursor: pointer; transition: all 0.2s;
    }
    .jb-badge.stock { color: #ef4444; border-color: #ef4444; }
    .jb-badge.jb { color: #22c55e; border-color: #22c55e; }
    .status-dot {
      width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 6px;
      box-shadow: 0 0 8px; animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot { 0%,100%{ box-shadow:0 0 4px; } 50%{ box-shadow:0 0 14px; } }
    .status-text { font-size: 11px; color: #aaa; display: flex; align-items: center; gap: 6px; }

    .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .yt-frame {
      flex: 1; display: flex; flex-direction: column; margin: 10px;
      border: 2px solid #1a1a1a; border-radius: 8px; overflow: hidden; background: #0d0d0d;
    }
    .yt-frame-header {
      background: #161616; padding: 8px 16px; border-bottom: 1px solid #222;
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .yt-dot { width: 10px; height: 10px; border-radius: 50%; background: #333; }
    .yt-dot.red { background: #ff5f57; } .yt-dot.yellow { background: #febc2e; } .yt-dot.green { background: #28c840; }
    .yt-frame-header span { font-size: 11px; color: #666; margin-left: 8px; }

    .log-container {
      flex: 1; overflow-y: auto; padding: 12px 16px; font-size: 12px; line-height: 1.6;
      background: #080808; scroll-behavior: smooth;
    }
    .log-container::-webkit-scrollbar { width: 6px; }
    .log-container::-webkit-scrollbar-track { background: transparent; }
    .log-container::-webkit-scrollbar-thumb { background: #222; border-radius: 3px; }
    .log-line { white-space: pre-wrap; word-break: break-all; animation: fadeInLine 0.15s ease; }
    @keyframes fadeInLine { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
    .log-line.dim { color: #666; } .log-line.accent { color: var(--accent); } .log-line.green { color: var(--green); }
    .log-line.yellow { color: var(--yellow); } .log-line.red { color: var(--red); } .log-line.cyan { color: var(--cyan); }

    .input-area {
      border-top: 1px solid #1a1a1a; background: #0f0f0f; padding: 12px 16px;
      flex-shrink: 0; display: flex; gap: 10px; align-items: flex-end;
    }
    .input-area textarea {
      flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; color: #e0e0e0;
      font-family: var(--font-mono); font-size: 12px; padding: 10px 14px; border-radius: 6px;
      resize: vertical; min-height: 60px; max-height: 200px; outline: none;
      transition: border-color 0.2s;
    }
    .input-area textarea:focus { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
    .btn {
      padding: 10px 20px; border: none; border-radius: 6px; font-family: var(--font-mono);
      font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s;
      letter-spacing: 0.5px; white-space: nowrap;
      touch-action: manipulation; /* ensure click works */
    }
    .btn-run { background: var(--accent); color: #fff; box-shadow: 0 0 16px var(--accent-glow); }
    .btn-run:hover { background: #2563eb; box-shadow: 0 0 24px var(--accent-glow); transform: translateY(-1px); }
    .btn-run:disabled { background: #333; color: #666; box-shadow: none; cursor: not-allowed; }
    .btn-example { background: #1a1a1a; color: #aaa; border: 1px solid #2a2a2a; font-size: 11px; padding: 6px 12px; }
    .btn-example:hover { background: #222; color: #fff; }
    .btn-clear { background: transparent; color: #888; border: 1px solid #2a2a2a; font-size: 11px; padding: 6px 12px; }
    .examples-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }

    /* Notifications */
    .notifications-container {
      position: fixed; top: 60px; right: 16px; z-index: 400;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none;
    }
    .ps5-notification {
      background: var(--notify-bg); border: 1px solid #2a2a4a; border-radius: 8px;
      padding: 14px 18px; max-width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      animation: slideInNotif 0.35s ease, fadeOutNotif 0.5s ease forwards;
      animation-delay: 0s, 3.5s;
      pointer-events: auto;
      display: flex; align-items: flex-start; gap: 10px;
    }
    .ps5-notification .notif-icon { width: 28px; height: 28px; border-radius: 50%; background: #1a3a5c; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .ps5-notification .notif-text { font-size: 12px; color: #ddd; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
    @keyframes slideInNotif { from{transform:translateX(120%); opacity:0;} to{transform:translateX(0); opacity:1;} }
    @keyframes fadeOutNotif { from{opacity:1;} to{opacity:0; transform:translateY(-10px);} }

    @media (max-width: 600px) {
      .ps5-topbar { padding: 6px 12px; }
      .title { font-size: 13px; }
      .input-area { flex-direction: column; padding: 8px 10px; }
      .input-area textarea { min-height: 50px; font-size: 11px; }
      .btn { padding: 8px 14px; font-size: 11px; }
      .log-container { font-size: 10px; padding: 8px 10px; }
      .notifications-container { right: 4px; top: 50px; }
      .ps5-notification { max-width: 260px; padding: 10px 14px; font-size: 10px; }
    }
  </style>
</head>

            'compare_version','PS5_KEYS', // extra useful globals
            code
          );
          await fn(
            emuLog, toHex, showNotification, emuSyscall, SYSCALL,
            simMalloc, simRead64, simWrite64, simRead32, simWrite32, simRead8, simWrite8,
            simRead16, simWrite16, simAddrof, simCreateFakeobj, (obj)=>simAddrof(obj)+0x10n,
            (x)=>x, ()=>0x900010000n, ()=>0x200000000n, ()=>0n, simMalloc(8), [0n], 0n, [], [], {},
            EBOOT_BASE, LIBC_BASE, LIBKERNEL_BASE, LIBC_BASE+0x113B18n+0x7n,
            LIBC_BASE+0x73520n, LIBC_BASE+0xCC5A0n, LIBKERNEL_BASE+(DLSYM_OFFSETS[FW_VERSION]||0x350E0n),
            EBOOT_BASE+0x2A65EF8n, EBOOT_BASE+0x2A65F00n,
            LIBC_BASE+0x4BF0n, LIBC_BASE+0x49F0n, LIBC_BASE+0x113C08n,
            false, LOG_SERVER, null, null, EMULATOR_VERSION,
            0x4000, 0x1000, 0x2001n, 2n, 28n, 1n, 1n, 2n, 17n, 6n, 41n,
            46n, 51n, 61n, 48n, 25n, 0xffffn, 4n, 0x80n, 0n,
            0x0n,0x1n,0x2n,0x4n, 0x10n,0x20n,0x30n,
            0x1n,0x2n,0x10n,0x1000n,0x400000n,
            0n,1n,2n,0x200n,0x400n,0x8n,0x4n,
            4n,9n,10n,11n,0x4n,0n,1n,2n,
            ROP, DLSYM_OFFSETS,
            write_string, alloc_string, get_error_string, sysctlbyname,
            get_fwversion, create_pipe, read_buffer, write_buffer,
            read_null_terminated_string, find_pattern, get_current_ip,
            is_jailbroken, check_jailbroken, load_prx, dlsym,
            get_title_id, find_mod_by_name, file_exists, read_file,
            write_file, get_nidpath, nanosleep, get_dlsym_offset,
            send_network, kill_youtube, checkLogServer,
            kernel, kernel_offset, gpu, ipv6_kernel_rw,
            phys_to_dmap, virt_to_phys, get_proc_cr3, cpu_pde_field,
            cpu_walk_pt, find_proc_by_name, find_proc_by_pid,
            get_pdb2_addr, get_ptb_entry_of_relative_va,
            alloc_main_dmem, get_curproc_vmid, get_gvmspace,
            get_relative_va, ()=>({}), ()=>{},
            patch_dynlib_restriction, restore_dynlib_restriction,
            elf_parse, elf_run, elf_wait_for_exit, elf_loader,
            load_localscript, FW_VERSION,
            (a,b) => { const [am,an]=a.split('.').map(Number); const [bm,bn]=b.split('.').map(Number); return am===bm?an-bn:am-bm; },
            PS5_KEYS
          );
          await emuLog('[DONE] Payload executed.');
        } catch(e) {
          await emuLog('[ERROR] '+e.message);
        }
        await emuLog('─'.repeat(40));
      }

      // Button handlers
      btnRun.addEventListener('click', async () => {
        const code = payloadInput.value.trim();
        if(!code) { showNotification('Enter a payload first.'); return; }
        btnRun.disabled = true; btnRun.textContent = '⏳ Running...';
        await executePayload(code);
        btnRun.disabled = false; btnRun.textContent = '▶ Run Script';
      });
      document.getElementById('btnClear').addEventListener('click', ()=>{
        logContainer.innerHTML = ''; appendLog('Console cleared.', 'dim');
      });
      document.querySelectorAll('.btn-example').forEach(btn => {
        btn.addEventListener('click', ()=>{
          const key = btn.dataset.payload;
          const examples = {
            helloworld: `await log("Hello from Y2JB!");\nsend_notification("Hello!");`,
            dlsym_test: `check_jailbroken();\nlet addr = dlsym(0x2001n, "sceKernelAllocateMainDirectMemory");\nawait log("dlsym -> " + toHex(addr));`
          };
          if(examples[key]) { payloadInput.value = examples[key]; payloadInput.focus(); }
        });
      });

      // ====================== BOOT & HOME UI ======================
      async function startBoot() {
        bootScreen.style.display = 'flex'; homeScreen.style.display = 'none'; emulatorScreen.style.display = 'none';
        let progress = 0;
        const interval = setInterval(() => {
          progress += Math.random()*8;
          if(progress>100) progress=100;
          bootProgressBar.style.width = progress+'%';
          bootStatus.textContent = progress<30?'Initializing...':progress<70?'Loading system...':'Almost ready...';
          if(progress>=100) {
            clearInterval(interval);
            bootStatus.textContent = 'Welcome';
            setTimeout(()=>{
              bootScreen.style.opacity='0';
              setTimeout(()=>{
                bootScreen.style.display='none';
                homeScreen.style.display='flex';
                generateParticles();
              },800);
            },600);
          }
        },500);
      }

      function generateParticles() {
        const container = document.getElementById('particlesContainer');
        container.innerHTML = '';
        for(let i=0;i<30;i++) {
          const p = document.createElement('div'); p.className='particle';
          const size = Math.random()*4+2;
          p.style.width=size+'px'; p.style.height=size+'px';
          p.style.left=Math.random()*100+'%'; p.style.top=Math.random()*100+'%';
          p.style.animationDelay=Math.random()*5+'s';
          container.appendChild(p);
        }
      }

      function updateClock() {
        const now = new Date();
        document.getElementById('homeTime').textContent = now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      }
      setInterval(updateClock,1000); updateClock();

      youtubeAppIcon.addEventListener('click', ()=>{
        homeScreen.style.display='none'; emulatorScreen.style.display='flex'; initEmulator();
      });

      // Mode selection
      document.getElementById('btnJbMode').addEventListener('click', ()=>{
        simJailbroken=true; simUid=0n; simSandbox=0n;
        modeModal.style.display='none'; startBoot();
      });
      document.getElementById('btnStockMode').addEventListener('click', ()=>{
        simJailbroken=false; simUid=1n; simSandbox=1n;
        modeModal.style.display='none'; startBoot();
      });

      // Kill double-tap zoom completely
      document.addEventListener('gesturestart', e=>e.preventDefault());
      document.addEventListener('gesturechange', e=>e.preventDefault());
      document.addEventListener('gestureend', e=>e.preventDefault());

      // Initial state: show mode modal, hide boot screen
      bootScreen.style.display='none';
      modeModal.style.display='flex';
    })();
  </script>
</body>
</html>
