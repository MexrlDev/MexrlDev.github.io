<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PS5 – Y2JB</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --border: #2a2a2a;
            --text: #e0e0e0;
            --dim: #888;
            --accent: #3b82f6;
            --accent-glow: #3b82f680;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #eab308;
            --cyan: #06b6d4;
            --ps-blue: #003087;
            --ps-light: #1a5fcf;
            --notify-bg: #1a1a2e;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', 'Courier New', monospace;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: var(--font-mono);
            color: var(--text);
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Boot screen */
        #boot-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 30% 40%, #0a1a3a 0%, #000 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 300;
            transition: opacity 0.8s ease;
        }
        .boot-logo {
            font-size: 4.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #003087, #0070cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            animation: pulseBoot 1.8s infinite;
        }
        @keyframes pulseBoot {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        .boot-progress {
            width: 220px;
            height: 6px;
            background: #1a1a2e;
            border-radius: 3px;
            margin-top: 30px;
            overflow: hidden;
        }
        .boot-progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #003087, #0070cc);
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        .boot-text {
            margin-top: 16px;
            color: #aaa;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* Home screen */
        #home-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            flex-direction: column;
            z-index: 200;
        }
        .home-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at 20% 30%, #08142b 0%, #000 80%);
            overflow: hidden;
        }
        .particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            animation: float 8s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
            25% { transform: translateY(-30px) translateX(20px); opacity: 0.5; }
            50% { transform: translateY(-60px) translateX(-10px); opacity: 0.3; }
            75% { transform: translateY(-20px) translateX(-25px); opacity: 0.7; }
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(10,10,20,0.7);
            backdrop-filter: blur(10px);
            z-index: 10;
            color: #fff;
        }
        .user-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #003087, #0070cc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            font-size: 16px;
        }
        .username {
            font-size: 14px;
            font-weight: 600;
        }
        .time {
            font-size: 14px;
            color: #ccc;
        }
        .icons-area {
            display: flex;
            gap: 18px;
            color: #aaa;
        }
        .icons-area span {
            font-size: 18px;
        }

        .app-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            gap: 28px;
            position: relative;
            z-index: 5;
            flex: 1;
            overflow-y: auto;
        }
        .app-icon {
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .app-icon:hover {
            transform: scale(1.05);
            background: rgba(255,255,255,0.1);
        }
        .app-icon img {
            width: 48px;
            height: 48px;
            margin-bottom: 6px;
        }
        .app-icon .app-name {
            font-size: 11px;
            color: #ccc;
            text-align: center;
            max-width: 90px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Emulator overlay */
        #emulator-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            z-index: 250;
            flex-direction: column;
        }
        .ps5-topbar {
            background: #0c0c0c;
            border-bottom: 1px solid #1a1a1a;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .ps5-topbar .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .ps5-logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #003087, #0044cc);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 14px;
            color: #fff;
        }
        .title {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
        }
        .subtitle {
            font-size: 11px;
            color: #888;
            margin-left: 8px;
        }
        .fw-badge {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: #ccc;
        }
        .jb-badge {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-left: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .jb-badge.stock { color: #ef4444; border-color: #ef4444; }
        .jb-badge.jb { color: #22c55e; border-color: #22c55e; }
        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            box-shadow: 0 0 8px;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot { 0%,100%{ box-shadow:0 0 4px; } 50%{ box-shadow:0 0 14px; } }
        .status-text { font-size: 11px; color: #aaa; display: flex; align-items: center; gap: 6px; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .yt-frame {
            flex: 1; display: flex; flex-direction: column; margin: 10px;
            border: 2px solid #1a1a1a; border-radius: 8px; overflow: hidden; background: #0d0d0d;
        }
        .yt-frame-header {
            background: #161616; padding: 8px 16px; border-bottom: 1px solid #222;
            display: flex; align-items: center; gap: 10px; flex-shrink: 0;
        }
        .yt-dot { width: 10px; height: 10px; border-radius: 50%; background: #333; }
        .yt-dot.red { background: #ff5f57; } .yt-dot.yellow { background: #febc2e; } .yt-dot.green { background: #28c840; }
        .yt-frame-header span { font-size: 11px; color: #666; margin-left: 8px; }

        .log-container {
            flex: 1; overflow-y: auto; padding: 12px 16px; font-size: 12px; line-height: 1.6;
            background: #080808; scroll-behavior: smooth;
        }
        .log-container::-webkit-scrollbar { width: 6px; }
        .log-container::-webkit-scrollbar-track { background: transparent; }
        .log-container::-webkit-scrollbar-thumb { background: #222; border-radius: 3px; }
        .log-line { white-space: pre-wrap; word-break: break-all; animation: fadeInLine 0.15s ease; }
        @keyframes fadeInLine { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
        .log-line.dim { color: #666; } .log-line.accent { color: var(--accent); } .log-line.green { color: var(--green); }
        .log-line.yellow { color: var(--yellow); } .log-line.red { color: var(--red); } .log-line.cyan { color: var(--cyan); }

        .input-area {
            border-top: 1px solid #1a1a1a; background: #0f0f0f; padding: 12px 16px;
            flex-shrink: 0; display: flex; gap: 10px; align-items: flex-end;
        }
        .input-area textarea {
            flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; color: #e0e0e0;
            font-family: var(--font-mono); font-size: 12px; padding: 10px 14px; border-radius: 6px;
            resize: vertical; min-height: 60px; max-height: 200px; outline: none; transition: border-color 0.2s;
        }
        .input-area textarea:focus { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
        .btn {
            padding: 10px 20px; border: none; border-radius: 6px; font-family: var(--font-mono);
            font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s;
            letter-spacing: 0.5px; white-space: nowrap;
        }
        .btn-run { background: var(--accent); color: #fff; box-shadow: 0 0 16px var(--accent-glow); }
        .btn-run:hover { background: #2563eb; box-shadow: 0 0 24px var(--accent-glow); transform: translateY(-1px); }
        .btn-run:disabled { background: #333; color: #666; box-shadow: none; cursor: not-allowed; }
        .btn-example { background: #1a1a1a; color: #aaa; border: 1px solid #2a2a2a; font-size: 11px; padding: 6px 12px; }
        .btn-example:hover { background: #222; color: #fff; }
        .btn-clear { background: transparent; color: #888; border: 1px solid #2a2a2a; font-size: 11px; padding: 6px 12px; }
        .examples-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }

        .notifications-container {
            position: fixed; top: 60px; right: 16px; z-index: 400; display: flex; flex-direction: column; gap: 8px; pointer-events: none;
        }
        .ps5-notification {
            background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 8px; padding: 14px 18px;
            max-width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            animation: slideInNotif 0.35s ease, fadeOutNotif 0.5s ease forwards;
            animation-delay: 0s, 3.5s; pointer-events: auto; display: flex; align-items: flex-start; gap: 10px;
        }
        .ps5-notification .notif-icon { width: 28px; height: 28px; border-radius: 50%; background: #1a3a5c; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .ps5-notification .notif-text { font-size: 12px; color: #ddd; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
        @keyframes slideInNotif { from{transform:translateX(120%); opacity:0;} to{transform:translateX(0); opacity:1;} }
        @keyframes fadeOutNotif { from{opacity:1;} to{opacity:0; transform:translateY(-10px);} }

        /* Mode selection modal */
        .mode-modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9); z-index: 350; display: flex; align-items: center; justify-content: center;
        }
        .mode-dialog {
            background: #141428; border: 1px solid #2a2a4a; border-radius: 20px; padding: 30px;
            text-align: center; max-width: 320px; width: 90%;
        }
        .mode-dialog h2 { font-size: 1.5rem; margin-bottom: 20px; color: #fff; }
        .mode-btn {
            display: block; width: 100%; margin: 10px 0; padding: 14px;
            border: 2px solid #333; border-radius: 12px; font-size: 1rem;
            font-weight: 600; background: transparent; color: #fff; cursor: pointer;
            transition: 0.2s;
        }
        .mode-btn.jb { border-color: #22c55e; color: #22c55e; }
        .mode-btn.jb:hover { background: #22c55e20; }
        .mode-btn.stock { border-color: #ef4444; color: #ef4444; }
        .mode-btn.stock:hover { background: #ef444420; }

        /* Responsive */
        @media (max-width: 600px) {
            .ps5-topbar { padding: 6px 12px; }
            .title { font-size: 13px; }
            .input-area { flex-direction: column; padding: 8px 10px; }
            .input-area textarea { min-height: 50px; font-size: 11px; }
            .btn { padding: 8px 14px; font-size: 11px; }
            .log-container { font-size: 10px; padding: 8px 10px; }
            .notifications-container { right: 4px; top: 50px; }
            .ps5-notification { max-width: 260px; padding: 10px 14px; font-size: 10px; }
        }
    </style>
</head>

            // Memory read/write helpers
            function simRead8(addr) { const aligned = addr & ~7n; const offset = Number(addr & 7n); const qword = simMemory.get(aligned) || 0n; return (qword >> BigInt(offset * 8)) & 0xFFn; }
            function simWrite8(addr, val) { const aligned = addr & ~7n; const offset = Number(addr & 7n); const qword = simMemory.get(aligned) || 0n; const mask = 0xFFn << BigInt(offset * 8); simMemory.set(aligned, (qword & ~mask) | ((BigInt(val) & 0xFFn) << BigInt(offset * 8))); }
            function simRead16(addr) { const qword = simMemory.get(addr & ~7n) || 0n; const offset = Number(addr & 7n); return (qword >> BigInt(offset * 8)) & 0xFFFFn; }
            function simWrite16(addr, val) { const aligned = addr & ~7n; const offset = Number(addr & 7n); const qword = simMemory.get(aligned) || 0n; const mask = 0xFFFFn << BigInt(offset * 8); simMemory.set(aligned, (qword & ~mask) | ((BigInt(val) & 0xFFFFn) << BigInt(offset * 8))); }
            function simRead32(addr) { const qword = simMemory.get(addr & ~7n) || 0n; const offset = Number(addr & 7n); return (qword >> BigInt(offset * 8)) & 0xFFFFFFFFn; }
            function simWrite32(addr, val) { const aligned = addr & ~7n; const offset = Number(addr & 7n); const qword = simMemory.get(aligned) || 0n; const mask = 0xFFFFFFFFn << BigInt(offset * 8); simMemory.set(aligned, (qword & ~mask) | ((BigInt(val) & 0xFFFFFFFFn) << BigInt(offset * 8))); }
            function simRead64(addr) { return simMemory.get(addr) || 0n; }
            function simWrite64(addr, val) { simMemory.set(addr, BigInt(val)); }
            function simMalloc(size) { const addr = nextMallocAddr; nextMallocAddr += BigInt(Math.ceil(Number(size) / 8) * 8 + 16); simWrite64(addr, BigInt(size)); return addr + 8n; }
            function simAllocString(str) { const encoder = new TextEncoder(); const bytes = encoder.encode(str); const addr = simMalloc(bytes.length + 1); for (let i = 0; i < bytes.length; i++) simWrite8(addr + BigInt(i), bytes[i]); simWrite8(addr + BigInt(bytes.length), 0); return addr; }
            function simReadString(addr) { let result = ''; let i = 0n; while (true) { const b = Number(simRead8(addr + i)); if (b === 0) break; result += String.fromCharCode(b); i++; if (i > 10000n) break; } return result; }
            function simReadBuffer(addr, len) { const buf = new Uint8Array(Number(len)); for (let i = 0n; i < len; i++) buf[Number(i)] = Number(simRead8(addr + i)); return buf; }
            function simWriteBuffer(addr, buf) { for (let i = 0; i < buf.length; i++) simWrite8(addr + BigInt(i), buf[i]); }

            const EBOOT_BASE = 0x00400000n, LIBC_BASE = 0x00800000n, LIBKERNEL_BASE = 0x00C00000n;
            const ROP = {
                get pop_rsp() { return EBOOT_BASE + 0x49f7fn; },
                get pop_rax() { return EBOOT_BASE + 0x2d954n; },
                get pop_rdi() { return EBOOT_BASE + 0xb0ec5n; },
                get pop_rsi() { return EBOOT_BASE + 0xb8a81n; },
                get pop_rdx() { return EBOOT_BASE + 0xb692n; },
                get pop_rcx() { return EBOOT_BASE + 0x187da3n; },
                get pop_r8() { return EBOOT_BASE + 0x1a8ff9n; },
                get pop_r9() { return EBOOT_BASE + 0x1394e01n; },
                get pop_rbp() { return EBOOT_BASE + 0x69n; },
                get mov_qword_rdi_rax() { return EBOOT_BASE + 0x49a77n; },
                get mov_qword_rdi_rdx() { return EBOOT_BASE + 0x3a3b95n; },
                get mov_rax_0x200000000() { return EBOOT_BASE + 0x1283d40n; },
                get mov_rsp_rbp() { return EBOOT_BASE + 0xb1424n; },
                get ret() { return EBOOT_BASE + 0x32n; },
            };

            const DLSYM_OFFSETS = {
                "4.03": 0x317D0n, "4.50": 0x317D0n, "4.51": 0x317D0n,
                "5.00": 0x32160n, "5.02": 0x32160n, "5.10": 0x32160n,
                "5.50": 0x32230n, "6.00": 0x330A0n, "6.02": 0x330A0n,
                "6.50": 0x33110n, "7.00": 0x33E90n, "7.01": 0x33E90n,
                "7.20": 0x33ED0n, "7.40": 0x33ED0n, "7.60": 0x33ED0n,
                "7.61": 0x33ED0n, "8.00": 0x342E0n, "8.20": 0x342E0n,
                "8.40": 0x342E0n, "8.60": 0x342E0n, "9.00": 0x350E0n,
                "9.05": 0x350E0n, "9.20": 0x350E0n, "9.40": 0x350E0n,
                "9.60": 0x350E0n, "10.00": 0x349C0n, "10.01": 0x349C0n,
                "10.20": 0x349C0n, "10.40": 0x349C0n, "10.60": 0x349C0n,
                "11.00": 0x349C0n, "11.20": 0x349C0n, "11.40": 0x349C0n,
                "11.60": 0x349C0n, "12.00": 0x349C0n, "12.20": 0x349C0n,
                "12.40": 0x349C0n, "12.60": 0x349C0n, "12.70": 0x349C0n,
                "13.00": 0x349C0n, "13.20": 0x349C0n,
            };

            const SYSCALL = {
                read: 0x3n, write: 0x4n, open: 0x5n, close: 0x6n,
                setuid: 0x17n, getuid: 0x18n, getpid: 0x14n,
                mprotect: 0x4an, dlsym: 0x24fn, jitshm_create: 0x215n,
                jitshm_alias: 0x216n, sched_yield: 0x14bn,
                // ... (full list omitted for brevity, see full version)
            };

            function emuSyscall(num, arg1, arg2, arg3, arg4, arg5, arg6) {
                const n = BigInt(num);
                arg1 = BigInt(arg1 || 0n); arg2 = BigInt(arg2 || 0n); arg3 = BigInt(arg3 || 0n);
                arg4 = BigInt(arg4 || 0n); arg5 = BigInt(arg5 || 0n); arg6 = BigInt(arg6 || 0n);

                if (!simJailbroken && [SYSCALL.setuid, SYSCALL.dlsym, SYSCALL.jitshm_create, SYSCALL.jitshm_alias, SYSCALL.mprotect].includes(n)) return 0n;

                if (n === SYSCALL.getpid) return simPid;
                if (n === SYSCALL.getuid) return simUid;
                if (n === SYSCALL.setuid) { simUid = arg1; return 0n; }
                if (n === SYSCALL.sched_yield) return 0n;
                // ... other syscalls (same as previous emulator)

                return 0n;
            }

            // UI helpers
            function appendLog(msg, cls = '') {
                const div = document.createElement('div');
                div.className = 'log-line ' + cls;
                div.textContent = msg;
                logContainer.appendChild(div);
                logContainer.scrollTop = logContainer.scrollHeight;
            }
            async function emuLog(msg) {
                for (const line of String(msg).split('\n')) appendLog(line || '\u00A0');
                await new Promise(r => requestAnimationFrame(() => setTimeout(r, 1)));
            }
            function showNotification(text) {
                const notif = document.createElement('div');
                notif.className = 'ps5-notification';
                notif.innerHTML = `<div class="notif-icon">📢</div><div class="notif-text">${text.replace(/\n/g, '<br>')}</div>`;
                notifContainer.appendChild(notif);
                setTimeout(() => { if (notif.parentNode) notif.remove(); }, 4200);
            }

            function updateJbUI() {
                if (simJailbroken) {
                    jbBadge.className = 'jb-badge jb'; jbBadge.innerHTML = '🔓 JB';
                    statusDot.style.background = 'var(--green)'; statusDot.style.boxShadow = '0 0 8px var(--green)';
                    statusLabel.textContent = 'Remote JS Loader Active (JB)';
                } else {
                    jbBadge.className = 'jb-badge stock'; jbBadge.innerHTML = '🔒 Stock';
                    statusDot.style.background = '#f97316'; statusDot.style.boxShadow = '0 0 8px #f97316';
                    statusLabel.textContent = 'Remote JS Loader Active (Stock)';
                }
            }
            function toggleJb() {
                simJailbroken = !simJailbroken;
                simUid = simJailbroken ? 0n : 1n;
                simSandbox = simJailbroken ? 0n : 1n;
                updateJbUI();
                showNotification(simJailbroken ? 'Switched to Jailbroken mode' : 'Switched to Stock (non‑JB) mode');
            }
            jbBadge.addEventListener('click', toggleJb);

            // Emulator initialization (called when entering console)
            async function initEmulator() {
                updateJbUI();
                await emuLog('═'.repeat(50));
                await emuLog(EMULATOR_VERSION);
                await emuLog('═'.repeat(50));
                await emuLog(`FW ${FW_VERSION} | ${simJailbroken ? 'JB' : 'STOCK'} mode`);
                await emuLog('Kernel simulation loaded. Ready for payloads.\n');
                btnRun.disabled = false;
            }

            // Execute payload
            async function executePayload(code) {
                await emuLog('─'.repeat(40));
                await emuLog('[EXEC] Running script...');
                try {
                    const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;
                    const fn = new AsyncFunction('log', 'toHex', 'send_notification', 'syscall', 'SYSCALL', /* ... many args ... */, code);
                    await fn(emuLog, v => '0x'+BigInt(v).toString(16).padStart(16,'0'), showNotification, emuSyscall, SYSCALL, /* ... other globals */);
                    await emuLog('[DONE] Success.');
                } catch (e) {
                    await emuLog('[ERROR] ' + e.message);
                }
                await emuLog('─'.repeat(40));
            }

            btnRun.addEventListener('click', async () => {
                const code = payloadInput.value.trim();
                if (!code) { showNotification('Enter a payload first.'); return; }
                btnRun.disabled = true;
                btnRun.textContent = '⏳ Running...';
                await executePayload(code);
                btnRun.disabled = false;
                btnRun.textContent = '▶ Run Script';
            });
            document.getElementById('btnClear').addEventListener('click', () => { logContainer.innerHTML = ''; appendLog('Console cleared.', 'dim'); });
            document.querySelectorAll('.btn-example').forEach(btn => {
                btn.addEventListener('click', () => {
                    const key = btn.dataset.payload;
                    const examples = {
                        helloworld: `await log("Hello from Y2JB!");\nsend_notification("Hello!");`,
                        setlogserver: `LOG_SERVER = 'http://192.168.1.180:8080/log';\nawait log("Log server set to " + LOG_SERVER);`,
                        dlsym_test: `check_jailbroken();\nlet addr = dlsym(0x2001n, "sceKernelAllocateMainDirectMemory");\nawait log("dlsym -> " + toHex(addr));`
                    };
                    if (examples[key]) { payloadInput.value = examples[key]; payloadInput.focus(); }
                });
            });

            // Boot sequence
            async function startBoot() {
                bootScreen.style.display = 'flex';
                homeScreen.style.display = 'none';
                emulatorScreen.style.display = 'none';

                let progress = 0;
                const interval = setInterval(() => {
                    progress += Math.random() * 8;
                    if (progress > 100) progress = 100;
                    bootProgressBar.style.width = progress + '%';
                    bootStatus.textContent = progress < 30 ? 'Initializing...' : progress < 70 ? 'Loading system...' : 'Almost ready...';
                    if (progress >= 100) {
                        clearInterval(interval);
                        bootStatus.textContent = 'Welcome';
                        setTimeout(() => {
                            bootScreen.style.opacity = '0';
                            setTimeout(() => {
                                bootScreen.style.display = 'none';
                                homeScreen.style.display = 'flex';
                                generateParticles();
                            }, 800);
                        }, 600);
                    }
                }, 500);
            }

            function generateParticles() {
                const container = document.getElementById('particlesContainer');
                container.innerHTML = '';
                for (let i = 0; i < 30; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    const size = Math.random() * 4 + 2;
                    particle.style.width = size + 'px';
                    particle.style.height = size + 'px';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.top = Math.random() * 100 + '%';
                    particle.style.animationDelay = Math.random() * 5 + 's';
                    container.appendChild(particle);
                }
            }

            function updateClock() {
                const now = new Date();
                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                document.getElementById('homeTime').textContent = timeStr;
            }
            setInterval(updateClock, 1000);
            updateClock();

            // YouTube app opens emulator
            youtubeAppIcon.addEventListener('click', () => {
                homeScreen.style.display = 'none';
                emulatorScreen.style.display = 'flex';
                initEmulator();
            });

            // Mode selection handlers
            document.getElementById('btnJbMode').addEventListener('click', () => {
                simJailbroken = true;
                simUid = 0n; simSandbox = 0n;
                modeModal.style.display = 'none';
                startBoot();
            });
            document.getElementById('btnStockMode').addEventListener('click', () => {
                simJailbroken = false;
                simUid = 1n; simSandbox = 1n;
                modeModal.style.display = 'none';
                startBoot();
            });

            // Prevent zoom gestures
            document.addEventListener('gesturestart', e => e.preventDefault());
            document.addEventListener('gesturechange', e => e.preventDefault());
            document.addEventListener('gestureend', e => e.preventDefault());

            // Initial state: show mode modal
            bootScreen.style.display = 'none';
            modeModal.style.display = 'flex';
        })();
    </script>
