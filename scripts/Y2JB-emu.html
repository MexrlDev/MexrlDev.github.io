<!DOCTYPE html>

    <style>

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }

        .boot-text { margin-top:16px; color:#aaa; font-size:0.9rem; letter-spacing:1px; }
        #home-screen { display:none; position:fixed; inset:0; background:#000; flex-direction:column; z-index:200; }

        /* Emulator overlay */
        .emulator-screen { display:none; position:fixed; inset:0; background:#000; z-index:250; flex-direction:column; }
        .ps5-topbar { background:#0c0c0c; border-bottom:1px solid #1a1a1a; padding:8px 20px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
        .ps5-topbar .logo-area { display:flex; align-items:center; gap:12px; }
        .ps5-logo { width:36px; height:36px; background:linear-gradient(135deg, #003087, #0044cc); border-radius:6px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:14px; color:#fff; }

            // YouTube logger
            const ytLog = makeLogger(ytLogContainer);
            // Netflix logger
            const nfLog = makeLogger(nfLogContainer);

            // Update mode badge for both consoles
            function updateModeBadges() {
                const cls = simJailbroken ? 'jb' : 'stock';
                const text = simJailbroken ? '🔓 JB' : '🔒 Stock';
                ytModeBadge.className = `mode-badge ${cls}`; ytModeBadge.textContent = text;
                nfModeBadge.className = `mode-badge ${cls}`; nfModeBadge.textContent = text;
                const dotColor = simJailbroken ? 'var(--green)' : '#f97316';
                const shadow = `0 0 8px ${dotColor}`;
                ytStatusDot.style.background = dotColor; ytStatusDot.style.boxShadow = shadow;
                nfStatusDot.style.background = dotColor; nfStatusDot.style.boxShadow = shadow;
                ytStatusLabel.textContent = simJailbroken ? 'Remote JS Loader Active (JB)' : 'Remote JS Loader Active (Stock)';
                nfStatusLabel.textContent = simJailbroken ? 'Remote JS Loader Active (JB)' : 'Remote JS Loader Active (Stock)';
            }

            // Initialize YouTube emulator
            async function initYTEmulator() {
                updateModeBadges();
                ytFwBadge.textContent = 'FW ' + FW_VERSION;
                await ytLog('═'.repeat(50), 'accent');
                await ytLog('Y2JB 1.4 Emulator', 'accent');
                await ytLog('═'.repeat(50), 'accent');
                await ytLog(`FW ${FW_VERSION} | ${simJailbroken?'JB':'STOCK'} mode`);
                await ytLog('Kernel simulation loaded. Ready for payloads.\n');
                ytBtnRun.disabled = false;
            }

            // Initialize Netflix emulator
            async function initNFEmulator() {
                updateModeBadges();
                nfFwBadge.textContent = 'FW ' + FW_VERSION;
                await nfLog('═'.repeat(50), 'accent-nf');
                await nfLog('Netflix N Hack 1.0 Emulator', 'accent-nf');
                await nfLog('═'.repeat(50), 'accent-nf');
                await nfLog(`FW ${FW_VERSION} | ${simJailbroken?'JB':'STOCK'} mode`);
                await nfLog('Kernel simulation loaded. Ready for payloads.\n');
                nfBtnRun.disabled = false;
            }

            // Generic payload executor
            async function executePayload(code, logFunc) {
                await logFunc('─'.repeat(40));
                await logFunc('[EXEC] Running script...');
                try {
                    const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;
                    const fn = new AsyncFunction(
                        'log','toHex','send_notification','syscall','SYSCALL','malloc','read64','write64','read32','write32',
                        'read8','write8','read16','write16','addrof','create_fakeobj','get_backing_store','pwn',
                        'get_bytecode_addr','call_rop','call','return_value_addr','return_value_buf','saved_fp',
                        'rop_chain','fake_bc','fake_frame','eboot_base','libc_base','libkernel_base','syscall_wrapper',
                        'libc_strerror','libc_error','SCE_KERNEL_DLSYM','sceKernelAllocateMainDirectMemory',
                        'sceKernelMapNamedDirectMemory','Thrd_create','Thrd_join','sceKernelGetModuleInfoFromAddr',
                        'NETWORK_LOGGING','LOG_SERVER','_log_socket_fd','_log_socket_buf','version_string',
                        'PAGE_SIZE','PHYS_PAGE_SIZE','LIBKERNEL_HANDLE','AF_INET','AF_INET6','AF_UNIX',
                        'SOCK_STREAM','SOCK_DGRAM','IPPROTO_UDP','IPPROTO_TCP','IPPROTO_IPV6','IPV6_PKTINFO',
                        'IPV6_RTHDR','IPV6_TCLASS','IPV6_NEXTHOP','IPV6_2292PKTOPTIONS','SOL_SOCKET','SO_REUSEADDR',
                        'SO_LINGER','INADDR_ANY','PROT_NONE','PROT_READ','PROT_WRITE','PROT_EXECUTE','GPU_READ','GPU_WRITE',
                        'GPU_RW','MAP_SHARED','MAP_PRIVATE','MAP_FIXED','MAP_ANONYMOUS','MAP_NO_COALESCE',
                        'O_RDONLY','O_WRONLY','O_RDWR','O_CREAT','O_TRUNC','O_APPEND','O_NONBLOCK',
                        'SIGILL','SIGKILL','SIGBUS','SIGSEGV','SA_SIGINFO','STDIN_FILENO','STDOUT_FILENO','STDERR_FILENO',
                        'ROP','DLSYM_OFFSETS','write_string','alloc_string','get_error_string','sysctlbyname',
                        'get_fwversion','create_pipe','read_buffer','write_buffer','read_null_terminated_string',
                        'find_pattern','get_current_ip','is_jailbroken','check_jailbroken','load_prx','dlsym',
                        'get_title_id','find_mod_by_name','file_exists','read_file','write_file','get_nidpath',
                        'nanosleep','get_dlsym_offset','send_network','kill_youtube','checkLogServer',
                        'kernel','kernel_offset','gpu','ipv6_kernel_rw','phys_to_dmap','virt_to_phys',
                        'get_proc_cr3','cpu_pde_field','cpu_walk_pt','find_proc_by_name','find_proc_by_pid',
                        'get_pdb2_addr','get_ptb_entry_of_relative_va','alloc_main_dmem','get_curproc_vmid',
                        'get_gvmspace','get_relative_va','get_kernel_offset','update_kernel_offsets',
                        'patch_dynlib_restriction','restore_dynlib_restriction','elf_parse','elf_run',
                        'elf_wait_for_exit','elf_loader','load_localscript','FW_VERSION',
                        'compare_version','PS5_KEYS','gadgets_eu_6','gadgets_us_5','gadgets_list',
                        code
                    );
                    await fn(
                        logFunc, toHex, showNotification, emuSyscall, SYSCALL,
                        simMalloc, simRead64, simWrite64, simRead32, simWrite32, simRead8, simWrite8,
                        simRead16, simWrite16, simAddrof, simCreateFakeobj, (obj)=>simAddrof(obj)+0x10n,
                        (x)=>x, ()=>0x900010000n, ()=>0x200000000n, ()=>0n, simMalloc(8), [0n], 0n, [], [], {},
                        EBOOT_BASE, LIBC_BASE, LIBKERNEL_BASE, LIBC_BASE+0x113B18n+0x7n,
                        LIBC_BASE+0x73520n, LIBC_BASE+0xCC5A0n, LIBKERNEL_BASE+(DLSYM_OFFSETS[FW_VERSION]||0x350E0n),
                        EBOOT_BASE+0x2A65EF8n, EBOOT_BASE+0x2A65F00n,
                        LIBC_BASE+0x4BF0n, LIBC_BASE+0x49F0n, LIBC_BASE+0x113C08n,
                        false, LOG_SERVER, null, null, 'Netflix N Hack / Y2JB',
                        0x4000, 0x1000, 0x2001n, 2n, 28n, 1n, 1n, 2n, 17n, 6n, 41n,
                        46n, 51n, 61n, 48n, 25n, 0xffffn, 4n, 0x80n, 0n,
                        0x0n,0x1n,0x2n,0x4n, 0x10n,0x20n,0x30n,
                        0x1n,0x2n,0x10n,0x1000n,0x400000n,
                        0n,1n,2n,0x200n,0x400n,0x8n,0x4n,
                        4n,9n,10n,11n,0x4n,0n,1n,2n,
                        ROP, DLSYM_OFFSETS,
                        write_string, alloc_string, get_error_string, sysctlbyname,
                        get_fwversion, create_pipe, read_buffer, write_buffer,
                        read_null_terminated_string, find_pattern, get_current_ip,
                        is_jailbroken, check_jailbroken, load_prx, dlsym,
                        get_title_id, find_mod_by_name, file_exists, read_file,
                        write_file, get_nidpath, nanosleep, get_dlsym_offset,
                        send_network, kill_youtube, checkLogServer,
                        kernel, kernel_offset, gpu, ipv6_kernel_rw,
                        phys_to_dmap, virt_to_phys, get_proc_cr3, cpu_pde_field,
                        cpu_walk_pt, find_proc_by_name, find_proc_by_pid,
                        get_pdb2_addr, get_ptb_entry_of_relative_va,
                        alloc_main_dmem, get_curproc_vmid, get_gvmspace,
                        get_relative_va, ()=>({}), ()=>{},
                        patch_dynlib_restriction, restore_dynlib_restriction,
                        elf_parse, elf_run, elf_wait_for_exit, elf_loader,
                        load_localscript, FW_VERSION,
                        (a,b) => { const [am,an]=a.split('.').map(Number); const [bm,bn]=b.split('.').map(Number); return am===bm?an-bn:am-bm; },
                        PS5_KEYS, gadgets_eu_6, gadgets_us_5, gadgets_list
                    );
                    await logFunc('[DONE] Payload executed.');
                } catch(e) { await logFunc('[ERROR] '+e.message); }
                await logFunc('─'.repeat(40));
            }

            // YouTube Run button
            ytBtnRun.addEventListener('click', async () => {
                const code = ytPayloadInput.value.trim();
                if(!code) { showNotification('Enter a payload first.'); return; }
                ytBtnRun.disabled = true; ytBtnRun.textContent = '⏳ Running...';
                await executePayload(code, ytLog);
                ytBtnRun.disabled = false; ytBtnRun.textContent = '▶ Run Script';
            });

            // Netflix Run button
            nfBtnRun.addEventListener('click', async () => {
                const code = nfPayloadInput.value.trim();
                if(!code) { showNotification('Enter a payload first.'); return; }
                nfBtnRun.disabled = true; nfBtnRun.textContent = '⏳ Running...';
                await executePayload(code, nfLog);
                nfBtnRun.disabled = false; nfBtnRun.textContent = '▶ Run Script';
            });

            // Example buttons & clear for both consoles
            document.querySelectorAll('.btn-example').forEach(btn => {
                btn.addEventListener('click', () => {
                    const console = btn.dataset.console;
                    const key = btn.dataset.payload;
                    const examples = {
                        yt: {
                            helloworld: `await log("Hello from Y2JB!");\nsend_notification("Hello!");`,
                            setlogserver: `LOG_SERVER = 'http://192.168.1.180:8080/log';\nawait log("Log server set to " + LOG_SERVER);`,
                            dlsym_test: `check_jailbroken();\nlet addr = dlsym(0x2001n, "sceKernelAllocateMainDirectMemory");\nawait log("dlsym -> " + toHex(addr));`
                        },
                        nf: {
                            helloworld: `await log("Hello from Netflix N Hack!");\nsend_notification("Hello!");`,
                            netflix_hack: `/* Netflix-N-Hack exploit simulation */
(async () => {
    await log("Netflix-N-Hack started...");
    let hole = make_hole(); // mock
    await log("Hole created: " + toHex(hole));
    await log("Exploit chain complete. Enjoy!");
})();`
                        }
                    };
                    if (console === 'yt') {
                        ytPayloadInput.value = examples.yt[key] || '';
                        ytPayloadInput.focus();
                    } else {
                        nfPayloadInput.value = examples.nf[key] || '';
                        nfPayloadInput.focus();
                    }
                });
            });

            document.querySelectorAll('.btn-clear').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (btn.dataset.console === 'yt') {
                        ytLogContainer.innerHTML = ''; ytLog('Console cleared.', 'dim');
                    } else {
                        nfLogContainer.innerHTML = ''; nfLog('Console cleared.', 'dim');
                    }
                });
            });

            // Mock make_hole for Netflix payloads
            window.make_hole = function() { return 0x1337n; };

            // Boot & home UI
            function generateParticles() {
                const container = document.getElementById('particlesContainer');
                container.innerHTML = '';
                for(let i=0;i<30;i++) {
                    const p = document.createElement('div'); p.className='particle';
                    const size = Math.random()*4+2;
                    p.style.width=size+'px'; p.style.height=size+'px';
                    p.style.left=Math.random()*100+'%'; p.style.top=Math.random()*100+'%';
                    p.style.animationDelay=Math.random()*5+'s';
                    container.appendChild(p);
                }
            }
            function updateClock() {
                const now = new Date();
                let hours = now.getHours();
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12 || 12;
                const mins = String(now.getMinutes()).padStart(2,'0');
                document.getElementById('homeTime').textContent = `${hours}:${mins} ${ampm}`;
            }
            setInterval(updateClock, 1000); updateClock();

            function startBoot() {
                bootScreen.style.display='flex';
                homeScreen.style.display='none';
                ytEmulator.style.display='none';
                nfEmulator.style.display='none';
                let progress = 0;
                const interval = setInterval(() => {
                    progress += Math.random()*8;
                    if(progress>100) progress=100;
                    bootProgressBar.style.width = progress+'%';
                    bootStatus.textContent = progress<30?'Initializing...':progress<70?'Loading system...':'Almost ready...';
                    if(progress>=100) {
                        clearInterval(interval);
                        bootStatus.textContent = 'Welcome';
                        setTimeout(()=>{
                            bootScreen.style.opacity='0';
                            setTimeout(()=>{
                                bootScreen.style.display='none';
                                homeScreen.style.display='flex';
                                generateParticles();
                            },800);
                        },600);
                    }
                },500);
            }

            // App icon click handlers
            document.getElementById('youtubeAppIcon').addEventListener('click', () => {
                homeScreen.style.display='none';
                ytEmulator.style.display='flex';
                initYTEmulator();
            });
            document.getElementById('netflixAppIcon').addEventListener('click', () => {
                homeScreen.style.display='none';
                nfEmulator.style.display='flex';
                initNFEmulator();
            });

            // Mode selection flow
            document.getElementById('btnJbMode').addEventListener('click', () => {
                simJailbroken = true; simUid=0n; simSandbox=0n;
                modeModal.style.display='none'; fwModal.style.display='flex';
            });
            document.getElementById('btnStockMode').addEventListener('click', () => {
                simJailbroken = false; simUid=1n; simSandbox=1n;
                modeModal.style.display='none'; fwModal.style.display='flex';
            });
            document.getElementById('btnFwConfirm').addEventListener('click', () => {
                FW_VERSION = document.getElementById('fwSelect').value;
                fwModal.style.display='none';
                startBoot();
            });

            // Prevent zoom
            document.addEventListener('gesturestart', e=>e.preventDefault());
            document.addEventListener('gesturechange', e=>e.preventDefault());
            document.addEventListener('gestureend', e=>e.preventDefault());

            // Initial state
            bootScreen.style.display='none';
            fwModal.style.display='none';
            modeModal.style.display='flex';
        })();
    </script>
</body>
</html>
