<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y2JB Emulator – JB/Stock Toggle</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --border: #2a2a2a;
            --text: #e0e0e0;
            --dim: #888;
            --accent: #3b82f6;
            --accent-glow: #3b82f680;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #eab308;
            --cyan: #06b6d4;
            --ps-blue: #003087;
            --ps-light: #1a5fcf;
            --notify-bg: #1a1a2e;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', 'Courier New', monospace;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#000; color:var(--text); font-family:var(--font-mono);
            height:100vh; display:flex; flex-direction:column; overflow:hidden;
            user-select:none; -webkit-user-select:none;
        }
        .ps5-topbar {
            background:#0c0c0c; border-bottom:1px solid #1a1a1a;
            padding:8px 20px; display:flex; align-items:center; justify-content:space-between;
            flex-shrink:0; z-index:10;
        }
        .ps5-topbar .logo-area { display:flex; align-items:center; gap:14px; }
        .ps5-logo {
            width:36px; height:36px; background:linear-gradient(135deg, #003087, #0044cc);
            border-radius:6px; display:flex; align-items:center; justify-content:center;
            font-weight:900; font-size:14px; color:#fff; letter-spacing:-0.5px;
        }
        .ps5-topbar .title { font-size:15px; font-weight:600; letter-spacing:0.3px; color:#fff; }
        .ps5-topbar .subtitle { font-size:11px; color:#888; margin-left:8px; }
        .fw-badge { background:#1a1a1a; border:1px solid #333; padding:4px 10px; border-radius:12px; font-size:11px; color:#ccc; }
        .jb-badge {
            background:#1a1a1a; border:1px solid #333; padding:4px 10px; border-radius:12px;
            font-size:11px; margin-left:12px; cursor:pointer; transition:all 0.2s;
        }
        .jb-badge.stock { color:#ef4444; border-color:#ef4444; }
        .jb-badge.jb { color:#22c55e; border-color:#22c55e; }
        .status-dot {
            width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px;
            box-shadow:0 0 8px; animation:pulse-dot 2s infinite;
        }
        @keyframes pulse-dot { 0%,100%{ box-shadow:0 0 4px; } 50%{ box-shadow:0 0 14px; } }
        .status-text { font-size:11px; color:#aaa; display:flex; align-items:center; gap:6px; }
        .main-content { flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative; }
        .yt-frame {
            flex:1; display:flex; flex-direction:column; margin:10px;
            border:2px solid #1a1a1a; border-radius:8px; overflow:hidden; background:#0d0d0d;
        }
        .yt-frame-header {
            background:#161616; padding:8px 16px; border-bottom:1px solid #222;
            display:flex; align-items:center; gap:10px; flex-shrink:0;
        }
        .yt-dot { width:10px; height:10px; border-radius:50%; background:#333; }
        .yt-dot.red { background:#ff5f57; } .yt-dot.yellow { background:#febc2e; } .yt-dot.green { background:#28c840; }
        .yt-frame-header span { font-size:11px; color:#666; margin-left:8px; }
        .log-container {
            flex:1; overflow-y:auto; padding:12px 16px; font-size:12px; line-height:1.6;
            background:#080808; scroll-behavior:smooth;
        }
        .log-container::-webkit-scrollbar { width:6px; }
        .log-container::-webkit-scrollbar-track { background:transparent; }
        .log-container::-webkit-scrollbar-thumb { background:#222; border-radius:3px; }
        .log-line { white-space:pre-wrap; word-break:break-all; animation:fadeInLine 0.15s ease; }
        @keyframes fadeInLine { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
        .log-line.dim { color:#666; } .log-line.accent { color:var(--accent); } .log-line.green { color:var(--green); }
        .log-line.yellow { color:var(--yellow); } .log-line.red { color:var(--red); } .log-line.cyan { color:var(--cyan); }
        .input-area {
            border-top:1px solid #1a1a1a; background:#0f0f0f; padding:12px 16px;
            flex-shrink:0; display:flex; gap:10px; align-items:flex-end;
        }
        .input-area textarea {
            flex:1; background:#1a1a1a; border:1px solid #2a2a2a; color:#e0e0e0;
            font-family:var(--font-mono); font-size:12px; padding:10px 14px; border-radius:6px;
            resize:vertical; min-height:60px; max-height:200px; outline:none; transition:border-color 0.2s;
        }
        .input-area textarea:focus { border-color:var(--accent); box-shadow:0 0 12px var(--accent-glow); }
        .btn {
            padding:10px 20px; border:none; border-radius:6px; font-family:var(--font-mono);
            font-size:12px; font-weight:600; cursor:pointer; transition:all 0.2s;
            letter-spacing:0.5px; white-space:nowrap;
        }
        .btn-run { background:var(--accent); color:#fff; box-shadow:0 0 16px var(--accent-glow); }
        .btn-run:hover { background:#2563eb; box-shadow:0 0 24px var(--accent-glow); transform:translateY(-1px); }
        .btn-run:active { transform:scale(0.96); }
        .btn-run:disabled { background:#333; color:#666; box-shadow:none; cursor:not-allowed; }
        .btn-example { background:#1a1a1a; color:#aaa; border:1px solid #2a2a2a; font-size:11px; padding:6px 12px; }
        .btn-example:hover { background:#222; color:#fff; border-color:#444; }
        .btn-clear { background:transparent; color:#888; border:1px solid #2a2a2a; font-size:11px; padding:6px 12px; }
        .examples-row { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
        .notifications-container {
            position:fixed; top:60px; right:16px; z-index:100; display:flex; flex-direction:column; gap:8px; pointer-events:none;
        }
        .ps5-notification {
            background:var(--notify-bg); border:1px solid #2a2a4a; border-radius:8px; padding:14px 18px;
            max-width:380px; box-shadow:0 8px 32px rgba(0,0,0,0.6);
            animation:slideInNotif 0.35s ease, fadeOutNotif 0.5s ease forwards;
            animation-delay:0s, 3.5s; pointer-events:auto; display:flex; align-items:flex-start; gap:10px;
        }
        .ps5-notification .notif-icon { width:28px; height:28px; border-radius:50%; background:#1a3a5c; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px; }
        .ps5-notification .notif-text { font-size:12px; color:#ddd; line-height:1.4; white-space:pre-wrap; word-break:break-word; }
        @keyframes slideInNotif { from{transform:translateX(120%); opacity:0;} to{transform:translateX(0); opacity:1;} }
        @keyframes fadeOutNotif { from{opacity:1;} to{opacity:0; transform:translateY(-10px);} }
        .listener-bar {
            background:#0d1117; border:1px solid #1a3a2a; border-radius:6px; padding:8px 14px;
            margin:6px 10px; font-size:11px; color:#8b8; display:flex; align-items:center; gap:8px; flex-shrink:0;
        }
        .listener-bar .pulse { width:7px; height:7px; border-radius:50%; background:#4f4; animation:pulse-dot 1.5s infinite; }
        .fw-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:200; display:flex; align-items:center; justify-content:center; }
        .fw-modal { background:#1a1a1a; border:1px solid #333; border-radius:12px; padding:24px; min-width:320px; text-align:center; }
        .fw-modal h3 { margin-bottom:16px; font-size:16px; }
        .fw-modal select { background:#0a0a0a; color:#fff; border:1px solid #333; padding:8px 16px; border-radius:6px; font-family:var(--font-mono); font-size:13px; width:100%; margin-bottom:16px; cursor:pointer; }
        .fw-modal .btn { width:100%; }
        @media (max-width:600px) {
            .ps5-topbar { padding:6px 12px; } .ps5-topbar .title { font-size:13px; }
            .input-area { flex-direction:column; padding:8px 10px; } .input-area textarea { min-height:50px; font-size:11px; }
            .btn { padding:8px 14px; font-size:11px; } .log-container { font-size:10px; padding:8px 10px; }
            .notifications-container { right:4px; top:50px; } .ps5-notification { max-width:260px; padding:10px 14px; font-size:10px; }
        }
    </style>
</head>
<body>
    <div class="ps5-topbar">
        <div class="logo-area">
            <div class="ps5-logo">PS</div>
            <span class="title">YouTube</span>
            <span class="subtitle">· Y2JB v1.4</span>
            <span class="fw-badge" id="fwBadge">FW 10.01</span>
            <span class="jb-badge jb" id="jbBadge" title="Click to toggle Jailbreak">🔓 JB</span>
        </div>
        <div class="status-text">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusLabel">Remote JS Loader Active</span>
        </div>
    </div>
    <div class="listener-bar" id="listenerBar">
        <span class="pulse"></span>
        <span>Listening on <strong id="listenerAddr">192.168.1.100:50000</strong></span>
        <span style="margin-left:auto;color:#666;">Paste payload below &amp; click Run</span>
    </div>
    <div class="main-content">
        <div class="yt-frame">
            <div class="yt-frame-header">
                <span class="yt-dot red"></span>
                <span class="yt-dot yellow"></span>
                <span class="yt-dot green"></span>
                <span>Y2JB Console</span>
            </div>
            <div class="log-container" id="logContainer"></div>
            <div class="input-area">
                <textarea id="payloadInput" placeholder="Paste your JS payload here...&#10;&#10;Example:&#10;await log('Hello from remote JS!');&#10;send_notification('Hello from remote JS!');" spellcheck="false"></textarea>
                <button class="btn btn-run" id="btnRun" title="Send payload to emulated PS5">▶ Run Script</button>
            </div>
            <div class="examples-row" style="padding:0 16px 8px;">
                <button class="btn btn-example" data-payload="helloworld">👋 Hello World</button>
                <button class="btn btn-example" data-payload="setlogserver">📡 Set Log Server</button>
                <button class="btn btn-example" data-payload="dlsym_test">🔍 dlsym Test</button>
                <button class="btn btn-clear" id="btnClear">🗑 Clear Log</button>
            </div>
        </div>
    </div>
    <div class="notifications-container" id="notificationsContainer"></div>
    <div class="fw-modal-overlay" id="fwModal">
        <div class="fw-modal">
            <h3>Select PS5 Firmware</h3>
            <select id="fwSelect">
                <option value="4.03">4.03</option><option value="4.50">4.50</option><option value="4.51">4.51</option>
                <option value="5.00">5.00</option><option value="5.02">5.02</option><option value="5.10">5.10</option>
                <option value="5.50">5.50</option><option value="6.00">6.00</option><option value="6.02">6.02</option>
                <option value="6.50">6.50</option><option value="7.00">7.00</option><option value="7.01">7.01</option>
                <option value="7.20">7.20</option><option value="7.40">7.40</option><option value="7.60">7.60</option>
                <option value="7.61">7.61</option><option value="8.00">8.00</option><option value="8.20">8.20</option>
                <option value="8.40">8.40</option><option value="8.60">8.60</option><option value="9.00">9.00</option>
                <option value="9.05">9.05</option><option value="9.20">9.20</option><option value="9.40">9.40</option>
                <option value="9.60">9.60</option><option value="10.00" selected>10.00</option><option value="10.01">10.01</option>
                <option value="10.20">10.20</option><option value="10.40">10.40</option><option value="10.60">10.60</option>
                <option value="11.00">11.00</option><option value="11.20">11.20</option><option value="11.40">11.40</option>
                <option value="11.60">11.60</option><option value="12.00">12.00</option><option value="12.20">12.20</option>
                <option value="12.40">12.40</option><option value="12.60">12.60</option><option value="12.70">12.70</option>
                <option value="13.00">13.00</option><option value="13.20">13.20</option>
            </select>
            <button class="btn btn-run" id="btnFwConfirm">Confirm & Start Emulator</button>
        </div>
    </div>

    <script>
        (function() {
            // ==================== Y2JB EMULATOR ENGINE ====================
            const EMULATOR_VERSION = "Y2JB 1.4 Emulator OS booting";
            let FW_VERSION = "10.00";
            let emulatorReady = false;
            let exploitInitialized = false;
            const logContainer = document.getElementById('logContainer');
            const notifContainer = document.getElementById('notificationsContainer');
            const payloadInput = document.getElementById('payloadInput');
            const btnRun = document.getElementById('btnRun');
            const fwBadge = document.getElementById('fwBadge');
            const jbBadge = document.getElementById('jbBadge');
            const listenerAddr = document.getElementById('listenerAddr');
            const statusDot = document.getElementById('statusDot');
            const statusLabel = document.getElementById('statusLabel');
            const fwModal = document.getElementById('fwModal');
            const fwSelect = document.getElementById('fwSelect');
            const btnFwConfirm = document.getElementById('btnFwConfirm');

            // Simulated memory
            const simMemory = new Map();
            let nextMallocAddr = 0x800000000n;
            let nextFdId = 100n;
            const simFileSystem = new Map();
            const simFileData = new Map();
            let simJailbroken = false;          // default stock until toggled
            let simUid = 1n;
            let simPid = 42n;
            let simSandbox = 1n;                // non‑JB: 1 (sandboxed)
            const openFds = new Map();

            // Memory helpers
            function simRead8(addr) {
                const aligned = addr & ~7n;
                const offset = Number(addr & 7n);
                const qword = simMemory.get(aligned) || 0n;
                return (qword >> BigInt(offset * 8)) & 0xFFn;
            }
            function simWrite8(addr, val) {
                const aligned = addr & ~7n;
                const offset = Number(addr & 7n);
                const qword = simMemory.get(aligned) || 0n;
                const mask = 0xFFn << BigInt(offset * 8);
                simMemory.set(aligned, (qword & ~mask) | ((BigInt(val) & 0xFFn) << BigInt(offset * 8)));
            }
            function simRead16(addr) {
                const qword = simMemory.get(addr & ~7n) || 0n;
                const offset = Number(addr & 7n);
                return (qword >> BigInt(offset * 8)) & 0xFFFFn;
            }
            function simWrite16(addr, val) {
                const aligned = addr & ~7n;
                const offset = Number(addr & 7n);
                const qword = simMemory.get(aligned) || 0n;
                const mask = 0xFFFFn << BigInt(offset * 8);
                simMemory.set(aligned, (qword & ~mask) | ((BigInt(val) & 0xFFFFn) << BigInt(offset * 8)));
            }
            function simRead32(addr) {
                const qword = simMemory.get(addr & ~7n) || 0n;
                const offset = Number(addr & 7n);
                return (qword >> BigInt(offset * 8)) & 0xFFFFFFFFn;
            }
            function simWrite32(addr, val) {
                const aligned = addr & ~7n;
                const offset = Number(addr & 7n);
                const qword = simMemory.get(aligned) || 0n;
                const mask = 0xFFFFFFFFn << BigInt(offset * 8);
                simMemory.set(aligned, (qword & ~mask) | ((BigInt(val) & 0xFFFFFFFFn) << BigInt(offset * 8)));
            }
            function simRead64(addr) { return simMemory.get(addr) || 0n; }
            function simWrite64(addr, val) { simMemory.set(addr, BigInt(val)); }
            function simMalloc(size) {
                const addr = nextMallocAddr;
                nextMallocAddr += BigInt(Math.ceil(Number(size) / 8) * 8 + 16);
                simWrite64(addr, BigInt(size));
                return addr + 8n;
            }
            function simAllocString(str) {
                const encoder = new TextEncoder();
                const bytes = encoder.encode(str);
                const addr = simMalloc(bytes.length + 1);
                for (let i = 0; i < bytes.length; i++) simWrite8(addr + BigInt(i), bytes[i]);
                simWrite8(addr + BigInt(bytes.length), 0);
                return addr;
            }
            function simReadString(addr) {
                let result = '';
                let i = 0n;
                while (true) {
                    const b = Number(simRead8(addr + i));
                    if (b === 0) break;
                    result += String.fromCharCode(b);
                    i++;
                    if (i > 10000n) break;
                }
                return result;
            }
            function simReadBuffer(addr, len) {
                const buf = new Uint8Array(Number(len));
                for (let i = 0n; i < len; i++) buf[Number(i)] = Number(simRead8(addr + i));
                return buf;
            }
            function simWriteBuffer(addr, buf) {
                for (let i = 0; i < buf.length; i++) simWrite8(addr + BigInt(i), buf[i]);
            }

            // Mock addresses
            const EBOOT_BASE = 0x00400000n;
            const LIBC_BASE = 0x00800000n;
            const LIBKERNEL_BASE = 0x00C00000n;
            const DATA_BASE = 0x0CC0000n;
            const MOCK_CURPROC = 0xFFFF804000010000n;
            const MOCK_ALLPROC = MOCK_CURPROC;
            const MOCK_ROOTVNODE = 0xFFFF804000020000n;
            const MOCK_KERNEL_PMAP = 0xFFFF804000030000n;
            const MOCK_GVMSPACE = 0xFFFF804000040000n;

            let fakeObjCounter = 0;
            const fakeObjAddrs = new Map();
            function simAddrof(obj) {
                if (obj === null || obj === undefined) return 0n;
                if (typeof obj === 'bigint') return obj;
                if (fakeObjAddrs.has(obj)) return fakeObjAddrs.get(obj);
                const addr = 0x900000000n + BigInt(fakeObjCounter++) * 0x100n;
                fakeObjAddrs.set(obj, addr);
                return addr;
            }
            function simCreateFakeobj(addr) {
                const key = { _fake: true, _addr: addr };
                fakeObjAddrs.set(key, addr);
                return key;
            }

            // UI
            function appendLog(msg, className = '') {
                const div = document.createElement('div');
                div.className = 'log-line ' + (className || '');
                div.textContent = msg;
                logContainer.appendChild(div);
                logContainer.scrollTop = logContainer.scrollHeight;
            }
            async function emuLog(msg) {
                const text = String(msg);
                const lines = text.split('\n');
                for (const line of lines) appendLog(line || '\u00A0');
                await new Promise(r => requestAnimationFrame(() => setTimeout(r, 1)));
            }
            function showNotification(text) {
                const notif = document.createElement('div');
                notif.className = 'ps5-notification';
                notif.innerHTML = `<div class="notif-icon">📢</div><div class="notif-text">${text.replace(/\n/g, '<br>')}</div>`;
                notifContainer.appendChild(notif);
                setTimeout(() => { if (notif.parentNode) notif.remove(); }, 4200);
            }
            function updateStatus(ready) {
                if (!ready) {
                    statusDot.style.background = 'var(--yellow)';
                    statusDot.style.boxShadow = '0 0 8px var(--yellow)';
                    statusLabel.textContent = 'Initializing...';
                    btnRun.disabled = true;
                } else if (simJailbroken) {
                    statusDot.style.background = 'var(--green)';
                    statusDot.style.boxShadow = '0 0 8px var(--green)';
                    statusLabel.textContent = 'Remote JS Loader Active (JB)';
                    btnRun.disabled = false;
                } else {
                    statusDot.style.background = '#f97316'; // orange
                    statusDot.style.boxShadow = '0 0 8px #f97316';
                    statusLabel.textContent = 'Remote JS Loader Active (Stock)';
                    btnRun.disabled = false;
                }
            }
            function updateJbUI() {
                if (simJailbroken) {
                    jbBadge.className = 'jb-badge jb';
                    jbBadge.innerHTML = '🔓 JB';
                } else {
                    jbBadge.className = 'jb-badge stock';
                    jbBadge.innerHTML = '🔒 Stock';
                }
                updateStatus(true);
            }

            // JB toggle
            jbBadge.addEventListener('click', () => {
                simJailbroken = !simJailbroken;
                simUid = simJailbroken ? 0n : 1n;
                simSandbox = simJailbroken ? 0n : 1n;
                updateJbUI();
                showNotification(simJailbroken ? 'Switched to Jailbroken mode' : 'Switched to Stock (non‑JB) mode');
            });

            // Syscall simulation with JB checks
            const SYSCALL_NUMBERS = {
                read: 0x3n, write: 0x4n, open: 0x5n, close: 0x6n,
                setuid: 0x17n, getuid: 0x18n, getpid: 0x14n,
                accept: 0x1en, pipe: 0x2an, mprotect: 0x4an,
                socket: 0x61n, connect: 0x62n, bind: 0x68n, setsockopt: 0x69n,
                listen: 0x6an, getsockopt: 0x76n, getsockname: 0x20n,
                netgetiflist: 0x7dn, sendto: 0x85n, sysctl: 0xcan,
                nanosleep: 0xf0n, sigaction: 0x1a0n, thr_self: 0x1b0n,
                thr_exit: 0x1afn, thr_new: 0x1c7n, dlsym: 0x24fn,
                dynlib_load_prx: 0x252n, dynlib_unload_prx: 0x253n,
                randomized_path: 0x25an, is_in_sandbox: 0x249n,
                mmap: 0x1ddn, jitshm_create: 0x215n, jitshm_alias: 0x216n,
                unlink: 0xan, chmod: 0xfn, recvfrom: 0x1dn, rename: 0x80n,
                mkdir: 0x88n, rmdir: 0x89n, stat: 0xbcn, getdents: 0x110n,
                lseek: 0x1den, dup2: 0x5an, fcntl: 0x5cn, select: 0x5dn,
                fstat: 0xbdn, umtx_op: 0x1c6n, cpuset_getaffinity: 0x1e7n,
                cpuset_setaffinity: 0x1e8n, rtprio_thread: 0x1d2n,
                ftruncate: 0x1e0n, sched_yield: 0x14bn, munmap: 0x49n,
                fsync: 0x5fn, ioctl: 0x36n, kill: 0x25n, kqueue: 0x16An,
                __sys_kqueueex: 0x8dn, recvmsg: 0x1Bn, readv: 0x78n,
                writev: 0x79n, socketpair: 0x87n, evf_create: 0x21an,
                evf_delete: 0x21bn, evf_set: 0x220n, evf_clear: 0x221n,
                thr_suspend_ucontext: 0x278n, thr_resume_ucontext: 0x279n,
                aio_multi_delete: 0x296n, aio_multi_wait: 0x297n,
                aio_multi_poll: 0x298n, aio_multi_cancel: 0x29an,
                aio_submit_cmd: 0x29dn,
            };

            function emuSyscall(num, arg1, arg2, arg3, arg4, arg5, arg6) {
                const n = BigInt(num);
                arg1 = BigInt(arg1 || 0n); arg2 = BigInt(arg2 || 0n); arg3 = BigInt(arg3 || 0n);
                arg4 = BigInt(arg4 || 0n); arg5 = BigInt(arg5 || 0n); arg6 = BigInt(arg6 || 0n);

                // Privileged syscalls that fail in non‑JB (return 0 = error)
                const privileged = [
                    SYSCALL_NUMBERS.setuid, SYSCALL_NUMBERS.dlsym,
                    SYSCALL_NUMBERS.jitshm_create, SYSCALL_NUMBERS.jitshm_alias,
                    SYSCALL_NUMBERS.mprotect,
                ];
                if (!simJailbroken && privileged.includes(n)) return 0n;

                        is_jailbroken, check_jailbroken, load_prx, dlsym,
                        get_title_id, find_mod_by_name, file_exists, read_file,
                        write_file, get_nidpath, nanosleep, get_dlsym_offset,
                        send_network, kill_youtube, checkLogServer,
                        { addr: { curproc: MOCK_CURPROC, allproc: MOCK_ALLPROC, data_base: DATA_BASE, dmap_base: 0xFFFF804000000000n, kernel_cr3: 0x100000n, rootvnode: MOCK_ROOTVNODE },
                          read_buffer: (a,s) => simReadBuffer(a,s), write_buffer: (a,b) => simWriteBuffer(a,b),
                          read_byte: simRead8, read_word: simRead16, read_dword: simRead32, read_qword: simRead64,
                          write_byte: simWrite8, write_word: simWrite16, write_dword: simWrite32, write_qword: simWrite64,
                          read_null_terminated_string: simReadString },
                        {}, { data_base: DATA_BASE }, {},
                        phys_to_dmap, virt_to_phys, get_proc_cr3, cpu_pde_field,
                        cpu_walk_pt, find_proc_by_name, find_proc_by_pid,
                        get_pdb2_addr, get_ptb_entry_of_relative_va,
                        alloc_main_dmem, get_curproc_vmid, get_gvmspace,
                        get_relative_va, () => ({}), ()=>{},
                        patch_dynlib_restriction, restore_dynlib_restriction,
                        elf_parse, elf_run, elf_wait_for_exit, elf_loader,
                        load_localscript, FW_VERSION
                    );
                    await emuLog('[DONE] Payload executed.');
                } catch (e) {
                    await emuLog('[ERROR] ' + e.message);
                    await emuLog(e.stack || '');
                    showNotification('Payload Error: ' + e.message);
                }
                await emuLog('─'.repeat(40));
            }

            // Event listeners
            btnRun.addEventListener('click', async () => {
                const code = payloadInput.value.trim();
                if (!code) { showNotification('Please paste a JS payload.'); return; }
                btnRun.disabled = true;
                btnRun.textContent = '⏳ Running...';
                try { await executePayload(code); }
                finally { btnRun.disabled = false; btnRun.textContent = '▶ Run Script'; }
            });
            document.getElementById('btnClear').addEventListener('click', () => {
                logContainer.innerHTML = '';
                appendLog('Log cleared.', 'dim');
            });
            document.querySelectorAll('.btn-example').forEach(btn => {
                btn.addEventListener('click', () => {
                    const key = btn.dataset.payload;
                    if (examplePayloads[key]) {
                        payloadInput.value = examplePayloads[key];
                        payloadInput.focus();
                        showNotification('Loaded: ' + btn.textContent.trim());
                    }
                });
            });
            btnFwConfirm.addEventListener('click', async () => {
                FW_VERSION = fwSelect.value;
                fwBadge.textContent = 'FW ' + FW_VERSION;
                fwModal.style.display = 'none';
                await initializeEmulator();
            });
            payloadInput.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault(); btnRun.click();
                }
            });

            // Start: show FW modal
            updateStatus(false);
            appendLog('Y2JB Emulator', 'cyan');
            appendLog('Select firmware version to begin...', 'dim');
            fwModal.style.display = 'flex';
            fwSelect.focus();
            payloadInput.value = examplePayloads.helloworld;
            console.log('%cY2JB Emulator v1.4%c | JB toggle ready', 'color:#3b82f6;font-size:16px;', '');
        })();
    </script>
</body>
</html>
